name: Retail Promotion Page Smoke Test

on:
  workflow_run:
    workflows: ["Deploy Daily Brief to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify latest promotions in every public navbar
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time, urllib.request

          base='https://kanuli.github.io/daily-brief-newspaper/'
          pages=[
              'index.html','live.html','world.html','asia.html','hong-kong.html','japan.html',
              'finance.html','stocks.html','technology.html','manga-anime.html',
              'manchester-united.html','football.html','retail-deals.html','archive.html'
          ]
          nav_re=re.compile(r'<nav\b[^>]*class=["\'][^"\']*section-nav[^"\']*["\'][^>]*>(.*?)</nav>', re.I|re.S)
          retail_re=re.compile(r'<a\b[^>]*href=["\'][^"\']*retail-deals\.html[^"\']*["\'][^>]*>.*?</a>', re.I|re.S)

          def get(url):
              req=urllib.request.Request(url, headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'daily-brief-retail-smoke'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  if r.status != 200:
                      raise RuntimeError(f'{url} HTTP {r.status}')
                  return r.read().decode('utf-8','replace')

          last=None
          for attempt in range(12):
              try:
                  stamp=str(int(time.time()))
                  checked=[]
                  for page_name in pages:
                      html=get(base+page_name+'?v='+stamp)
                      match=nav_re.search(html)
                      if not match:
                          raise RuntimeError(f'{page_name}: section-nav not found')
                      nav=match.group(1)
                      retail_links=retail_re.findall(nav)
                      if len(retail_links) != 1 or '最新優惠' not in retail_links[0]:
                          raise RuntimeError(f'{page_name}: expected exactly one 最新優惠 retail link; found={len(retail_links)}')
                      retail=nav.find('retail-deals.html')
                      archive=nav.find('archive.html')
                      if min(retail, archive) < 0 or not retail < archive:
                          raise RuntimeError(f'{page_name}: 最新優惠 must be before Archive')
                      football=nav.find('football.html')
                      if football >= 0 and not football < retail:
                          raise RuntimeError(f'{page_name}: navbar order must be Football -> 最新優惠 -> Archive')
                      checked.append(page_name)

                  retail_page=get(base+'retail-deals.html?v='+stamp)
                  if '香港最新優惠' not in retail_page or 'retail-deals.js' not in retail_page:
                      raise RuntimeError('retail promotion page content incomplete')

                  data=json.loads(get(base+'data/retail-deals.json?v='+stamp))
                  if data.get('schemaVersion') != 3 or not isinstance(data.get('promotions'), list):
                      raise RuntimeError('promotion dataset invalid')
                  forbidden={'offers','products','currentPrice','regularPrice','priceHistory'}
                  text=json.dumps(data, ensure_ascii=False)
                  for key in forbidden:
                      if f'"{key}"' in text:
                          raise RuntimeError(f'forbidden price field published: {key}')

                  print('RETAIL_NAV_ALL_PUBLIC_PAGES_OK', 'pages', len(checked), 'order', 'Football>最新優惠>Archive', 'promotions', len(data['promotions']), 'generated', data.get('generatedAt'))
                  raise SystemExit(0)
              except Exception as exc:
                  last=exc
                  time.sleep(5)
          raise SystemExit(f'RETAIL_PUBLIC_SMOKE_FAIL: {last}')
          PY
