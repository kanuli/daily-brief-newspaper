name: Redeploy Manga Desk Recovery 2026-09-03 2222

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/redeploy-manga-depth-20260903-2222.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time redeploy trigger
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/redeploy-manga-depth-20260903-2222.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/redeploy-manga-depth-20260903-2222.yml
          git commit -m "Remove one-time Manga desk redeploy trigger"
          git push origin HEAD:main
