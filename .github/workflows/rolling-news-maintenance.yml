name: Rolling News Search Auto Maintenance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/rolling-news-maintenance.yml"
  workflow_run:
    workflows: ["Rolling News Search 15m"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: "rolling-news-search-auto-maintenance"
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect collector progress and run health
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        shell: bash
        run: |
          set -euo pipefail

          git init -q /tmp/staging-repo
          cd /tmp/staging-repo
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin news-staging || true
          AGE_SECONDS=999999
          LAST_SEARCH_AT=""
          if git show FETCH_HEAD:data/search-staging.json > /tmp/search-staging.json 2>/dev/null; then
            read -r AGE_SECONDS LAST_SEARCH_AT < <(python - <<'PY'
          import json
          from datetime import datetime, timezone
          data=json.load(open('/tmp/search-staging.json',encoding='utf-8'))
          stamp=data.get('lastSearchAt') or data.get('lastSearchStartedAt') or ''
          age=999999
          if stamp:
              try:
                  then=datetime.fromisoformat(stamp.replace('Z','+00:00'))
                  age=max(0,int((datetime.now(timezone.utc)-then).total_seconds()))
              except Exception:
                  pass
          print(age, stamp)
          PY
            )
          fi
          echo "Rolling staging: lastSearchAt=${LAST_SEARCH_AT:-missing}; age=${AGE_SECONDS}s"

          gh run list --repo "${{ github.repository }}" --workflow rolling-news-search.yml --branch main --limit 20 --json status,conclusion,databaseId,createdAt,updatedAt,event > /tmp/rolling-runs.json
          python - <<'PY' > /tmp/rolling-active.env
          import json
          from datetime import datetime, timezone

          runs=json.load(open('/tmp/rolling-runs.json',encoding='utf-8'))
          now=datetime.now(timezone.utc)

          def age_seconds(run):
              try:
                  t=datetime.fromisoformat(str(run.get('createdAt') or '').replace('Z','+00:00'))
                  return max(0,int((now-t).total_seconds()))
              except Exception:
                  return 0

          queued_statuses={'queued','requested','waiting','pending'}
          queued=[r for r in runs if r.get('status') in queued_statuses]
          running=[r for r in runs if r.get('status') == 'in_progress']

          print(f"QUEUED_COUNT={len(queued)}")
          print(f"RUNNING_COUNT={len(running)}")
          print(f"QUEUED_OLDEST_AGE_SECONDS={max((age_seconds(r) for r in queued), default=0)}")
          print(f"RUNNING_OLDEST_AGE_SECONDS={max((age_seconds(r) for r in running), default=0)}")
          print("QUEUED_IDS=" + ','.join(str(r.get('databaseId')) for r in queued if r.get('databaseId')))
          print("RUNNING_IDS=" + ','.join(str(r.get('databaseId')) for r in running if r.get('databaseId')))
          PY
          source /tmp/rolling-active.env
          echo "Rolling runs: queued=${QUEUED_COUNT} (${QUEUED_OLDEST_AGE_SECONDS}s); running=${RUNNING_COUNT} (${RUNNING_OLDEST_AGE_SECONDS}s)"

          STALE_SECONDS=1200
          RUNNING_STALE_SECONDS=900
          echo "restart=false" >> "$GITHUB_OUTPUT"
          echo "cancel_ids=" >> "$GITHUB_OUTPUT"

          if [ "$AGE_SECONDS" -lt "$STALE_SECONDS" ]; then
            echo "reason=staging-progress-current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A queued run is valid recovery work. Never cancel/requeue it merely
          # because runners are congested; doing that can starve the collector.
          if [ "$QUEUED_COUNT" -gt 0 ]; then
            echo "reason=collector-queued-awaiting-runner" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Let a running collector finish normally. Only replace a genuinely
          # stale in-progress run that has exceeded its normal execution grace.
          if [ "$RUNNING_COUNT" -gt 0 ]; then
            if [ "$RUNNING_OLDEST_AGE_SECONDS" -lt "$RUNNING_STALE_SECONDS" ]; then
              echo "reason=collector-running-within-grace" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "cancel_ids=${RUNNING_IDS}" >> "$GITHUB_OUTPUT"
            echo "reason=collector-running-but-staging-stale" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$EVENT_CONCLUSION" = "cancelled" ]; then
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "reason=cancelled-without-fresh-staging" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ] && { [ "$EVENT_CONCLUSION" = "failure" ] || [ "$EVENT_CONCLUSION" = "timed_out" ] || [ "$EVENT_CONCLUSION" = "action_required" ]; }; then
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "reason=failed-and-staging-stale" >> "$GITHUB_OUTPUT"
          else
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "reason=no-search-progress-20min" >> "$GITHUB_OUTPUT"
          fi

      - name: Cancel stale in-progress rolling-search run
        if: steps.inspect.outputs.cancel_ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.inspect.outputs.cancel_ids }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra RUN_IDS <<< "$IDS"
          for run_id in "${RUN_IDS[@]}"; do
            [ -n "$run_id" ] || continue
            echo "Cancelling stale in-progress rolling-search run ${run_id}"
            gh run cancel "$run_id" --repo "${{ github.repository }}" || true
          done
          sleep 3

      - name: Restart rolling search automatically
        if: steps.inspect.outputs.restart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Rolling search auto-restart: ${{ steps.inspect.outputs.reason }}"
          gh workflow run rolling-news-search.yml --repo "${{ github.repository }}" --ref main
          echo "ROLLING_NEWS_AUTO_MAINTENANCE_RESTART_DISPATCHED mode=24x7 reason=${{ steps.inspect.outputs.reason }}"

      - name: Healthy / no action required
        if: steps.inspect.outputs.restart != 'true'
        run: echo "Rolling news search healthy (${{ steps.inspect.outputs.reason }})."
