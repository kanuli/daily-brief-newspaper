name: Recover Manga Anime Desk Depth 2026-09-03 2215

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recover-manga-depth-20260903-2215.yml"

permissions:
  contents: write

concurrency:
  group: recover-manga-depth-20260903-2215
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add verified current Manga Anime event
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path('data/desk-latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data.get('editorialStandardVersion') == 3
          assert data.get('contentVersion') == 3
          desks = data.setdefault('desks', {})
          manga = desks.setdefault('manga-anime', [])

          story = {
            "id": "manga-dragon-ball-super-beerus-premiere-20260903-2215",
            "desk": "manga-anime",
            "status": "LATEST",
            "title": "《龍珠超 比魯斯》10月11日開播　富士電視公布新預告與主題曲",
            "dek": "重構版加入大量新畫面、重新作畫與新配音工程，首集將於周日晚11時15分在富士電視系播出。",
            "summary": "富士電視與《Dragon Ball》官方9月3日確認《龍珠超 比魯斯》將於10月11日開播，同步公開新視覺、開幕預告以及OP、ED主題曲資料。",
            "body": "富士電視與《Dragon Ball》官方網站9月3日公布，電視動畫《龍珠超 比魯斯》將於10月11日晚上11時15分在富士電視系全國網絡開播。作品以《龍珠超》相關故事為基礎重新構成，官方稱會加入大量新畫面、重新作畫、重新攝影及新的音響製作，並公開最新開幕視覺與預告。\n\n官方同時確認，片頭曲由Megarera Zero演唱《オノガミ》，片尾曲由Vicke Blanka演唱《完璧のペキ》。ORICON NEWS亦在同日報道開播日期與最新影像安排；節目播出後，Prime Video及U-NEXT將提供最快網上配信。",
            "context": "《龍珠》是日本最具全球影響力的漫畫及動畫品牌之一；今次不是單純重播，而是以新增畫面及重新製作方式推出的電視版本。",
            "why": "正式開播日期、播放時段、製作方式及主題曲同日落實，屬直接影響秋季動畫檔期與大型IP觀眾安排的新發展。",
            "watchNext": "留意首集先行活動、完整配信地區安排，以及開播前會否再公開新角色、集數或製作資料。",
            "sourceName": "Dragon Ball Official／富士電視／ORICON NEWS",
            "sourceUrl": "https://dragon-ball-official.com/news/01_4425.html",
            "timeLabel": "9月3日22:15 HKT核實",
            "sources": [
              {"name": "Dragon Ball Official", "url": "https://dragon-ball-official.com/news/01_4425.html"},
              {"name": "富士電視", "url": "https://www.fujitv.co.jp/fujitv/news/20260943.html"},
              {"name": "ORICON NEWS", "url": "https://www.oricon.co.jp/news/2477934/"}
            ],
            "deskSlugs": ["manga-anime"],
            "section": "漫畫／動畫｜秋季動畫／Dragon Ball",
            "sectionLabel": "漫畫／動畫",
            "mediaLabel": "漫畫 / Anime",
            "image": None
          }

          manga[:] = [s for s in manga if s.get('id') != story['id']]
          manga.insert(0, story)
          data['generatedAt'] = datetime.now(ZoneInfo('Asia/Hong_Kong')).isoformat(timespec='seconds')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          required = {'id','desk','status','title','dek','summary','body','context','why','watchNext','sourceName','sourceUrl','timeLabel','sources','deskSlugs','section','sectionLabel','image'}
          assert required.issubset(story)
          assert len(story['sources']) >= 2
          assert len(desks['manga-anime']) >= 4
          print('manga-anime retained:', len(desks['manga-anime']))
          PY

      - name: Remove one-time recovery workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/recover-manga-depth-20260903-2215.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/desk-latest.json .github/workflows/recover-manga-depth-20260903-2215.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Recover Manga Anime desk depth"
          git push origin HEAD:main
