name: CosyVoice F01 Auto Maintenance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cosyvoice-maintenance.yml"
      - "data/latest.json"
      - "data/desk-latest.json"
      - "data/live.json"
      - "data/stocks-latest.json"
      - "data/topic-more/**"
      - "data/editorial-overrides/**"
  workflow_run:
    workflows: ["Publish CosyVoice2-Yue F01 Per Article"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: "cosyvoice-f01-auto-maintenance"
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current production state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Inspect CURRENT news inventory and worker health
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/voice-state.env
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          STORY_FIELDS = ("title", "dek", "summary", "body", "context", "background", "why", "whyImportant", "watchNext", "nextStep")

          def clean(v):
              return " ".join(str(v or "").split())

          def looks_like_story(obj):
              return isinstance(obj, dict) and clean(obj.get("title")) and any(clean(obj.get(k)) for k in STORY_FIELDS[1:])

          def walk(node):
              if isinstance(node, dict):
                  if looks_like_story(node):
                      yield node
                  for value in node.values():
                      yield from walk(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from walk(value)

          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None

          latest = load(Path("data/latest.json")) or {}
          current_date = str(latest.get("date") or "")
          paths = [Path("data/latest.json"), Path("data/desk-latest.json"), Path("data/live.json"), Path("data/stocks-latest.json")]
          if current_date:
              paths += [Path(f"data/topic-more/{current_date}.json"), Path(f"data/editorial-overrides/{current_date}.json")]

          titles = set()
          for path in paths:
              data = load(path)
              if data is None:
                  continue
              for story in walk(data):
                  title = clean(story.get("title"))
                  if title:
                      titles.add(title)

          manifest = load(Path("data/tts-manifest.json")) or {}
          manifest_articles = manifest.get("articles") or {}
          ready_titles = {
              clean(entry.get("title"))
              for entry in manifest_articles.values()
              if isinstance(entry, dict) and clean(entry.get("title")) and str(entry.get("audio") or "")
          }
          current_done = len(titles & ready_titles)
          current_total = len(titles)
          current_pending = max(0, current_total - current_done)
          manifest_done = int(manifest.get("availableArticleCount") or manifest.get("articleCount") or len(manifest_articles) or 0)
          manifest_total = int(manifest.get("collectedStoryCount") or manifest_done)
          manifest_date = str(manifest.get("date") or "")
          generated = str(manifest.get("generatedAt") or "")
          age = 10**9
          if generated:
              try:
                  then = datetime.fromisoformat(generated.replace("Z", "+00:00"))
                  age = max(0, int((datetime.now(timezone.utc) - then).total_seconds()))
              except Exception:
                  pass

          print(f"CURRENT_DATE={current_date}")
          print(f"CURRENT_TOTAL={current_total}")
          print(f"CURRENT_DONE={current_done}")
          print(f"CURRENT_PENDING={current_pending}")
          print(f"MANIFEST_DATE={manifest_date}")
          print(f"MANIFEST_TOTAL={manifest_total}")
          print(f"MANIFEST_DONE={manifest_done}")
          print(f"AGE_SECONDS={age}")
          PY
          source /tmp/voice-state.env

          echo "Current inventory: done=${CURRENT_DONE}/${CURRENT_TOTAL}, pending=${CURRENT_PENDING}; manifest=${MANIFEST_DONE}/${MANIFEST_TOTAL} date=${MANIFEST_DATE}; current_date=${CURRENT_DATE}; last-publish-age=${AGE_SECONDS}s"

          if [ "${CURRENT_TOTAL}" -gt 0 ] && [ "${CURRENT_PENDING}" -le 0 ] && [ "${CURRENT_DATE}" = "${MANIFEST_DATE}" ]; then
            echo "restart=false" >> "$GITHUB_OUTPUT"
            echo "reason=current-coverage-complete" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNS_JSON=$(gh run list --workflow cosyvoice-publish.yml --branch main --limit 20 --json status,conclusion,databaseId,createdAt,updatedAt)
          ACTIVE_COUNT=$(python -c 'import json,sys; runs=json.load(sys.stdin); print(sum(1 for r in runs if r.get("status") != "completed"))' <<< "$RUNS_JSON")
          echo "Active/queued F01 production runs: ${ACTIVE_COUNT}"

          if [ "${ACTIVE_COUNT}" -gt 0 ]; then
            echo "restart=false" >> "$GITHUB_OUTPUT"
            echo "reason=worker-active" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DRIFT=false
          if [ "${CURRENT_TOTAL}" -ne "${MANIFEST_TOTAL}" ] || [ "${CURRENT_DATE}" != "${MANIFEST_DATE}" ]; then
            DRIFT=true
          fi

          RESTART=false
          REASON=""

          # Any completed worker run with a CURRENT backlog needs a replacement.
          # This includes failure/timed_out, not only success/cancelled.
          if [ "${EVENT_NAME}" = "workflow_run" ] && [ "${CURRENT_PENDING}" -gt 0 ]; then
            RESTART=true
            REASON="worker-ended-with-current-backlog-${EVENT_CONCLUSION:-unknown}"
          elif [ "${DRIFT}" = "true" ] && [ "${CURRENT_PENDING}" -gt 0 ]; then
            RESTART=true
            REASON="current-news-inventory-drift"
          elif [ "${CURRENT_PENDING}" -gt 0 ] && [ "${AGE_SECONDS}" -ge 300 ]; then
            RESTART=true
            REASON="no-active-worker-and-f01-stale"
          fi

          echo "restart=${RESTART}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON:-healthy-grace-window}" >> "$GITHUB_OUTPUT"

      - name: Restart F01 production automatically
        if: steps.inspect.outputs.restart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Auto maintenance restart: ${{ steps.inspect.outputs.reason }}"
          gh workflow run cosyvoice-publish.yml --ref main
          echo "COSYVOICE_AUTO_MAINTENANCE_RESTART_DISPATCHED reason=${{ steps.inspect.outputs.reason }}"

      - name: Healthy / no action required
        if: steps.inspect.outputs.restart != 'true'
        run: echo "CosyVoice maintenance healthy; no restart required (${{ steps.inspect.outputs.reason }})."
