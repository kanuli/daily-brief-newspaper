name: CosyVoice F01 Auto Maintenance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cosyvoice-maintenance.yml"
      - "scripts/cosyvoice_policy.py"
      - "data/latest.json"
      - "data/desk-latest.json"
      - "data/live.json"
      - "data/stocks-latest.json"
      - "data/topic-more/**"
      - "data/editorial-overrides/**"
  workflow_run:
    workflows: ["Publish CosyVoice2-Yue F01 Per Article"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: "cosyvoice-f01-auto-maintenance"
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current production state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Inspect CURRENT inventory, policy and real F01 progress
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/voice-state.env
          import json, re
          from datetime import datetime, timezone
          from pathlib import Path

          STORY_FIELDS = ("title", "dek", "summary", "body", "context", "background", "why", "whyImportant", "watchNext", "nextStep")

          def clean(v):
              return " ".join(str(v or "").split())

          def looks_like_story(obj):
              return isinstance(obj, dict) and clean(obj.get("title")) and any(clean(obj.get(k)) for k in STORY_FIELDS[1:])

          def walk(node):
              if isinstance(node, dict):
                  if looks_like_story(node):
                      yield node
                  for value in node.values():
                      yield from walk(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from walk(value)

          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None

          policy_text = Path("scripts/cosyvoice_policy.py").read_text(encoding="utf-8")
          m = re.search(r'^POLICY\s*=\s*["\']([^"\']+)["\']', policy_text, re.M)
          current_policy = m.group(1) if m else ""

          latest = load(Path("data/latest.json")) or {}
          current_date = str(latest.get("date") or "")
          paths = [Path("data/latest.json"), Path("data/desk-latest.json"), Path("data/live.json"), Path("data/stocks-latest.json")]
          if current_date:
              paths += [Path(f"data/topic-more/{current_date}.json"), Path(f"data/editorial-overrides/{current_date}.json")]

          titles = set()
          for path in paths:
              data = load(path)
              if data is None:
                  continue
              for story in walk(data):
                  title = clean(story.get("title"))
                  if title:
                      titles.add(title)

          manifest = load(Path("data/tts-manifest.json")) or {}
          entries = manifest.get("articles") or {}
          manifest_policy = str(manifest.get("prosodyPolicy") or "")
          ready_titles = {
              clean(entry.get("title"))
              for entry in entries.values()
              if isinstance(entry, dict) and clean(entry.get("title")) and str(entry.get("audio") or "")
          }
          current_done = len(titles & ready_titles)
          current_total = len(titles)
          current_pending = max(0, current_total - current_done)
          manifest_done = int(manifest.get("availableArticleCount") or manifest.get("articleCount") or len(entries) or 0)
          manifest_total = int(manifest.get("collectedStoryCount") or manifest_done)
          manifest_date = str(manifest.get("date") or "")

          published = str(manifest.get("lastVoicePublishedAt") or "")
          if not published:
              article_times = sorted(
                  str(entry.get("publishedAt") or "")
                  for entry in entries.values()
                  if isinstance(entry, dict) and entry.get("publishedAt")
              )
              published = article_times[-1] if article_times else ""
          progress_age = 10**9
          if published:
              try:
                  then = datetime.fromisoformat(published.replace("Z", "+00:00"))
                  progress_age = max(0, int((datetime.now(timezone.utc) - then).total_seconds()))
              except Exception:
                  pass

          print(f"CURRENT_POLICY={current_policy}")
          print(f"MANIFEST_POLICY={manifest_policy}")
          print(f"CURRENT_DATE={current_date}")
          print(f"CURRENT_TOTAL={current_total}")
          print(f"CURRENT_DONE={current_done}")
          print(f"CURRENT_PENDING={current_pending}")
          print(f"MANIFEST_DATE={manifest_date}")
          print(f"MANIFEST_TOTAL={manifest_total}")
          print(f"MANIFEST_DONE={manifest_done}")
          print(f"LAST_VOICE_PUBLISHED_AT={published}")
          print(f"PROGRESS_AGE_SECONDS={progress_age}")
          PY
          source /tmp/voice-state.env

          echo "Current F01 policy=${CURRENT_POLICY}; manifest-policy=${MANIFEST_POLICY}; done=${CURRENT_DONE}/${CURRENT_TOTAL}, pending=${CURRENT_PENDING}; last real WAV=${LAST_VOICE_PUBLISHED_AT:-none}; progress-age=${PROGRESS_AGE_SECONDS}s"

          gh run list --workflow cosyvoice-publish.yml --branch main --limit 30 --json status,conclusion,databaseId,createdAt,updatedAt > /tmp/f01-runs.json
          python - <<'PY' > /tmp/active-state.env
          import json
          from datetime import datetime, timezone
          runs=json.load(open('/tmp/f01-runs.json',encoding='utf-8'))
          now=datetime.now(timezone.utc)
          active=[r for r in runs if r.get('status') != 'completed']
          running=[r for r in active if r.get('status') == 'in_progress']
          pending=[r for r in active if r.get('status') != 'in_progress']
          ages=[]
          running_ages=[]
          for r in active:
              try:
                  t=datetime.fromisoformat(str(r.get('createdAt') or '').replace('Z','+00:00'))
                  age=max(0,int((now-t).total_seconds()))
                  ages.append(age)
                  if r.get('status') == 'in_progress':
                      running_ages.append((age,r))
              except Exception:
                  pass
          ids=','.join(str(r.get('databaseId')) for r in active if r.get('databaseId'))
          running_ids=','.join(str(r.get('databaseId')) for r in running if r.get('databaseId'))
          stale_running_ids=','.join(str(r.get('databaseId')) for age,r in running_ages if age >= 1200 and r.get('databaseId'))
          print(f"ACTIVE_COUNT={len(active)}")
          print(f"RUNNING_COUNT={len(running)}")
          print(f"PENDING_COUNT={len(pending)}")
          print(f"ACTIVE_OLDEST_AGE_SECONDS={max(ages) if ages else 0}")
          print(f"ACTIVE_IDS={ids}")
          print(f"RUNNING_IDS={running_ids}")
          print(f"STALE_RUNNING_IDS={stale_running_ids}")
          PY
          source /tmp/active-state.env
          echo "F01 runs active=${ACTIVE_COUNT}; running=${RUNNING_COUNT}; pending=${PENDING_COUNT}; oldest=${ACTIVE_OLDEST_AGE_SECONDS}s; running-ids=${RUNNING_IDS:-none}"

          PROGRESS_STALE_SECONDS=900
          STARTUP_GRACE_SECONDS=1200

          echo "restart=false" >> "$GITHUB_OUTPUT"
          echo "cancel_ids=" >> "$GITHUB_OUTPUT"

          POLICY_DRIFT=false
          if [ -n "${CURRENT_POLICY}" ] && [ "${MANIFEST_POLICY}" != "${CURRENT_POLICY}" ]; then
            POLICY_DRIFT=true
          fi

          # During a policy migration, old-policy WAV progress must never keep an
          # old worker pool alive. Cancel only long-running in-progress pools;
          # preserve the newest queued/pending current-policy run so it can start.
          if [ "$POLICY_DRIFT" = "true" ]; then
            if [ -n "${STALE_RUNNING_IDS}" ]; then
              echo "cancel_ids=${STALE_RUNNING_IDS}" >> "$GITHUB_OUTPUT"
              if [ "${PENDING_COUNT}" -gt 0 ]; then
                echo "restart=false" >> "$GITHUB_OUTPUT"
                echo "reason=policy-migration-cancel-old-pool-preserve-new-pending" >> "$GITHUB_OUTPUT"
              else
                echo "restart=true" >> "$GITHUB_OUTPUT"
                echo "reason=policy-migration-cancel-old-pool-and-restart" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            if [ "${ACTIVE_COUNT}" -gt 0 ]; then
              echo "reason=policy-migration-current-run-startup-grace" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "reason=policy-migration-no-active-current-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${CURRENT_TOTAL}" -gt 0 ] && [ "${CURRENT_PENDING}" -le 0 ] && [ "${CURRENT_DATE}" = "${MANIFEST_DATE}" ]; then
            echo "reason=current-coverage-complete" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DRIFT=false
          if [ "${CURRENT_TOTAL}" -ne "${MANIFEST_TOTAL}" ] || [ "${CURRENT_DATE}" != "${MANIFEST_DATE}" ]; then
            DRIFT=true
          fi

          if [ "${CURRENT_PENDING}" -gt 0 ] && [ "${ACTIVE_COUNT}" -gt 0 ]; then
            if [ "${PROGRESS_AGE_SECONDS}" -le "${PROGRESS_STALE_SECONDS}" ]; then
              echo "reason=worker-active-with-recent-f01-progress" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${ACTIVE_OLDEST_AGE_SECONDS}" -lt "${STARTUP_GRACE_SECONDS}" ]; then
              echo "reason=worker-startup-grace-no-f01-yet" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "cancel_ids=${RUNNING_IDS}" >> "$GITHUB_OUTPUT"
            echo "reason=active-worker-stuck-no-f01-progress" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${CURRENT_PENDING}" -gt 0 ]; then
            if [ "${EVENT_NAME}" = "workflow_run" ]; then
              echo "restart=true" >> "$GITHUB_OUTPUT"
              echo "reason=worker-ended-with-current-backlog-${EVENT_CONCLUSION:-unknown}" >> "$GITHUB_OUTPUT"
            elif [ "${DRIFT}" = "true" ]; then
              echo "restart=true" >> "$GITHUB_OUTPUT"
              echo "reason=current-news-inventory-drift" >> "$GITHUB_OUTPUT"
            elif [ "${PROGRESS_AGE_SECONDS}" -ge 300 ]; then
              echo "restart=true" >> "$GITHUB_OUTPUT"
              echo "reason=no-active-worker-and-f01-stale" >> "$GITHUB_OUTPUT"
            else
              echo "reason=no-active-worker-progress-grace" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "reason=healthy-no-current-backlog" >> "$GITHUB_OUTPUT"
          fi

      - name: Cancel stale F01 worker pool
        if: steps.inspect.outputs.cancel_ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.inspect.outputs.cancel_ids }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra RUN_IDS <<< "$IDS"
          for run_id in "${RUN_IDS[@]}"; do
            [ -n "$run_id" ] || continue
            echo "Cancelling stale F01 run ${run_id}"
            gh run cancel "$run_id" --repo "${{ github.repository }}" || true
          done
          sleep 5

      - name: Restart F01 production automatically
        if: steps.inspect.outputs.restart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "F01 auto maintenance restart: ${{ steps.inspect.outputs.reason }}"
          gh workflow run cosyvoice-publish.yml --repo "${{ github.repository }}" --ref main
          echo "COSYVOICE_AUTO_MAINTENANCE_RESTART_DISPATCHED reason=${{ steps.inspect.outputs.reason }}"

      - name: Healthy / no action required
        if: steps.inspect.outputs.restart != 'true'
        run: echo "CosyVoice maintenance healthy; no restart required (${{ steps.inspect.outputs.reason }})."
