name: Deploy Daily Brief to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Always deploy the newest main snapshot. Hourly news can appear immediately,
# and every independently completed F01 commit triggers another deployment.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build 2026-08-23 Daily snapshot when due
        run: python scripts/publish_daily_20260823.py

      - name: Validate Daily Brief data schema
        run: python scripts/validate_site_data.py

      - name: Validate Daily v3 newspaper depth
        run: python scripts/validate_daily_v3.py

      - name: Validate editorial depth and desk coverage
        run: python scripts/validate_editorial_v2.py

      - name: Validate Stock News data
        run: python scripts/validate_stock_news.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist generated Daily snapshot to main
        run: |
          git add data/2026-08-23.json data/latest.json data/archive.json data/vocab/2026-08-23.json data/topic-more/2026-08-23.json data/desk-latest.json data/live.json editions/2026-08-23.html 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish Daily Edition 2026-08-23"
            git push origin HEAD:main
          fi

      - name: Verify a newly published F01 voice is live
        if: startsWith(github.event.head_commit.message, 'Publish F01 voice slot')
        run: python scripts/check_live_cosyvoice_pages.py
