name: Deploy Daily Brief to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild Rolling Desk from the exact Live snapshot being deployed
        run: python scripts/merge_live_into_desk.py

      - name: Build shared Hong Kong Traditional Chinese localization map
        run: python scripts/export_hktrad_localization.py

      - name: Traditional Chinese audit — report residual visible-news terms
        run: python scripts/audit_tts_language.py

      - name: Validate runtime JavaScript used by every news page
        run: |
          node --check assets/js/hktrad-display.js
          node --check assets/js/hktrad-display-sync.js
          node --check assets/js/system-panel.js
          node --check assets/js/page-updated-time.js
          node --check assets/js/retail-deals.js
          node --check assets/js/news-pipeline-status.js
          node --check assets/js/voice-production-status.js
          node --check assets/js/site-tts-canto-nano.js
          node --check assets/js/live-article.js
          node --check assets/js/stocks.js
          node --check assets/js/desk-latest-summary.js
          node --check assets/js/source-display-upgrade.js

      - name: Force newest self-healing client on every page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed=0
          for path in Path('.').rglob('*.html'):
              text=path.read_text(encoding='utf-8')
              new=re.sub(r'assets/js/system-panel\.js\?v=[^"\']+', 'assets/js/system-panel.js?v=20260901-nav-icons-time-v1', text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1
          print('SELF_HEAL_CLIENT_CACHE_BUST_OK pages', changed)
          PY

      - name: Verify runtime navbar icon contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('assets/js/system-panel.js').read_text(encoding='utf-8')
          required=[
            '🔴 Live','📰 頭版','🌍 世界','🌏 亞洲','🇭🇰 香港','🇯🇵 日本',
            '📈 財經','📊 Stock News','🤖 AI / 科技','📚 漫畫 / Anime',
            '🏟️ Manchester United','⚽ Football','🛒 最新優惠','🗂️ Archive'
          ]
          missing=[label for label in required if label not in js]
          if missing:
              raise SystemExit('runtime navbar missing icon labels: '+repr(missing))
          football=js.index('["football.html", "⚽ Football"]')
          retail=js.index('["retail-deals.html", "🛒 最新優惠", "retail-nav"]')
          archive=js.index('["archive.html", "🗂️ Archive"]')
          if not football < retail < archive:
              raise SystemExit('runtime navbar order must be Football -> 最新優惠 -> Archive')
          print('RUNTIME_NAV_ICON_CONTRACT_OK', len(required), 'Football>最新優惠>Archive')
          PY

      - name: Verify page update-time and Stock copy contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pages=['index.html','live.html','world.html','asia.html','hong-kong.html','japan.html',
                 'finance.html','stocks.html','technology.html','manga-anime.html','manchester-united.html',
                 'football.html','retail-deals.html','archive.html']
          for page in pages:
              text=Path(page).read_text(encoding='utf-8')
              if 'assets/js/page-updated-time.js' not in text:
                  raise SystemExit(f'{page}: missing page update-time client')

          stock=json.loads(Path('data/stocks-latest.json').read_text(encoding='utf-8'))
          stock_text=json.dumps(stock,ensure_ascii=False)
          forbidden=[
            '自動核實器只在官方／監管來源出現後才升格為已核實新聞',
            'Stock News的自動核實器不會因搜尋結果、社交平台貼文或預測文章出現相似標題'
          ]
          for phrase in forbidden:
              if phrase in stock_text:
                  raise SystemExit('Stock News repeated verifier boilerplate remains: '+phrase)
          if '最近已核實內容更新' not in Path('stocks.html').read_text(encoding='utf-8'):
              raise SystemExit('stocks.html missing distinct verified-content timestamp label')

          retail_js=Path('assets/js/retail-deals.js').read_text(encoding='utf-8')
          if '最後資料更新' not in retail_js or "UPDATED ${when(data.generatedAt)}" in retail_js:
              raise SystemExit('retail update-time wording contract failed')
          print('PAGE_TIME_STOCK_RETAIL_CONTRACT_OK pages',len(pages))
          PY

      - name: Availability gate — JSON readable and publication mode valid
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=['data/latest.json','data/live.json','data/desk-latest.json','data/stocks-latest.json']
          loaded={}
          for name in required:
              path=Path(name)
              if not path.is_file():
                  raise SystemExit(f'missing required public data: {name}')
              loaded[name]=json.loads(path.read_text(encoding='utf-8'))
          live=loaded['data/live.json']
          desk=loaded['data/desk-latest.json']
          if not live.get('lastUpdated') or not live.get('nextUpdateLabel'):
              raise SystemExit('Live timestamps missing')
          items=live.get('items')
          if not isinstance(items,list):
              raise SystemExit('Live items must be an array')
          mode=str(live.get('mode') or '').upper()
          if mode == 'DAILY_BASELINE':
              if items:
                  raise SystemExit('08:00 Daily baseline must not publish separate Live stories')
              counts=(live.get('coverage') or {}).get('deskLatestStoryCounts') or {}
              floors={'world':8,'asia':8,'hong-kong':6,'japan':8,'market-economy':8,'ai-tech':6,'manga-anime':4,'manchester-united':4,'football':10}
              for slug,minimum in floors.items():
                  actual=len((desk.get('desks') or {}).get(slug,[]))
                  if actual < minimum or counts.get(slug) != actual:
                      raise SystemExit(f'Daily baseline desk mismatch {slug}: reported={counts.get(slug)} actual={actual} minimum={minimum}')
              print('PUBLIC_AVAILABILITY_GATE_OK DAILY_BASELINE', live.get('lastUpdated'), 'japan', counts.get('japan'), 'next', live.get('nextUpdateLabel'))
          else:
              if mode not in {'LIVE','HOURLY_LIVE'} or not items:
                  raise SystemExit('Hourly Live publication must be non-empty')
              if desk.get('generatedAt') != live.get('lastUpdated'):
                  raise SystemExit(f"Rolling Desk behind Live: desk={desk.get('generatedAt')} live={live.get('lastUpdated')}")
              print('PUBLIC_AVAILABILITY_GATE_OK', mode, live.get('windowLabel'), 'items', len(items), 'desk', desk.get('generatedAt'), 'next', live.get('nextUpdateLabel'))
          PY

      - name: Editorial QA — Daily v3
        run: python scripts/validate_daily_v3.py

      - name: Editorial QA — Stock News
        run: python scripts/validate_stock_news.py

      - name: Editorial QA — current Live / Rolling Desk
        run: python scripts/validate_publication_current.py

      - name: Editorial QA — hard desk depth and geography
        run: python scripts/validate_editorial_v2.py

      - name: Build resilient static news fallback
        run: |
          python -m py_compile scripts/build_static_news_fallback.py
          python scripts/build_static_news_fallback.py

      - name: Verify no-JS newspaper fallback contains real deployed content
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          latest=json.load(open('data/latest.json',encoding='utf-8'))
          live=json.load(open('data/live.json',encoding='utf-8'))
          desk=json.load(open('data/desk-latest.json',encoding='utf-8'))
          stocks=json.load(open('data/stocks-latest.json',encoding='utf-8'))
          archive=json.load(open('data/archive.json',encoding='utf-8'))

          pages=['index.html','live.html','world.html','asia.html','hong-kong.html','japan.html',
                 'finance.html','stocks.html','technology.html','manga-anime.html','manchester-united.html',
                 'football.html','archive.html']
          for page in pages:
              text=Path(page).read_text(encoding='utf-8')
              if 'name="daily-brief-prerender"' not in text:
                  raise SystemExit(f'{page}: missing prerender marker')

          articles={a.get('id'):a for a in latest.get('articles',[]) if isinstance(a,dict)}
          lead=articles.get(latest.get('leadId'))
          home=Path('index.html').read_text(encoding='utf-8')
          if not lead or lead.get('title') not in home or '各版最新' not in home:
              raise SystemExit('index.html prerender missing lead or Desk Latest')

          live_html=Path('live.html').read_text(encoding='utf-8')
          if live.get('items'):
              if live['items'][0].get('title') not in live_html:
                  raise SystemExit('live.html prerender missing first Live item')
          elif '沒有新增 Live 卡片' not in live_html:
              raise SystemExit('live.html prerender missing zero-item fallback')

          first_ticker=(stocks.get('tracked') or [None])[0]
          first_story=((stocks.get('tickers') or {}).get(first_ticker) or {}).get('stories') or []
          stock_html=Path('stocks.html').read_text(encoding='utf-8')
          if not first_story or first_story[0].get('title') not in stock_html:
              raise SystemExit('stocks.html prerender missing first verified story')

          mapping={'world.html':'world','asia.html':'asia','hong-kong.html':'hong-kong','japan.html':'japan',
                   'finance.html':'market-economy','technology.html':'ai-tech','manga-anime.html':'manga-anime',
                   'manchester-united.html':'manchester-united','football.html':'football'}
          for page,slug in mapping.items():
              stories=((desk.get('desks') or {}).get(slug) or [])
              if not stories or stories[0].get('title') not in Path(page).read_text(encoding='utf-8'):
                  raise SystemExit(f'{page}: prerender missing current {slug} story')

          if archive.get('editions'):
              if archive['editions'][0].get('headline') not in Path('archive.html').read_text(encoding='utf-8'):
                  raise SystemExit('archive.html prerender missing first edition')
          print('NO_JS_PRERENDER_VERIFY_OK pages', len(pages))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed publication snapshot and UI contracts
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          local=json.load(open('data/live.json',encoding='utf-8'))
          expected=local.get('lastUpdated')
          expected_mode=str(local.get('mode') or '').upper()
          expected_items=len(local.get('items') or [])
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          icon_labels=['🔴 Live','📰 頭版','🌍 世界','🌏 亞洲','🇭🇰 香港','🇯🇵 日本','📈 財經','📊 Stock News','🤖 AI / 科技','📚 漫畫 / Anime','🏟️ Manchester United','⚽ Football','🛒 最新優惠','🗂️ Archive']
          forbidden=['自動核實器只在官方／監管來源出現後才升格為已核實新聞','Stock News的自動核實器不會因搜尋結果、社交平台貼文或預測文章出現相似標題']
          last_error=None
          def get(path):
              req=urllib.request.Request(base+path+('?v=' if '?' not in path else '&v=')+str(int(time.time())),headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'daily-brief-pages-check'})
              with urllib.request.urlopen(req,timeout=15) as response:
                  return response.read().decode('utf-8','replace')
          for attempt in range(12):
              try:
                  remote=json.loads(get('data/live.json'))
                  remote_mode=str(remote.get('mode') or '').upper()
                  remote_items=len(remote.get('items') or [])
                  if not (remote.get('lastUpdated')==expected and remote_mode==expected_mode and remote_items==expected_items):
                      raise RuntimeError(f"remote snapshot mismatch: {remote.get('lastUpdated')} {remote_mode} {remote_items}")

                  runtime=get('assets/js/system-panel.js')
                  missing=[label for label in icon_labels if label not in runtime]
                  if missing:
                      raise RuntimeError('public runtime navbar icons missing: '+repr(missing))
                  if not (runtime.index('⚽ Football') < runtime.index('🛒 最新優惠') < runtime.index('🗂️ Archive')):
                      raise RuntimeError('public runtime nav order wrong')

                  page_time=get('assets/js/page-updated-time.js')
                  for label in ['最後內容更新','最後 Live 更新','最後檢查','最後資料更新']:
                      if label not in page_time:
                          raise RuntimeError('public page-time client missing label '+label)

                  stock_text=get('data/stocks-latest.json')
                  for phrase in forbidden:
                      if phrase in stock_text:
                          raise RuntimeError('public Stock News boilerplate remains')

                  retail_js=get('assets/js/retail-deals.js')
                  if '最後資料更新' not in retail_js or 'UPDATED ${when(data.generatedAt)}' in retail_js:
                      raise RuntimeError('public retail timestamp wording stale')

                  print('PAGES_PUBLIC_UI_CONTRACTS_OK', expected, 'mode', expected_mode, 'items', expected_items, 'icons', len(icon_labels))
                  raise SystemExit(0)
              except Exception as exc:
                  last_error=str(exc)
              time.sleep(5)
          raise SystemExit('GitHub Pages public UI contracts did not converge: '+str(last_error))
          PY