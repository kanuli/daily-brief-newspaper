name: Deploy Daily Brief to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/tts-manifest.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Daily v3 newspaper depth
        run: python scripts/validate_daily_v3.py

      - name: Validate Stock News data
        run: python scripts/validate_stock_news.py

      - name: Validate current Live and Rolling Desk publication contract
        run: python scripts/validate_publication_current.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Live snapshot matches main
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          local=json.load(open('data/live.json',encoding='utf-8'))
          expected=local.get('lastUpdated')
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          last_error=None
          for attempt in range(12):
              url=base+'data/live.json?v='+str(int(time.time()))
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'daily-brief-pages-check'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      remote=json.loads(response.read().decode('utf-8'))
                  if remote.get('lastUpdated')==expected and (remote.get('items') or []):
                      print('PAGES_LIVE_SNAPSHOT_MATCH', expected, 'items', len(remote.get('items') or []))
                      raise SystemExit(0)
                  last_error=f"remote lastUpdated={remote.get('lastUpdated')} expected={expected} items={len(remote.get('items') or [])}"
              except Exception as exc:
                  last_error=str(exc)
              time.sleep(5)
          raise SystemExit('GitHub Pages Live snapshot did not converge: '+str(last_error))
          PY
