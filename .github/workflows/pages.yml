name: Deploy Daily Brief to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/tts-manifest.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build shared Hong Kong Traditional Chinese localization map
        run: python scripts/export_hktrad_localization.py

      - name: Traditional Chinese audit — report residual visible-news terms
        run: python scripts/audit_tts_language.py

      - name: Validate display localization JavaScript
        run: |
          node --check assets/js/hktrad-display.js
          node --check assets/js/hktrad-display-sync.js

      - name: Force newest display-localization client on every page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed=0
          for path in Path('.').rglob('*.html'):
              text=path.read_text(encoding='utf-8')
              new=re.sub(r'assets/js/system-panel\.js\?v=[^"\']+', 'assets/js/system-panel.js?v=20260823-1719-hktrad-display', text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1
          print('HKTRAD_DISPLAY_CACHE_BUST_OK pages', changed)
          PY

      - name: Availability gate — JSON readable and Live non-empty
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=['data/latest.json','data/live.json','data/desk-latest.json','data/stocks-latest.json']
          loaded={}
          for name in required:
              path=Path(name)
              if not path.is_file():
                  raise SystemExit(f'missing required public data: {name}')
              loaded[name]=json.loads(path.read_text(encoding='utf-8'))
          live=loaded['data/live.json']
          if not live.get('lastUpdated') or not live.get('nextUpdateLabel'):
              raise SystemExit('Live timestamps missing')
          if not isinstance(live.get('items'),list) or not live['items']:
              raise SystemExit('Live publication must not be empty')
          print('PUBLIC_AVAILABILITY_GATE_OK', live.get('windowLabel'), 'items', len(live['items']), 'next', live.get('nextUpdateLabel'))
          PY

      - name: Editorial QA — Daily v3
        continue-on-error: true
        run: python scripts/validate_daily_v3.py

      - name: Editorial QA — Stock News
        continue-on-error: true
        run: python scripts/validate_stock_news.py

      - name: Editorial QA — current Live / Rolling Desk
        continue-on-error: true
        run: python scripts/validate_publication_current.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Live snapshot matches main
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          local=json.load(open('data/live.json',encoding='utf-8'))
          expected=local.get('lastUpdated')
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          last_error=None
          for attempt in range(12):
              url=base+'data/live.json?v='+str(int(time.time()))
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'daily-brief-pages-check'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      remote=json.loads(response.read().decode('utf-8'))
                  if remote.get('lastUpdated')==expected and (remote.get('items') or []):
                      print('PAGES_LIVE_SNAPSHOT_MATCH', expected, 'items', len(remote.get('items') or []))
                      raise SystemExit(0)
                  last_error=f"remote lastUpdated={remote.get('lastUpdated')} expected={expected} items={len(remote.get('items') or [])}"
              except Exception as exc:
                  last_error=str(exc)
              time.sleep(5)
          raise SystemExit('GitHub Pages Live snapshot did not converge: '+str(last_error))
          PY
