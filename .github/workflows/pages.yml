name: Deploy Daily Brief to GitHub Pages

on:
  push:
    branches: ["main"]
    # News-data commits are deliberately not deployed here. The F01 all-news
    # workflow publishes the matching news JSON + CosyVoice audio together.
    paths-ignore:
      - "data/latest.json"
      - "data/20*.json"
      - "data/archive.json"
      - "data/desk-latest.json"
      - "data/live.json"
      - "data/stocks-latest.json"
      - "data/topic-more/**"
      - "data/editorial-overrides/**"
      - "data/tts-manifest.json"
      - "assets/audio/cosyvoice/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live CosyVoice only when all-news manifest is active
        run: |
          if python - <<'PY'
          import json, sys
          manifest = json.load(open('data/tts-manifest.json', encoding='utf-8'))
          sys.exit(0 if manifest.get('coveragePolicy') == 'all-current-news-f01-only' else 1)
          PY
          then
            python scripts/check_live_cosyvoice_pages.py
          else
            echo "Transition deployment: all-news F01 manifest not active yet; live checker deferred to F01 publisher."
          fi
