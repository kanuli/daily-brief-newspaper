name: Deploy Daily Brief to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild Rolling Desk from the exact Live snapshot being deployed
        run: python scripts/merge_live_into_desk.py

      - name: Build shared Hong Kong Traditional Chinese localization map
        run: python scripts/export_hktrad_localization.py

      - name: Traditional Chinese audit — report residual visible-news terms
        run: python scripts/audit_tts_language.py

      - name: Validate runtime JavaScript used by every news page
        run: |
          node --check assets/js/hktrad-display.js
          node --check assets/js/hktrad-display-sync.js
          node --check assets/js/system-panel.js
          node --check assets/js/news-pipeline-status.js
          node --check assets/js/voice-production-status.js
          node --check assets/js/site-tts-canto-nano.js
          node --check assets/js/live-article.js
          node --check assets/js/stocks.js

      - name: Force newest self-healing client on every page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed=0
          for path in Path('.').rglob('*.html'):
              text=path.read_text(encoding='utf-8')
              new=re.sub(r'assets/js/system-panel\.js\?v=[^"\']+', 'assets/js/system-panel.js?v=20260825-canto-nano-prod-cnf1', text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1
          print('SELF_HEAL_CLIENT_CACHE_BUST_OK pages', changed)
          PY

      - name: Availability gate — JSON readable and publication mode valid
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=['data/latest.json','data/live.json','data/desk-latest.json','data/stocks-latest.json']
          loaded={}
          for name in required:
              path=Path(name)
              if not path.is_file():
                  raise SystemExit(f'missing required public data: {name}')
              loaded[name]=json.loads(path.read_text(encoding='utf-8'))
          live=loaded['data/live.json']
          desk=loaded['data/desk-latest.json']
          if not live.get('lastUpdated') or not live.get('nextUpdateLabel'):
              raise SystemExit('Live timestamps missing')
          items=live.get('items')
          if not isinstance(items,list):
              raise SystemExit('Live items must be an array')
          mode=str(live.get('mode') or '').upper()
          if mode == 'DAILY_BASELINE':
              if items:
                  raise SystemExit('08:00 Daily baseline must not publish separate Live stories')
              counts=(live.get('coverage') or {}).get('deskLatestStoryCounts') or {}
              floors={'world':8,'asia':8,'hong-kong':6,'japan':8,'market-economy':8,'ai-tech':6,'manga-anime':4,'manchester-united':4,'football':10}
              for slug,minimum in floors.items():
                  actual=len((desk.get('desks') or {}).get(slug,[]))
                  if actual < minimum or counts.get(slug) != actual:
                      raise SystemExit(f'Daily baseline desk mismatch {slug}: reported={counts.get(slug)} actual={actual} minimum={minimum}')
              print('PUBLIC_AVAILABILITY_GATE_OK DAILY_BASELINE', live.get('lastUpdated'), 'japan', counts.get('japan'), 'next', live.get('nextUpdateLabel'))
          else:
              if mode != 'LIVE' or not items:
                  raise SystemExit('Hourly Live publication must be non-empty')
              if desk.get('generatedAt') != live.get('lastUpdated'):
                  raise SystemExit(f"Rolling Desk behind Live: desk={desk.get('generatedAt')} live={live.get('lastUpdated')}")
              print('PUBLIC_AVAILABILITY_GATE_OK LIVE', live.get('windowLabel'), 'items', len(items), 'desk', desk.get('generatedAt'), 'next', live.get('nextUpdateLabel'))
          PY

      - name: Editorial QA — Daily v3
        run: python scripts/validate_daily_v3.py

      - name: Editorial QA — Stock News
        run: python scripts/validate_stock_news.py

      - name: Editorial QA — current Live / Rolling Desk
        run: python scripts/validate_publication_current.py

      - name: Editorial QA — hard desk depth and geography
        run: python scripts/validate_editorial_v2.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed publication snapshot matches main
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          local=json.load(open('data/live.json',encoding='utf-8'))
          expected=local.get('lastUpdated')
          expected_mode=str(local.get('mode') or '').upper()
          expected_items=len(local.get('items') or [])
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          last_error=None
          for attempt in range(12):
              url=base+'data/live.json?v='+str(int(time.time()))
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'daily-brief-pages-check'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      remote=json.loads(response.read().decode('utf-8'))
                  remote_mode=str(remote.get('mode') or '').upper()
                  remote_items=len(remote.get('items') or [])
                  if remote.get('lastUpdated')==expected and remote_mode==expected_mode and remote_items==expected_items:
                      print('PAGES_PUBLICATION_SNAPSHOT_MATCH', expected, 'mode', expected_mode, 'items', expected_items)
                      raise SystemExit(0)
                  last_error=f"remote lastUpdated={remote.get('lastUpdated')} mode={remote_mode} items={remote_items}; expected={expected} mode={expected_mode} items={expected_items}"
              except Exception as exc:
                  last_error=str(exc)
              time.sleep(5)
          raise SystemExit('GitHub Pages publication snapshot did not converge: '+str(last_error))
          PY
