name: Deploy Daily Brief to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Always deploy the newest main snapshot. Hourly news can appear immediately,
# and every independently completed F01 commit triggers another deployment.
# If commits arrive close together, only the newest Pages deployment is needed
# because it contains all earlier successfully pushed voices as well.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify a newly published F01 voice is live
        if: startsWith(github.event.head_commit.message, 'Publish F01 voice slot')
        run: python scripts/check_live_cosyvoice_pages.py
