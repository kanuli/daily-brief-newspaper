name: Deploy Daily Brief to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild Rolling Desk from the exact Live snapshot being deployed
        run: python scripts/merge_live_into_desk.py

      - name: Build shared Hong Kong Traditional Chinese localization map
        run: python scripts/export_hktrad_localization.py

      - name: Traditional Chinese audit — report residual visible-news terms
        run: python scripts/audit_tts_language.py

      - name: Validate runtime JavaScript used by every news page
        run: |
          node --check assets/js/hktrad-display.js
          node --check assets/js/hktrad-display-sync.js
          node --check assets/js/system-panel.js
          node --check assets/js/page-updated-time.js
          node --check assets/js/retail-deals.js
          node --check assets/js/news-pipeline-status.js
          node --check assets/js/voice-production-status.js
          node --check assets/js/site-tts-canto-nano.js
          node --check assets/js/live-article.js
          node --check assets/js/stocks.js
          node --check assets/js/desk-latest-summary.js
          node --check assets/js/source-display-upgrade.js

      - name: Force newest self-healing client on every page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed=0
          for path in Path('.').rglob('*.html'):
              text=path.read_text(encoding='utf-8')
              new=re.sub(r'assets/js/system-panel\.js\?v=[^"\']+', 'assets/js/system-panel.js?v=20260901-cnf4-playback-v2', text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1
          print('SELF_HEAL_CLIENT_CACHE_BUST_OK pages', changed)
          PY

      - name: Verify navbar, page timestamps and Stock/Retail copy contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          js=Path('assets/js/system-panel.js').read_text(encoding='utf-8')
          required=['🔴 Live','📰 頭版','🌍 世界','🌏 亞洲','🇭🇰 香港','🇯🇵 日本','📈 財經','📊 Stock News','🤖 AI / 科技','📚 漫畫 / Anime','🏟️ Manchester United','⚽ Football','🛒 最新優惠','🗂️ Archive']
          missing=[x for x in required if x not in js]
          if missing: raise SystemExit('runtime navbar missing icon labels: '+repr(missing))
          if not (js.index('⚽ Football') < js.index('🛒 最新優惠') < js.index('🗂️ Archive')):
              raise SystemExit('runtime navbar order must be Football -> 最新優惠 -> Archive')
          pages=['index.html','live.html','world.html','asia.html','hong-kong.html','japan.html','finance.html','stocks.html','technology.html','manga-anime.html','manchester-united.html','football.html','retail-deals.html','archive.html']
          for page in pages:
              text=Path(page).read_text(encoding='utf-8')
              if 'assets/js/page-updated-time.js' not in text: raise SystemExit(f'{page}: missing page update-time client')
          stock=json.loads(Path('data/stocks-latest.json').read_text(encoding='utf-8')); stock_text=json.dumps(stock,ensure_ascii=False)
          for phrase in ['自動核實器只在官方／監管來源出現後才升格為已核實新聞','Stock News的自動核實器不會因搜尋結果、社交平台貼文或預測文章出現相似標題','第一手資料已通過Stock News核實']:
              if phrase in stock_text: raise SystemExit('Stock News process copy remains: '+phrase)
          if '最近已核實內容更新' not in Path('stocks.html').read_text(encoding='utf-8'): raise SystemExit('stocks.html missing verified-content timestamp label')
          retail_js=Path('assets/js/retail-deals.js').read_text(encoding='utf-8')
          if '最後資料更新' not in retail_js or "UPDATED ${when(data.generatedAt)}" in retail_js: raise SystemExit('retail update-time wording contract failed')
          print('PAGE_RUNTIME_COPY_CONTRACT_OK',len(pages))
          PY

      - name: Verify cnf4 playback contract before deploy
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/tts-manifest.json').read_text(encoding='utf-8')); js=Path('assets/js/site-tts-canto-nano.js').read_text(encoding='utf-8'); status=Path('assets/js/voice-production-status.js').read_text(encoding='utf-8'); system=Path('assets/js/system-panel.js').read_text(encoding='utf-8')
          if manifest.get('assetNamespace') != 'cnf4': raise SystemExit('voice namespace is not cnf4')
          if 'const ASSET_NAMESPACE = "cnf4"' not in js or 'hk-cantonese-english-codeswitch-allowed' not in js: raise SystemExit('site TTS client not cnf4/yue aligned')
          if 'const ASSET_NAMESPACE = "cnf4"' not in status: raise SystemExit('voice status client not cnf4 aligned')
          if '20260901-cnf4-playback-v1' not in system: raise SystemExit('system panel not loading cnf4 playback clients')
          if int(manifest.get('availableArticleCount') or 0) <= 0: raise SystemExit('cnf4 manifest has zero available articles')
          print('CNF4_PLAYBACK_CONTRACT_OK',manifest.get('availableArticleCount'),manifest.get('pendingArticleCount'))
          PY

      - name: Availability gate — JSON readable and publication state complete
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=['data/latest.json','data/live.json','data/desk-latest.json','data/stocks-latest.json','data/retail-deals.json']
          loaded={name:json.loads(Path(name).read_text(encoding='utf-8')) for name in required}
          live=loaded['data/live.json']; desk=loaded['data/desk-latest.json']; items=live.get('items'); mode=str(live.get('mode') or '').upper(); coverage=live.get('coverage') or {}
          if not live.get('lastUpdated') or not live.get('nextUpdateLabel'): raise SystemExit('Live timestamps missing')
          if not isinstance(items,list): raise SystemExit('Live items must be an array')
          floors={'world':8,'asia':8,'hong-kong':6,'japan':8,'market-economy':8,'ai-tech':6,'manga-anime':4,'manchester-united':4,'football':10}; counts=coverage.get('deskLatestStoryCounts') or {}
          for slug,minimum in floors.items():
              actual=len((desk.get('desks') or {}).get(slug,[]))
              if actual < minimum or counts.get(slug) != actual: raise SystemExit(f'desk mismatch {slug}: reported={counts.get(slug)} actual={actual} floor={minimum}')
          if mode == 'DAILY_BASELINE':
              if items: raise SystemExit('Daily baseline must not contain Live items')
          else:
              if mode not in {'LIVE','HOURLY_LIVE','LIVE_INCREMENTAL'} or not items: raise SystemExit(f'Hourly Live mode/items invalid: {mode}')
              if coverage.get('status') != 'COMPLETE' or coverage.get('publishingGateMet') is not True or coverage.get('deskLatestDepthMet') is not True or coverage.get('footballGateMet') is not True: raise SystemExit('Hourly Live coverage hard gates are not complete')
          if desk.get('generatedAt') != live.get('lastUpdated'): raise SystemExit(f"Rolling Desk behind Live: desk={desk.get('generatedAt')} live={live.get('lastUpdated')}")
          print('PUBLIC_AVAILABILITY_GATE_OK',mode,live.get('windowLabel'),len(items),desk.get('generatedAt'))
          PY

      - name: Editorial QA — Daily v3
        run: python scripts/validate_daily_v3.py
      - name: Editorial QA — Stock News
        run: python scripts/validate_stock_news.py
      - name: Editorial QA — current Live / Rolling Desk
        run: python scripts/validate_publication_current.py
      - name: Editorial QA — hard desk depth and geography
        run: python scripts/validate_editorial_v2.py

      - name: Build resilient static news fallback
        run: |
          python -m py_compile scripts/build_static_news_fallback.py
          python scripts/build_static_news_fallback.py

      - name: Verify no-JS newspaper fallback contains current deployed content
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest=json.load(open('data/latest.json',encoding='utf-8')); live=json.load(open('data/live.json',encoding='utf-8')); desk=json.load(open('data/desk-latest.json',encoding='utf-8')); stocks=json.load(open('data/stocks-latest.json',encoding='utf-8'))
          pages=['index.html','live.html','world.html','asia.html','hong-kong.html','japan.html','finance.html','stocks.html','technology.html','manga-anime.html','manchester-united.html','football.html','retail-deals.html','archive.html']
          for page in pages:
              if 'name="daily-brief-prerender"' not in Path(page).read_text(encoding='utf-8'): raise SystemExit(f'{page}: missing prerender marker')
          lead=next((a for a in latest.get('articles',[]) if a.get('id')==latest.get('leadId')),None); home=Path('index.html').read_text(encoding='utf-8')
          if not lead or lead.get('title') not in home or '各版最新' not in home: raise SystemExit('index prerender stale')
          if live.get('items') and live['items'][0].get('title') not in Path('live.html').read_text(encoding='utf-8'): raise SystemExit('live prerender stale')
          first=(stocks.get('tracked') or [None])[0]; stories=((stocks.get('tickers') or {}).get(first) or {}).get('stories') or []
          if not stories or stories[0].get('title') not in Path('stocks.html').read_text(encoding='utf-8'): raise SystemExit('stocks prerender stale')
          mapping={'world.html':'world','asia.html':'asia','hong-kong.html':'hong-kong','japan.html':'japan','finance.html':'market-economy','technology.html':'ai-tech','manga-anime.html':'manga-anime','manchester-united.html':'manchester-united','football.html':'football'}
          for page,slug in mapping.items():
              rows=(desk.get('desks') or {}).get(slug) or []
              if not rows or rows[0].get('title') not in Path(page).read_text(encoding='utf-8'): raise SystemExit(f'{page}: prerender not newest-first/current')
          print('NO_JS_PRERENDER_VERIFY_OK',len(pages))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed publication snapshot and UI contracts
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['PAGE_URL'].rstrip('/')+'/'; local=json.load(open('data/live.json',encoding='utf-8')); expected=local.get('lastUpdated'); expected_mode=str(local.get('mode') or '').upper(); expected_items=len(local.get('items') or []); pages=['index.html','live.html','world.html','asia.html','hong-kong.html','japan.html','finance.html','stocks.html','technology.html','manga-anime.html','manchester-united.html','football.html','retail-deals.html','archive.html']
          def get(path):
              req=urllib.request.Request(base+path+('?v=' if '?' not in path else '&v=')+str(int(time.time()*1000)),headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'daily-brief-pages-check'})
              with urllib.request.urlopen(req,timeout=15) as r: return r.read().decode('utf-8','replace')
          last=None
          for _ in range(12):
              try:
                  remote=json.loads(get('data/live.json'))
                  if remote.get('lastUpdated')!=expected or str(remote.get('mode') or '').upper()!=expected_mode or len(remote.get('items') or [])!=expected_items: raise RuntimeError('remote Live snapshot mismatch')
                  for page in pages:
                      if '<html' not in get(page).lower(): raise RuntimeError(page+' invalid HTML')
                  runtime=get('assets/js/system-panel.js')
                  if not (runtime.index('⚽ Football') < runtime.index('🛒 最新優惠') < runtime.index('🗂️ Archive')): raise RuntimeError('public nav order stale')
                  print('DEPLOYED_PUBLICATION_UI_OK',base,expected,expected_mode,expected_items,len(pages)); break
              except Exception as exc:
                  last=exc; time.sleep(5)
          else: raise SystemExit('deployed publication verify failed: '+str(last))
          PY
