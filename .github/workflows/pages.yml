name: Deploy Daily Brief to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Daily Brief data schema
        run: python scripts/validate_site_data.py

      - name: Validate Daily v3 newspaper depth
        run: python scripts/validate_daily_v3.py

      - name: Validate editorial depth and desk coverage
        run: python scripts/validate_editorial_v2.py

      - name: Validate Stock News data
        run: python scripts/validate_stock_news.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
