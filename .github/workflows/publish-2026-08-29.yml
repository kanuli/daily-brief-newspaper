name: Publish 2026-08-29 Daily Edition
# trigger: 08:00 HKT publication

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/publish_daily_20260829.py"
      - ".github/workflows/publish-2026-08-29.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build 08:00 Daily from verified Rolling Desk reservoir
        run: python scripts/publish_daily_20260829.py
      - name: Validate site schema
        run: python scripts/validate_site_data.py
      - name: Validate Daily v3 newspaper depth
        run: python scripts/validate_daily_v3.py
      - name: Validate editorial depth and desk coverage
        run: python scripts/validate_editorial_v2.py
      - name: Validate Stock News
        run: python scripts/validate_stock_news.py
      - name: Confirm Daily hard floors
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/desk-latest.json',encoding='utf-8'))['desks']
          floors={'world':8,'asia':8,'hong-kong':6,'japan':8,'market-economy':8,'ai-tech':6,'manga-anime':4,'manchester-united':4,'football':10}
          counts={k:len(d[k]) for k in floors}
          print(counts)
          assert all(counts[k]>=floors[k] for k in floors)
          assert counts['japan']>=8
          PY
      - name: Commit publication artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/desk-latest.json data/live.json data/latest.json data/2026-08-29.json data/topic-more/2026-08-29.json data/archive.json editions/2026-08-29.html
          git commit -m "Publish 2026-08-29 CANTONESE Daily Edition" || true
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
