name: CosyVoice E2E Smoke

on:
  pull_request:
    paths:
      - "assets/js/site-tts-*.js"
      - "assets/js/system-panel.js"
      - "scripts/test_cosyvoice_local_cpu.py"
      - "scripts/generate_cosyvoice_lead.py"
      - "scripts/generate_cosyvoice_all.py"
      - "scripts/generate_cosyvoice_shard.py"
      - "scripts/publish_cosyvoice_article.py"
      - "scripts/check_cosyvoice_pages_contract.py"
      - "scripts/check_live_cosyvoice_pages.py"
      - "data/latest.json"
      - "data/desk-latest.json"
      - "data/live.json"
      - "data/stocks-latest.json"
      - ".github/workflows/cosyvoice-smoke.yml"
      - ".github/workflows/cosyvoice-publish.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cosyvoice-e2e-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  cosyvoice-local-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify CosyVoice Pages deployment contract
        run: python scripts/check_cosyvoice_pages_contract.py

      - name: Show runner capacity
        run: |
          free -h
          df -h /

      - name: Install system audio libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg sox libsox-dev libsndfile1

      - name: Install proven CPU CosyVoice2-Yue runtime
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools==69.5.1"
          python -m pip install "numpy==1.26.4"
          python -m pip install "torch==2.3.1" "torchaudio==2.3.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "pynini==2.1.6.post1"
          python -m pip install --no-build-isolation "openai-whisper==20231117"
          python -m pip install \
            "conformer==0.3.2" "diffusers==0.29.0" "gdown==5.1.0" \
            "hydra-core==1.3.2" "HyperPyYAML==1.2.2" "ruamel.yaml==0.18.16" \
            "inflect==7.3.1" "librosa==0.10.2" "lightning==2.2.4" \
            "matplotlib==3.7.5" "modelscope==1.20.0" "networkx==3.1" \
            "omegaconf==2.3.0" "onnx==1.16.0" "onnxruntime==1.18.0" \
            "opencc" "protobuf==4.25.8" "pyarrow==18.1.0" "pydantic==2.7.0" \
            "pyworld==0.3.4" "rich==13.7.1" "soundfile==0.12.1" \
            "tensorboard==2.14.0" "transformers==4.51.3" "wetext==0.0.4" \
            "wget==3.2" "huggingface_hub>=0.30,<2" "tqdm>=4.66"

      - name: Clone official WenetSpeech-Yue CosyVoice code
        run: |
          git clone --depth 1 --recursive https://github.com/ASLP-lab/WenetSpeech-Yue.git /tmp/WenetSpeech-Yue
          test -f /tmp/WenetSpeech-Yue/CosyVoice2-Yue/cosyvoice/cli/cosyvoice.py

      - name: Generate real Cantonese smoke WAV locally
        env:
          HF_HUB_DISABLE_XET: "1"
          WSYUE_ROOT: /tmp/WenetSpeech-Yue
          COSY_MODEL_DIR: /tmp/Cosyvoice2-Yue
        run: python scripts/test_cosyvoice_local_cpu.py

      - name: Verify smoke WAV
        run: |
          test -s artifacts/cosyvoice-smoke/cosyvoice2-yue-local-cpu.wav
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 artifacts/cosyvoice-smoke/cosyvoice2-yue-local-cpu.wav

      - name: Generate two independent one-article F01 workers
        env:
          HF_HUB_DISABLE_XET: "1"
          WSYUE_ROOT: /tmp/WenetSpeech-Yue
          COSY_MODEL_DIR: /tmp/Cosyvoice2-Yue
          COSY_ARTICLE_MAX_TEXT_CHARS: "180"
          COSY_SHARD_COUNT: "2"
          COSY_SHARD_EXPECTED_LIMIT: "3"
          COSY_SHARD_ONE_ARTICLE: "1"
        run: |
          COSY_SHARD_INDEX=0 python scripts/generate_cosyvoice_shard.py
          COSY_SHARD_INDEX=1 python scripts/generate_cosyvoice_shard.py

      - name: Publish first completed voice without waiting for second
        run: |
          python scripts/publish_cosyvoice_article.py artifacts/cosyvoice-shards/shard-0.json
          cp data/tts-manifest.json /tmp/manifest-after-first.json
          python - <<'PY'
          import json
          m = json.load(open('/tmp/manifest-after-first.json', encoding='utf-8'))
          assert m['version'] >= 3
          assert m['coveragePolicy'] == 'progressive-current-news-f01-only'
          assert m['generationMode'] == 'per-article-immediate-10-way'
          assert m['articleCount'] >= 1
          assert m['pendingArticleCount'] == m['collectedStoryCount'] - m['articleCount']
          print(f"COSYVOICE_FIRST_IMMEDIATE_PUBLISH_PASS available={m['articleCount']} pending={m['pendingArticleCount']}")
          PY

      - name: Publish second completed voice independently
        run: |
          python scripts/publish_cosyvoice_article.py artifacts/cosyvoice-shards/shard-1.json
          python - <<'PY'
          import json, pathlib, wave
          first = json.load(open('/tmp/manifest-after-first.json', encoding='utf-8'))
          second = json.load(open('data/tts-manifest.json', encoding='utf-8'))
          assert second['version'] >= 3
          assert second['coveragePolicy'] == 'progressive-current-news-f01-only'
          assert second['generationMode'] == 'per-article-immediate-10-way'
          assert second['articleCount'] > first['articleCount']
          assert second['pendingArticleCount'] < first['pendingArticleCount']
          for entry in second['articles'].values():
              path = pathlib.Path(entry['audio'])
              assert path.is_file() and path.stat().st_size > 50000
              assert entry['wavEncoding'] == 'PCM16'
              with wave.open(str(path), 'rb') as wav:
                  assert wav.getsampwidth() == 2
                  assert wav.getnframes() / float(wav.getframerate()) > 2
          print(f"COSYVOICE_SECOND_IMMEDIATE_PUBLISH_PASS available={second['articleCount']} pending={second['pendingArticleCount']}")
          PY

      - name: Upload tested Cantonese audio
        uses: actions/upload-artifact@v4
        with:
          name: cosyvoice2-yue-tested-audio
          path: |
            artifacts/cosyvoice-smoke/cosyvoice2-yue-local-cpu.wav
            artifacts/cosyvoice-shards/**
            assets/audio/cosyvoice/latest-lead.wav
            assets/audio/cosyvoice/articles/*.wav
            data/tts-manifest.json
          if-no-files-found: error
