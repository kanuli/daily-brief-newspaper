name: Watchdog Live coverage truth fix

on:
  push:
    paths:
      - '.github/workflows/watchdog-live-coverage-truthfix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make Live coverage metadata evidence-safe and synchronize desk counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lp=Path('data/live.json'); dp=Path('data/desk-latest.json')
          live=json.loads(lp.read_text(encoding='utf-8'))
          desk=json.loads(dp.read_text(encoding='utf-8'))
          if live.get('lastUpdated') != '2026-09-03T09:00:00+08:00':
              raise SystemExit('Live moved beyond 09:00; refusing stale watchdog metadata patch')
          floors={'world':8,'asia':8,'hong-kong':6,'japan':8,'market-economy':8,'ai-tech':6,'manga-anime':4,'manchester-united':4,'football':10}
          counts={slug:len((desk.get('desks') or {}).get(slug,[])) for slug in floors}
          depth=all(counts[s]>=m for s,m in floors.items())
          cov=live.setdefault('coverage',{})
          cov['deskLatestStoryCounts']=counts
          cov['deskLatestDepthMet']=depth
          cov['japanCountVerified']=counts['japan']
          # COMPLETE is not defensible unless source/geography/football gates are evidenced.
          has_source=(isinstance(cov.get('deskSourceCounts'),dict) or cov.get('sourceGateMet') is True)
          has_football=(isinstance(cov.get('footballCoverage'),dict) or cov.get('footballGateMet') is True)
          has_geo=(isinstance(cov.get('asiaCoverage'),dict) or cov.get('geographicGateMet') is True)
          if not (depth and has_source and has_football and has_geo):
              cov['status']='PARTIAL'
          live['editorialStandardVersion']=3
          live['contentVersion']=3
          lp.write_text(json.dumps(live,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('coverage',cov['status'],counts,'depth',depth,'gates',has_source,has_football,has_geo)
          PY
      - name: Commit truth fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/watchdog-live-coverage-truthfix.yml
          git add data/live.json
          git commit -m "Correct 09:00 Live coverage status and desk counts"
          git push origin main
