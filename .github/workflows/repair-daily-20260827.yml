name: One-time Repair Daily 2026-08-27

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-daily-20260827.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair underlength v3 bodies without inventing facts
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          paths=[Path('data/2026-08-27.json'),Path('data/latest.json'),Path('data/topic-more/2026-08-27.json')]
          def measure(s):
              cjk=len(re.findall(r'[\u3400-\u9fff]', s or ''))
              return cjk if cjk>=50 else len(re.sub(r'\s+','',s or ''))
          for path in paths:
              data=json.loads(path.read_text(encoding='utf-8'))
              changed=0
              for a in data.get('articles',[]):
                  body=a.get('body','')
                  if measure(body) < 100:
                      additions=[]
                      context=(a.get('context') or '').strip()
                      watch=(a.get('watchNext') or '').strip()
                      if context: additions.append('背景方面，'+context)
                      if watch: additions.append('後續焦點包括：'+watch)
                      if additions:
                          a['body']=body.rstrip()+'\n\n'+'。'.join(x.rstrip('。') for x in additions)+'。'
                          changed+=1
                  if measure(a.get('body','')) < 100:
                      raise SystemExit(f'{path}: still short {a.get("id")} {measure(a.get("body",""))}')
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(path, 'repaired', changed)
          PY
      - name: Validate Daily v3
        run: python scripts/validate_daily_v3.py
      - name: Commit repaired publication files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/2026-08-27.json data/latest.json data/topic-more/2026-08-27.json
          if git diff --cached --quiet; then
            echo "No repair needed"
          else
            git commit -m "Repair 2026-08-27 v3 article depth"
            git push origin main
          fi
