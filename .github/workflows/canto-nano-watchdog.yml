name: Canto Nano Voice Self-Healing Watchdog

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/canto-nano-watchdog.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows: ["Publish Canto Nano Female Cantonese News Voice"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: "canto-nano-voice-self-healing-watchdog"
  cancel-in-progress: true

jobs:
  supervise-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Inspect manifest and workflow ownership
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          wf="canto-nano-production.yml"

          python - <<'PY' > /tmp/voice-manifest-health.env
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path('data/tts-manifest.json')
          try:
              d=json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              d={}
          pending=int(d.get('pendingArticleCount') or 0)
          available=int(d.get('availableArticleCount') or 0)
          collected=int(d.get('collectedStoryCount') or 0)
          complete=bool(d.get('coverageComplete')) and pending == 0 and available >= collected
          engine=str(d.get('engine') or '')
          namespace=str(d.get('assetNamespace') or '')
          last=str(d.get('lastVoicePublishedAt') or d.get('generatedAt') or '')
          age=999999
          if last:
              try:
                  dt=datetime.fromisoformat(last.replace('Z','+00:00'))
                  age=max(0,int((datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()//60))
              except Exception:
                  pass
          print(f'PENDING={pending}')
          print(f'AVAILABLE={available}')
          print(f'COLLECTED={collected}')
          print(f'COMPLETE={str(complete).lower()}')
          print(f'ENGINE_OK={str(engine=="typangaa/canto-tts-nano").lower()}')
          print(f'NAMESPACE_OK={str(namespace=="cnf4").lower()}')
          print(f'VOICE_AGE_MIN={age}')
          PY
          source /tmp/voice-manifest-health.env

          gh run list --repo "$repo" --workflow "$wf" --limit 30 \
            --json databaseId,status,conclusion,createdAt,updatedAt,event \
            > /tmp/voice-runs.json

          active=$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/voice-runs.json',encoding='utf-8'))
          print(sum(1 for r in rows if r.get('status') != 'completed'))
          PY
          )
          stale_ids=$(python - "$VOICE_AGE_MIN" <<'PY'
          import json,sys
          from datetime import datetime, timezone
          voice_age=int(sys.argv[1])
          rows=json.load(open('/tmp/voice-runs.json',encoding='utf-8'))
          now=datetime.now(timezone.utc)
          out=[]
          for r in rows:
              if r.get('status') == 'completed':
                  continue
              try:
                  created=datetime.fromisoformat(str(r.get('createdAt')).replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:
                  continue
              run_age=(now-created).total_seconds()/60
              # The production job itself has a 90-minute worker timeout.  Do not
              # kill healthy long articles.  Only recover after the run is older
              # than 110 minutes AND the manifest has made no progress for 45 min.
              if run_age > 110 and voice_age > 45:
                  out.append(str(r.get('databaseId')))
          print(' '.join(out))
          PY
          )
          recent_bad=$(python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          rows=json.load(open('/tmp/voice-runs.json',encoding='utf-8'))
          cutoff=datetime.now(timezone.utc)-timedelta(minutes=60)
          n=0
          for r in rows:
              if r.get('status') != 'completed' or r.get('conclusion') not in {'failure','cancelled','timed_out'}:
                  continue
              try:
                  created=datetime.fromisoformat(str(r.get('createdAt')).replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:
                  continue
              if created >= cutoff:
                  n += 1
          print(n)
          PY
          )

          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"
          echo "collected=$COLLECTED" >> "$GITHUB_OUTPUT"
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"
          echo "engine_ok=$ENGINE_OK" >> "$GITHUB_OUTPUT"
          echo "namespace_ok=$NAMESPACE_OK" >> "$GITHUB_OUTPUT"
          echo "voice_age_min=$VOICE_AGE_MIN" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "stale_ids=$stale_ids" >> "$GITHUB_OUTPUT"
          echo "recent_bad=$recent_bad" >> "$GITHUB_OUTPUT"

          echo "VOICE_WATCHDOG manifest available=${AVAILABLE}/${COLLECTED} pending=${PENDING} complete=${COMPLETE} active=${active} stale_ids='${stale_ids}' recent_bad=${recent_bad}"

      - name: Recover stale active production
        if: steps.inspect.outputs.stale_ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_IDS: ${{ steps.inspect.outputs.stale_ids }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in $STALE_IDS; do
            echo "Cancelling stale Canto Nano production run ${run_id}"
            gh run cancel "$run_id" --repo "${GITHUB_REPOSITORY}" || true
          done
          sleep 5

      - name: Re-evaluate active owner after stale recovery
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow canto-nano-production.yml --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Active Canto Nano owners after recovery: $active"

      - name: Dispatch recovery when backlog has no owner
        if: >-
          steps.inspect.outputs.complete != 'true' &&
          steps.owner.outputs.active == '0' &&
          steps.inspect.outputs.recent_bad < 3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Voice backlog is incomplete and has no active owner; dispatching recovery."
          gh workflow run canto-nano-production.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "CANTO_NANO_AUTO_RECOVERY_DISPATCHED"

      - name: Circuit-break repeated crash loop
        if: >-
          steps.inspect.outputs.complete != 'true' &&
          steps.owner.outputs.active == '0' &&
          steps.inspect.outputs.recent_bad >= 3
        shell: bash
        run: |
          echo "Three or more failed/cancelled/timed-out voice runs occurred within 60 minutes." >&2
          echo "Watchdog is applying a temporary circuit breaker instead of creating an infinite Actions loop." >&2
          exit 1

      - name: Healthy verdict
        if: steps.inspect.outputs.complete == 'true'
        run: echo "CANTO_NANO_VOICE_HEALTHY coverage complete"

      - name: Active-progress verdict
        if: steps.inspect.outputs.complete != 'true' && steps.owner.outputs.active != '0'
        run: echo "CANTO_NANO_VOICE_PROGRESSING backlog is owned by an active production run"
