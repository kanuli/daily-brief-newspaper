name: Canto Nano Voice Self-Healing Watchdog

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/canto-nano-watchdog.yml"
      - "scripts/validate_voice_currentness.py"
      - "data/latest.json"
      - "data/desk-latest.json"
      - "data/live.json"
      - "data/stocks-latest.json"
      - "data/topic-more/**"
      - "data/editorial-overrides/**"
      - "data/tts-manifest.json"
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows: ["Publish Canto Nano Female Cantonese News Voice"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: "canto-nano-voice-self-healing-watchdog"
  cancel-in-progress: true

jobs:
  supervise-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate current-news voice outcome
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_voice_currentness.py --report /tmp/voice-currentness.json --allow-unhealthy
          cat /tmp/voice-currentness.json

      - name: Inspect current coverage and workflow ownership
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          wf="canto-nano-production.yml"

          python - <<'PY' > /tmp/voice-manifest-health.env
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          current=json.loads(Path('/tmp/voice-currentness.json').read_text(encoding='utf-8'))
          try:
              d=json.loads(Path('data/tts-manifest.json').read_text(encoding='utf-8'))
          except Exception:
              d={}

          complete=bool(current.get('healthy'))
          expected=int(current.get('currentStoryCount') or 0)
          playable=int(current.get('currentPlayableCount') or 0)
          missing=int(current.get('missingCount') or 0)
          stale_content=int(current.get('staleContentCount') or 0)
          invalid=int(current.get('invalidEntryCount') or 0)
          engine_ok=bool(current.get('engineOk'))
          namespace_ok=str(current.get('expectedNamespace') or '') == 'cnf4'
          last=str(d.get('lastVoicePublishedAt') or d.get('generatedAt') or '')
          age=999999
          if last:
              try:
                  dt=datetime.fromisoformat(last.replace('Z','+00:00'))
                  age=max(0,int((datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()//60))
              except Exception:
                  pass

          print(f'CURRENT_COMPLETE={str(complete).lower()}')
          print(f'EXPECTED={expected}')
          print(f'PLAYABLE={playable}')
          print(f'MISSING={missing}')
          print(f'STALE_CONTENT={stale_content}')
          print(f'INVALID={invalid}')
          print(f'ENGINE_OK={str(engine_ok).lower()}')
          print(f'NAMESPACE_OK={str(namespace_ok).lower()}')
          print(f'VOICE_AGE_MIN={age}')
          PY
          source /tmp/voice-manifest-health.env

          gh run list --repo "$repo" --workflow "$wf" --limit 30 \
            --json databaseId,status,conclusion,createdAt,updatedAt,event \
            > /tmp/voice-runs.json

          active=$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/voice-runs.json',encoding='utf-8'))
          print(sum(1 for r in rows if r.get('status') != 'completed'))
          PY
          )
          stale_ids=$(python - "$VOICE_AGE_MIN" <<'PY'
          import json,sys
          from datetime import datetime, timezone
          voice_age=int(sys.argv[1])
          rows=json.load(open('/tmp/voice-runs.json',encoding='utf-8'))
          now=datetime.now(timezone.utc)
          out=[]
          for r in rows:
              if r.get('status') == 'completed':
                  continue
              try:
                  created=datetime.fromisoformat(str(r.get('createdAt')).replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:
                  continue
              run_age=(now-created).total_seconds()/60
              # Full-article synthesis is allowed to run for a long time.  Recover
              # only when both the run and manifest progress are stale.
              if run_age > 110 and voice_age > 45:
                  out.append(str(r.get('databaseId')))
          print(' '.join(out))
          PY
          )
          recent_bad=$(python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          rows=json.load(open('/tmp/voice-runs.json',encoding='utf-8'))
          cutoff=datetime.now(timezone.utc)-timedelta(minutes=60)
          n=0
          for r in rows:
              if r.get('status') != 'completed' or r.get('conclusion') not in {'failure','cancelled','timed_out'}:
                  continue
              try:
                  created=datetime.fromisoformat(str(r.get('createdAt')).replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:
                  continue
              if created >= cutoff:
                  n += 1
          print(n)
          PY
          )

          echo "complete=$CURRENT_COMPLETE" >> "$GITHUB_OUTPUT"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "playable=$PLAYABLE" >> "$GITHUB_OUTPUT"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "stale_content=$STALE_CONTENT" >> "$GITHUB_OUTPUT"
          echo "invalid=$INVALID" >> "$GITHUB_OUTPUT"
          echo "engine_ok=$ENGINE_OK" >> "$GITHUB_OUTPUT"
          echo "namespace_ok=$NAMESPACE_OK" >> "$GITHUB_OUTPUT"
          echo "voice_age_min=$VOICE_AGE_MIN" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "stale_ids=$stale_ids" >> "$GITHUB_OUTPUT"
          echo "recent_bad=$recent_bad" >> "$GITHUB_OUTPUT"

          echo "VOICE_WATCHDOG current playable=${PLAYABLE}/${EXPECTED} missing=${MISSING} staleContent=${STALE_CONTENT} invalid=${INVALID} complete=${CURRENT_COMPLETE} active=${active} stale_ids='${stale_ids}' recent_bad=${recent_bad}"

      - name: Recover stale active production
        if: steps.inspect.outputs.stale_ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_IDS: ${{ steps.inspect.outputs.stale_ids }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in $STALE_IDS; do
            echo "Cancelling stale Canto Nano production run ${run_id}"
            gh run cancel "$run_id" --repo "${GITHUB_REPOSITORY}" || true
          done
          sleep 5

      - name: Re-evaluate active owner after stale recovery
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow canto-nano-production.yml --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Active Canto Nano owners after recovery: $active"

      - name: Dispatch recovery when current news has no voice owner
        if: >-
          steps.inspect.outputs.complete != 'true' &&
          steps.owner.outputs.active == '0' &&
          steps.inspect.outputs.recent_bad < 3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Current published news is not fully covered by playable voice and has no active owner; dispatching recovery."
          gh workflow enable canto-nano-production.yml --repo "${GITHUB_REPOSITORY}" || true
          gh workflow run canto-nano-production.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "CANTO_NANO_AUTO_RECOVERY_DISPATCHED"

      - name: Circuit-break repeated crash loop
        if: >-
          steps.inspect.outputs.complete != 'true' &&
          steps.owner.outputs.active == '0' &&
          steps.inspect.outputs.recent_bad >= 3
        shell: bash
        run: |
          echo "Three or more failed/cancelled/timed-out voice runs occurred within 60 minutes." >&2
          echo "Current published stories still lack current playable voice. Watchdog is applying a temporary circuit breaker instead of creating an infinite Actions loop." >&2
          exit 1

      - name: Healthy verdict
        if: steps.inspect.outputs.complete == 'true'
        run: echo "CANTO_NANO_VOICE_HEALTHY every current published story has a current cnf4 playable manifest entry"

      - name: Active-progress verdict
        if: steps.inspect.outputs.complete != 'true' && steps.owner.outputs.active != '0'
        run: |
          echo "CANTO_NANO_VOICE_PROGRESSING current-news gap is owned by an active production run"
          echo "Expected=${{ steps.inspect.outputs.expected }} playable=${{ steps.inspect.outputs.playable }} missing=${{ steps.inspect.outputs.missing }} staleContent=${{ steps.inspect.outputs.stale_content }} invalid=${{ steps.inspect.outputs.invalid }}"
