name: Recover Manga Anime Desk Depth 20260831

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recover-manga-depth-20260831.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover current Manga Anime topic depth
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path('data/desk-latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          desks = data.setdefault('desks', {})
          current = desks.get('manga-anime') or []

          expired_ids = {
              'anime-kagurabachi-cast-20260828-1400',
              'anime-maebashi-witches-film-20260828-0700',
              'anime-boku-suki-tv-20260828-0600',
          }
          current = [s for s in current if s.get('id') not in expired_ids]

          additions = [
            {
              'id': 'manga-anime-jujufes-2026-finale-20260831-0912',
              'desk': 'manga-anime',
              'status': 'LATEST',
              'title': '《咒術迴戰》五周年大型活動一連兩日完成　聲優與歌手齊集橫濱回顧動畫歷程',
              'dek': '「じゅじゅフェス 2026 -5th anniversary-」8月29、30日在K Arena橫濱舉行，兩日安排現場配音、歌曲演出及第三季內容回顧。',
              'summary': '《咒術迴戰》動畫五周年壓軸活動在橫濱完成兩日演出，主要聲優及多組歷代主題曲歌手登場，活動亦回顧包括《死滅回游 前篇》在內的系列內容。',
              'body': '《咒術迴戰》五周年壓軸活動「じゅじゅフェス 2026 -5th anniversary-」於8月29、30日在K Arena橫濱舉行。ORICON NEWS在30日晚的活動報道確認，兩日都有主要聲優參與現場配音環節，並安排多組曾為動畫及遊戲演唱歌曲的歌手演出；官方活動頁亦確認活動原定在29及30日一連兩日舉行。\n\n今次活動屬動畫五周年企劃的收尾節點，內容涵蓋早期動畫至最新《死滅回游 前篇》。相較單純商品或宣傳素材更新，兩日大型實體活動完成本身是新的可驗證事件，亦反映作品在新季度播映後仍維持高規模線下動員。',
              'context': '《咒術迴戰》動畫五周年企劃自年初分階段公布視覺、活動及演出陣容；今次橫濱活動是周年企劃的壓軸大型項目。',
              'why': '大型周年活動完成會直接影響作品後續宣傳節奏、粉絲活動及新一季動畫熱度，屬正在發生的動畫產業與作品動態。',
              'watchNext': '留意官方會否公布活動影像發行、串流重播、新季度後續製作資訊或下一輪大型活動安排。',
              'sourceName': 'ORICON NEWS／TV動畫《咒術迴戰》官方',
              'sourceUrl': 'https://www.oricon.co.jp/news/2477173/',
              'timeLabel': '8月31日09:12 HKT前核實',
              'sources': [
                {'name': 'ORICON NEWS', 'url': 'https://www.oricon.co.jp/news/2477173/'},
                {'name': 'TV動畫《咒術迴戰》官方', 'url': 'https://jujutsukaisen.jp/jujufes2026/'}
              ],
              'deskSlugs': ['manga-anime'],
              'section': '漫畫／動畫｜日本動畫／周年活動',
              'sectionLabel': '漫畫／動畫',
              'mediaLabel': '漫畫 / Anime',
              'image': None,
            },
            {
              'id': 'manga-anime-sekiro-tokyo-events-20260831-0912',
              'desk': 'manga-anime',
              'status': 'LATEST',
              'title': '《SEKIRO: NO DEFEAT》上映前再公布東京兩項活動　澀谷派水、東京鐵塔推光雕合作',
              'dek': '官方8月30日確認9月5日在澀谷免費派發「葦名之水」，9月11日起亦會在東京鐵塔推出期間限定投影演出。',
              'summary': '劇場動畫《SEKIRO: NO DEFEAT》在9月4日日本上映前追加兩項東京宣傳活動，包括澀谷實體派發活動及東京鐵塔夜景投影合作。',
              'body': '劇場動畫《SEKIRO: NO DEFEAT》官方網站8月30日公布兩項新的東京宣傳活動。9月5日將在澀谷 Scramble Square 一樓 Urban Core Space 免費派發以作品舞台為概念的「葦名之水」原創樽裝水，場內並設角色拍照位置及社交平台互動贈品。\n\n官方同日亦確認，9月11日至23日會與東京鐵塔「TOKYO TOWER CITY LIGHT FANTASIA」合作，在主觀景台推出作品主題投影演出。日本電擊Online同日獨立報道兩項安排。兩個新活動都在電影9月4日正式上映前後展開，顯示宣傳已由預告與角色素材進入上映期實體推廣。',
              'context': '《SEKIRO: NO DEFEAT》改編自FromSoftware同名遊戲，預定9月4日起在日本戲院作期間限定上映。',
              'why': '上映前追加實體活動及地標合作，是可直接驗證的動畫電影發行與市場宣傳進展，亦會帶動首周曝光及觀眾到場。',
              'watchNext': '留意9月4日上映後首周票房、舞台見面會反應、入場者特典派發，以及東京鐵塔合作活動實際參與度。',
              'sourceName': '《SEKIRO: NO DEFEAT》動畫官方／電擊Online',
              'sourceUrl': 'https://sekiro-anime.jp/news.html',
              'timeLabel': '8月31日09:12 HKT前核實',
              'sources': [
                {'name': '《SEKIRO: NO DEFEAT》動畫官方', 'url': 'https://sekiro-anime.jp/news.html'},
                {'name': '電擊Online', 'url': 'https://dengekionline.com/article/202608/86033'}
              ],
              'deskSlugs': ['manga-anime'],
              'section': '漫畫／動畫｜劇場動畫／上映宣傳',
              'sectionLabel': '漫畫／動畫',
              'mediaLabel': '漫畫 / Anime',
              'image': None,
            },
          ]

          existing_ids = {s.get('id') for s in current}
          for story in reversed(additions):
              if story['id'] not in existing_ids:
                  current.insert(0, story)

          # Deduplicate exact IDs while preserving order.
          seen = set(); deduped = []
          for story in current:
              ident = story.get('id')
              if ident and ident in seen:
                  continue
              if ident:
                  seen.add(ident)
              deduped.append(story)

          desks['manga-anime'] = deduped
          hkt = timezone(timedelta(hours=8))
          data['generatedAt'] = datetime.now(hkt).replace(microsecond=0).isoformat()
          data['editorialStandardVersion'] = 3
          data['contentVersion'] = 3
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          assert len(deduped) >= 4, len(deduped)
          assert all(s.get('id') not in expired_ids for s in deduped)
          print('manga-anime retained=', len(deduped))
          for s in deduped:
              print(s.get('id'), s.get('title'))
          PY

      - name: Commit recovered Rolling Desk
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/desk-latest.json
          git commit -m 'Recover Manga Anime current topic depth'
          git push origin HEAD:main
