name: Verify Public Pages Publication Snapshot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages-probe.yml"
      - "assets/css/live.css"
      - "assets/css/live-rebuild.css"
      - "assets/css/extras.css"
      - "assets/js/live-rebuild.js"
      - "assets/js/daily-extras.js"
      - "assets/js/article-body-upgrade.js"
      - "assets/js/site-tts-canto-nano.js"
      - "assets/js/stocks.js"
      - "live.html"
      - "index.html"
      - "data/latest.json"
      - "data/live.json"
      - "data/desk-latest.json"
      - "data/stocks-latest.json"
  workflow_run:
    workflows: ["Deploy Daily Brief to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "public-pages-publication-probe"
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify public publication contract, active pages and runtime clients
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, html, json, os, time, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          repo=os.environ.get('GITHUB_REPOSITORY','kanuli/daily-brief-newspaper')
          owner,name=repo.split('/',1)
          root=f'https://{owner}.github.io/{name}/'
          data_base=root+'data/'
          HKT=timezone(timedelta(hours=8))
          now=datetime.now(timezone.utc)
          now_hkt=now.astimezone(HKT)

          core_pages=[
              'index.html','live.html','world.html','asia.html','hong-kong.html','japan.html',
              'finance.html','stocks.html','technology.html','manga-anime.html',
              'manchester-united.html','football.html','archive.html'
          ]
          topic_pages={
              'world.html':'world','asia.html':'asia','hong-kong.html':'hong-kong','japan.html':'japan',
              'finance.html':'market-economy','technology.html':'ai-tech','manga-anime.html':'manga-anime',
              'manchester-united.html':'manchester-united','football.html':'football'
          }
          floors={'world':8,'asia':8,'hong-kong':6,'japan':8,'market-economy':8,'ai-tech':6,'manga-anime':4,'manchester-united':4,'football':10}
          expected_stocks=['GOOG','GLDM','ICE','MCD','EMXC','GBTC','DBA','AAPL','EWY','META','MSFT','NVDA','TSM','PLTR','VT']
          runtime_files=[
              'assets/css/live-rebuild.css','assets/css/extras.css','assets/js/live-rebuild.js',
              'assets/js/daily-extras.js','assets/js/article-body-upgrade.js','assets/js/site-tts-canto-nano.js',
              'assets/js/system-panel.js','assets/js/stocks.js'
          ]
          known_error_markers=['Error 500 (Server Error)','That’s an error',"That's an error",'There was an error. Please try again later.']

          local_latest=json.load(open('data/latest.json',encoding='utf-8'))
          local_live=json.load(open('data/live.json',encoding='utf-8'))
          local_desk=json.load(open('data/desk-latest.json',encoding='utf-8'))
          local_stocks=json.load(open('data/stocks-latest.json',encoding='utf-8'))
          local_tts=json.load(open('data/tts-manifest.json',encoding='utf-8'))

          def parse_iso(value):
              try:
                  dt=datetime.fromisoformat(str(value).replace('Z','+00:00'))
                  if dt.tzinfo is None: return None
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return None

          def story_time(story):
              for key in ('publishedAt','updatedAt','verifiedAt'):
                  stamp=parse_iso(story.get(key)) if isinstance(story,dict) else None
                  if stamp: return stamp
              return None

          def request_bytes(url):
              sep='&' if '?' in url else '?'
              req=urllib.request.Request(url+sep+'v='+str(int(time.time()*1000)),headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'daily-brief-pages-probe'})
              with urllib.request.urlopen(req,timeout=15) as response:
                  return response.getcode(), response.headers.get_content_type(), response.read()

          def fetch_json(filename):
              status,_,body=request_bytes(data_base+filename)
              if status != 200: raise RuntimeError(f'{filename} HTTP {status}')
              return json.loads(body.decode('utf-8'))

          def sha256(data): return hashlib.sha256(data).hexdigest()

          def publication_complete(live):
              if not isinstance(live,dict): return False
              coverage=live.get('coverage') or {}
              required=('deskLatestDepthMet','routingGateMet','sourceGateMet','copyGateMet','geographicGateMet','footballGateMet','publishingGateMet')
              return str(coverage.get('status','')).upper()=='COMPLETE' and all(coverage.get(k) is True for k in required)

          def stock_contract(stocks):
              if not isinstance(stocks,dict): return False
              if stocks.get('tracked') != expected_stocks: return False
              tickers=stocks.get('tickers') or {}
              if list(tickers.keys()) != expected_stocks: return False
              return all(isinstance(tickers.get(s),dict) and bool(tickers[s].get('stories')) for s in expected_stocks)

          def desk_contract(data):
              if not isinstance(data,dict): return False, ['desk data missing']
              desks=data.get('desks') or {}
              issues=[]
              for slug,floor in floors.items():
                  stories=desks.get(slug) or []
                  unique={str(s.get('id') or '') for s in stories if isinstance(s,dict) and s.get('id')}
                  if len(unique) < floor: issues.append(f'{slug}: depth {len(unique)} < {floor}')
                  prev=None
                  for i,story in enumerate(stories):
                      if not isinstance(story,dict):
                          issues.append(f'{slug}[{i}]: malformed story'); continue
                      routes=story.get('deskSlugs') or ([story.get('desk')] if story.get('desk') else [])
                      if slug not in routes: issues.append(f'{slug}[{i}]: misroute {story.get("id")}')
                      stamp=story_time(story)
                      if stamp is None: continue
                      if prev is not None and prev < stamp: issues.append(f'{slug}: not newest-first at {i}')
                      prev=stamp
              return not issues, issues

          def voice_manifest_at_least(remote,local):
              if not isinstance(remote,dict) or not isinstance(local,dict): return False
              if remote.get('engine') != local.get('engine'): return False
              if remote.get('assetNamespace') != local.get('assetNamespace'): return False
              if remote.get('prosodyPolicy') != local.get('prosodyPolicy'): return False
              if int(remote.get('availableArticleCount') or 0) < int(local.get('availableArticleCount') or 0): return False
              r=parse_iso(remote.get('lastVoicePublishedAt')); l=parse_iso(local.get('lastVoicePublishedAt'))
              return bool(r and l and r>=l)

          remote_latest=remote_live=remote_desk=remote_stocks=remote_tts=None
          error=None
          for _ in range(12):
              try:
                  remote_latest=fetch_json('latest.json'); remote_live=fetch_json('live.json'); remote_desk=fetch_json('desk-latest.json')
                  remote_stocks=fetch_json('stocks-latest.json'); remote_tts=fetch_json('tts-manifest.json')
                  desk_ok,_=desk_contract(remote_desk)
                  data_ok=(remote_latest.get('date')==local_latest.get('date') and remote_live.get('lastUpdated')==local_live.get('lastUpdated')
                           and publication_complete(remote_live) and remote_desk.get('generatedAt')==local_live.get('lastUpdated') and desk_ok
                           and remote_stocks.get('generatedAt')==local_stocks.get('generatedAt') and stock_contract(remote_stocks)
                           and voice_manifest_at_least(remote_tts,local_tts))
                  if data_ok: error=None; break
                  error='public data contract not yet current/complete'
              except Exception as exc:
                  error=str(exc)
              time.sleep(5)

          daily_match=bool(isinstance(remote_latest,dict) and remote_latest.get('date')==local_latest.get('date'))
          live_match=bool(isinstance(remote_live,dict) and remote_live.get('lastUpdated')==local_live.get('lastUpdated') and (remote_live.get('items') or []) and publication_complete(remote_live))
          desk_ok,desk_issues=desk_contract(remote_desk)
          desk_match=bool(isinstance(remote_desk,dict) and remote_desk.get('generatedAt')==local_live.get('lastUpdated') and desk_ok)
          stock_match=bool(isinstance(remote_stocks,dict) and remote_stocks.get('generatedAt')==local_stocks.get('generatedAt') and stock_contract(remote_stocks))
          voice_match=voice_manifest_at_least(remote_tts,local_tts)

          page_checks={}
          all_pages_ok=True
          for page in core_pages:
              try:
                  status,ctype,body=request_bytes(root+page)
                  text=html.unescape(body.decode('utf-8','replace'))
                  marker=next((m for m in known_error_markers if m in text),None)
                  retail_stale=('retail-deals.html' in text or 'Retail Promotions' in text)
                  newest_ok=True
                  slug=topic_pages.get(page)
                  if slug:
                      stories=(remote_desk.get('desks') or {}).get(slug) or []
                      if stories:
                          first=str(stories[0].get('title') or '')
                          second=str(stories[1].get('title') or '') if len(stories)>1 else ''
                          p1=text.find(first) if first else -1
                          p2=text.find(second) if second else -1
                          newest_ok=bool(p1>=0 and (not second or p2<0 or p1<p2))
                  ok=bool(status==200 and '<html' in text.lower() and not marker and not retail_stale and newest_ok)
                  page_checks[page]={'ok':ok,'status':status,'contentType':ctype,'bytes':len(body),'errorMarker':marker,'retailStale':retail_stale,'newestFirst':newest_ok}
              except Exception as exc:
                  page_checks[page]={'ok':False,'error':str(exc)}
              all_pages_ok=all_pages_ok and page_checks[page].get('ok',False)

          runtime_checks={}
          for path in runtime_files:
              local=Path(path).read_bytes()
              try:
                  status,ctype,body=request_bytes(root+path)
                  runtime_checks[path]={'ok':bool(status==200 and body==local),'status':status,'contentType':ctype,'localSha256':sha256(local),'publicSha256':sha256(body)}
              except Exception as exc:
                  runtime_checks[path]={'ok':False,'error':str(exc)}
          runtime_match=all(x.get('ok') for x in runtime_checks.values())

          overall=bool(daily_match and live_match and desk_match and stock_match and voice_match and all_pages_ok and runtime_match)
          payload={
              'checkedAt':now.isoformat(),'checkedAtHKT':now_hkt.isoformat(),'publicBaseUrl':root,
              'dailyMatch':daily_match,'liveMatch':live_match,'publicationComplete':publication_complete(remote_live),
              'deskMatch':desk_match,'deskIssues':desk_issues,'stockMatch':stock_match,'voiceManifestMatch':voice_match,
              'allCorePagesOk':all_pages_ok,'pageChecks':page_checks,'runtimeMatch':runtime_match,'runtimeChecks':runtime_checks,
              'retailRetiredContract':all(not x.get('retailStale',False) for x in page_checks.values()),
              'match':overall,'error':error,
          }
          open('/tmp/pages-live-status.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(payload,ensure_ascii=False))
          if not overall: raise SystemExit('PUBLIC_SITE_PROBE_FAILED')
          PY

      - name: Publish probe result to pages-status branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/pages-live-status.json
          rm -rf /tmp/pages-status
          mkdir -p /tmp/pages-status/data
          cp /tmp/pages-live-status.json /tmp/pages-status/data/pages-live-status.json
          cd /tmp/pages-status
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b pages-status
          git add data/pages-live-status.json
          git commit -q -m "Update public Pages publication probe"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin pages-status
