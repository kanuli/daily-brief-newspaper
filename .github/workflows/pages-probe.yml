name: Verify Public Pages Publication Snapshot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages-probe.yml"
      - "assets/css/live.css"
      - "assets/css/live-rebuild.css"
      - "assets/css/extras.css"
      - "assets/js/live-rebuild.js"
      - "assets/js/daily-extras.js"
      - "assets/js/article-body-upgrade.js"
      - "assets/js/site-tts-canto-nano.js"
      - "assets/js/stocks.js"
      - "live.html"
      - "index.html"
      - "data/latest.json"
      - "data/live.json"
      - "data/stocks-latest.json"
  workflow_run:
    workflows: ["Deploy Daily Brief to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "public-pages-publication-probe"
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify public data, freshness, every core page and shared runtime clients
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          repo=os.environ.get('GITHUB_REPOSITORY','kanuli/daily-brief-newspaper')
          owner,name=repo.split('/',1)
          root=f'https://{owner}.github.io/{name}/'
          data_base=root+'data/'
          core_pages=[
              'index.html','live.html','world.html','asia.html','hong-kong.html','japan.html',
              'finance.html','stocks.html','technology.html','manga-anime.html',
              'manchester-united.html','football.html','archive.html'
          ]
          runtime_files=[
              'assets/css/live.css','assets/css/live-rebuild.css','assets/css/extras.css',
              'assets/js/live-rebuild.js','assets/js/daily-extras.js','assets/js/article-body-upgrade.js',
              'assets/js/site-tts-canto-nano.js','assets/js/system-panel.js','assets/js/live-article.js','assets/js/stocks.js'
          ]
          known_error_markers=['Error 500 (Server Error)', 'That’s an error', "That's an error", 'There was an error. Please try again later.']
          HKT=timezone(timedelta(hours=8))
          now=datetime.now(timezone.utc)
          now_hkt=now.astimezone(HKT)

          local_latest=json.load(open('data/latest.json',encoding='utf-8'))
          local_live=json.load(open('data/live.json',encoding='utf-8'))
          local_stocks=json.load(open('data/stocks-latest.json',encoding='utf-8'))
          local_tts=json.load(open('data/tts-manifest.json',encoding='utf-8'))
          expected_live=local_live.get('lastUpdated')
          expected_stocks=local_stocks.get('generatedAt')
          expected_daily=local_latest.get('date')

          def parse_iso(value):
              try:
                  dt=datetime.fromisoformat(str(value).replace('Z','+00:00'))
                  if dt.tzinfo is None: return None
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return None

          def age_minutes(value):
              dt=parse_iso(value)
              if not dt: return None
              return max(0.0,(now-dt).total_seconds()/60.0)

          def request_bytes(url):
              sep='&' if '?' in url else '?'
              req=urllib.request.Request(url+sep+'v='+str(int(time.time()*1000)),headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'daily-brief-pages-probe'})
              with urllib.request.urlopen(req,timeout=15) as response:
                  body=response.read()
                  return response.getcode(), response.headers.get_content_type(), body

          def fetch_json(filename):
              status, _, body=request_bytes(data_base+filename)
              if status != 200: raise RuntimeError(f'{filename} HTTP {status}')
              return json.loads(body.decode('utf-8'))

          def sha256(data): return hashlib.sha256(data).hexdigest()

          remote_latest=remote_live=remote_desk=remote_stocks=remote_tts=None
          error=None
          for _ in range(12):
              try:
                  remote_latest=fetch_json('latest.json')
                  remote_live=fetch_json('live.json')
                  remote_desk=fetch_json('desk-latest.json')
                  remote_stocks=fetch_json('stocks-latest.json')
                  remote_tts=fetch_json('tts-manifest.json')
                  daily_match=bool(remote_latest.get('date')==expected_daily)
                  live_match=bool(remote_live.get('lastUpdated')==expected_live and (remote_live.get('items') or []))
                  desk_match=bool(remote_desk.get('generatedAt')==expected_live)
                  stock_match=bool(remote_stocks.get('generatedAt')==expected_stocks)
                  voice_match=bool(
                      remote_tts.get('engine')==local_tts.get('engine') and
                      remote_tts.get('assetNamespace')==local_tts.get('assetNamespace') and
                      remote_tts.get('prosodyPolicy')==local_tts.get('prosodyPolicy') and
                      int(remote_tts.get('availableArticleCount') or 0)==int(local_tts.get('availableArticleCount') or 0) and
                      str(remote_tts.get('lastVoicePublishedAt') or '')==str(local_tts.get('lastVoicePublishedAt') or '')
                  )
                  if daily_match and live_match and desk_match and stock_match and voice_match:
                      error=None; break
                  error=(f"daily={remote_latest.get('date')} expected={expected_daily}; live={remote_live.get('lastUpdated')} expected={expected_live}; "
                         f"desk={remote_desk.get('generatedAt')} expected={expected_live}; stocks={remote_stocks.get('generatedAt')} expected={expected_stocks}; "
                         f"voice={remote_tts.get('engine')}/{remote_tts.get('assetNamespace')}/{remote_tts.get('availableArticleCount')} "
                         f"expected={local_tts.get('engine')}/{local_tts.get('assetNamespace')}/{local_tts.get('availableArticleCount')}")
              except Exception as exc:
                  error=str(exc)
              time.sleep(5)

          daily_match=bool(isinstance(remote_latest,dict) and remote_latest.get('date')==expected_daily)
          live_match=bool(isinstance(remote_live,dict) and remote_live.get('lastUpdated')==expected_live and (remote_live.get('items') or []))
          desk_match=bool(isinstance(remote_desk,dict) and remote_desk.get('generatedAt')==expected_live)
          stock_match=bool(isinstance(remote_stocks,dict) and remote_stocks.get('generatedAt')==expected_stocks)
          voice_match=bool(isinstance(remote_tts,dict) and remote_tts.get('engine')==local_tts.get('engine') and remote_tts.get('assetNamespace')==local_tts.get('assetNamespace') and remote_tts.get('prosodyPolicy')==local_tts.get('prosodyPolicy') and int(remote_tts.get('availableArticleCount') or 0)==int(local_tts.get('availableArticleCount') or 0) and str(remote_tts.get('lastVoicePublishedAt') or '')==str(local_tts.get('lastVoicePublishedAt') or ''))

          hour,minute=now_hkt.hour,now_hkt.minute
          live_age=age_minutes(remote_live.get('lastUpdated')) if isinstance(remote_live,dict) else None
          stock_check_value=(remote_stocks.get('lastCheckedAt') or remote_stocks.get('generatedAt')) if isinstance(remote_stocks,dict) else None
          stock_check_age=age_minutes(stock_check_value)
          stock_content_age=age_minutes(remote_stocks.get('generatedAt')) if isinstance(remote_stocks,dict) else None

          live_window=(hour==0 or 6<=hour<=7 or 9<=hour<=23)
          if hour==6 and minute<20:
              live_fresh=True
          elif hour==9 and minute<20:
              live_fresh=bool(live_age is not None and live_age<=155)
          elif live_window:
              live_fresh=bool(live_age is not None and live_age<=95)
          else:
              live_fresh=True

          stock_window=(hour==0 or 6<=hour<=23)
          stock_collection_status=str((remote_stocks or {}).get('collectionStatus','')).upper()
          if hour==6 and minute<15:
              stock_fresh=True
          elif stock_window:
              stock_fresh=bool(stock_check_age is not None and stock_check_age<=95 and stock_collection_status=='COMPLETE')
          else:
              stock_fresh=True

          daily_required=(hour>8 or (hour==8 and minute>=15))
          daily_fresh=bool(not daily_required or (isinstance(remote_latest,dict) and remote_latest.get('date')==now_hkt.date().isoformat()))
          stock_content_fresh=bool(stock_content_age is not None and stock_content_age<=36*60)

          page_checks={}
          live_layout_contract=False
          index_vocab_contract=False
          for page in core_pages:
              try:
                  status, content_type, body=request_bytes(root+page)
                  text=body.decode('utf-8','replace')
                  marker=next((m for m in known_error_markers if m in text), None)
                  if page=='live.html':
                      live_layout_contract=bool(
                          'assets/css/topic.css' in text and
                          'assets/css/live-rebuild.css?v=20260904-rebuild-v1' in text and
                          'assets/js/live-rebuild.js?v=20260904-rebuild-v1' in text and
                          'id="live-page-items" class="topic-story-grid"' in text and
                          'assets/css/live.css' not in text and
                          'assets/js/live-article.js' not in text
                      )
                  if page=='index.html':
                      index_vocab_contract=bool('assets/css/extras.css?v=20260904-vocab-rebuild-v9' in text)
                  page_checks[page]={'ok':bool(status==200 and '<html' in text.lower() and not marker),'status':status,'contentType':content_type,'bytes':len(body),'errorMarker':marker}
              except Exception as exc:
                  page_checks[page]={'ok':False,'error':str(exc)}
          all_pages_ok=all(item.get('ok') for item in page_checks.values())

          runtime_checks={}
          for path in runtime_files:
              local=Path(path).read_bytes()
              try:
                  status, content_type, body=request_bytes(root+path)
                  runtime_checks[path]={'ok':bool(status==200 and body==local),'status':status,'contentType':content_type,'localSha256':sha256(local),'publicSha256':sha256(body),'bytes':len(body)}
              except Exception as exc:
                  runtime_checks[path]={'ok':False,'localSha256':sha256(local),'error':str(exc)}
          runtime_match=all(item.get('ok') for item in runtime_checks.values())

          tts_local=Path('assets/js/site-tts-canto-nano.js').read_text(encoding='utf-8')
          current_namespace=str(local_tts.get('assetNamespace') or '')
          expected_namespace_literal=f'const NAMESPACE = "-{current_namespace}-";'
          tts_guard_ok=bool(
              current_namespace and
              'const MANIFEST_URL = "data/tts-manifest.json";' in tts_local and
              expected_namespace_literal in tts_local and
              'runtime-ref-audio-voice-clone-verified' in tts_local and
              'femalePromptCodesSha256 !== e.defaultPromptCodesSha256' in tts_local and
              'semantic-completeness-breathing-audience-processing' in tts_local and
              'new MutationObserver' in tts_local
          )

          infrastructure_ok=bool(daily_match and live_match and desk_match and stock_match and voice_match and all_pages_ok and runtime_match and live_layout_contract and index_vocab_contract and tts_guard_ok)
          editorial_fresh=bool(live_fresh and stock_fresh and daily_fresh and stock_content_fresh)
          overall=bool(infrastructure_ok and editorial_fresh)
          payload={
              'checkedAt': now.isoformat(), 'checkedAtHKT': now_hkt.isoformat(), 'publicBaseUrl': root,
              'mainDailyDate': expected_daily, 'publicDailyDate': remote_latest.get('date') if isinstance(remote_latest,dict) else None,
              'mainLastUpdated': expected_live, 'publicLastUpdated': remote_live.get('lastUpdated') if isinstance(remote_live,dict) else None,
              'mainWindowLabel': local_live.get('windowLabel'), 'publicWindowLabel': remote_live.get('windowLabel') if isinstance(remote_live,dict) else None,
              'publicItemCount': len(remote_live.get('items') or []) if isinstance(remote_live,dict) else 0,
              'mainDeskExpectedAt': expected_live, 'publicDeskGeneratedAt': remote_desk.get('generatedAt') if isinstance(remote_desk,dict) else None,
              'mainStocksGeneratedAt': expected_stocks, 'publicStocksGeneratedAt': remote_stocks.get('generatedAt') if isinstance(remote_stocks,dict) else None,
              'publicStocksLastCheckedAt': remote_stocks.get('lastCheckedAt') if isinstance(remote_stocks,dict) else None,
              'publicStocksCollectionStatus': remote_stocks.get('collectionStatus') if isinstance(remote_stocks,dict) else None,
              'dailyMatch': daily_match, 'liveMatch': live_match, 'deskMatch': desk_match, 'stockMatch': stock_match,
              'dailyFresh': daily_fresh, 'liveFresh': live_fresh, 'liveAgeMinutes': live_age,
              'stockFresh': stock_fresh, 'stockCheckAgeMinutes': stock_check_age,
              'stockContentFresh': stock_content_fresh, 'stockContentAgeMinutes': stock_content_age,
              'voiceManifestMatch': voice_match,
              'voiceEngine': local_tts.get('engine'),
              'voiceAvailableArticleCount': int(local_tts.get('availableArticleCount') or 0),
              'allCorePagesOk': all_pages_ok, 'pageChecks': page_checks,
              'liveLayoutContract': live_layout_contract,
              'indexVocabContract': index_vocab_contract,
              'runtimeMatch': runtime_match, 'runtimeChecks': runtime_checks,
              'ttsHangRegressionGuard': tts_guard_ok,
              'voiceAssetNamespace': current_namespace,
              'infrastructureMatch': infrastructure_ok,
              'editorialFreshnessMatch': editorial_fresh,
              'match': overall,
              'error': error,
          }
          open('/tmp/pages-live-status.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(payload,ensure_ascii=False))
          if not overall: raise SystemExit('PUBLIC_SITE_PROBE_FAILED')
          PY

      - name: Publish probe result to pages-status branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/pages-live-status.json
          rm -rf /tmp/pages-status
          mkdir -p /tmp/pages-status/data
          cp /tmp/pages-live-status.json /tmp/pages-status/data/pages-live-status.json
          cd /tmp/pages-status
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b pages-status
          git add data/pages-live-status.json
          git commit -q -m "Update public Pages publication probe"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin pages-status
