name: Verify Public Pages Publication Snapshot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages-probe.yml"
  workflow_run:
    workflows: ["Deploy Daily Brief to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "public-pages-publication-probe"
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify public data, every core page and shared runtime clients
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo=os.environ.get('GITHUB_REPOSITORY','kanuli/daily-brief-newspaper')
          owner,name=repo.split('/',1)
          root=f'https://{owner}.github.io/{name}/'
          data_base=root+'data/'
          core_pages=[
              'index.html','live.html','world.html','asia.html','hong-kong.html','japan.html',
              'finance.html','stocks.html','technology.html','manga-anime.html',
              'manchester-united.html','football.html','archive.html'
          ]
          runtime_files=['assets/js/site-tts-v14.js','assets/js/system-panel.js','assets/js/live-article.js']
          known_error_markers=[
              'Error 500 (Server Error)', 'That’s an error', "That's an error",
              'There was an error. Please try again later.'
          ]

          local_live=json.load(open('data/live.json',encoding='utf-8'))
          local_stocks=json.load(open('data/stocks-latest.json',encoding='utf-8'))
          expected_live=local_live.get('lastUpdated')
          expected_stocks=local_stocks.get('generatedAt')

          def request_bytes(url):
              sep='&' if '?' in url else '?'
              req=urllib.request.Request(url+sep+'v='+str(int(time.time()*1000)),headers={
                  'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'daily-brief-pages-probe'})
              with urllib.request.urlopen(req,timeout=15) as response:
                  body=response.read()
                  return response.getcode(), response.headers.get_content_type(), body

          def fetch_json(filename):
              status, _, body=request_bytes(data_base+filename)
              if status != 200: raise RuntimeError(f'{filename} HTTP {status}')
              return json.loads(body.decode('utf-8'))

          def sha256(data): return hashlib.sha256(data).hexdigest()

          remote_live=remote_desk=remote_stocks=None
          error=None
          for _ in range(12):
              try:
                  remote_live=fetch_json('live.json')
                  remote_desk=fetch_json('desk-latest.json')
                  remote_stocks=fetch_json('stocks-latest.json')
                  live_match=bool(remote_live.get('lastUpdated')==expected_live and (remote_live.get('items') or []))
                  desk_match=bool(remote_desk.get('generatedAt')==expected_live)
                  stock_match=bool(remote_stocks.get('generatedAt')==expected_stocks)
                  if live_match and desk_match and stock_match:
                      error=None; break
                  error=(f"live={remote_live.get('lastUpdated')} expected={expected_live}; "
                         f"desk={remote_desk.get('generatedAt')} expected={expected_live}; "
                         f"stocks={remote_stocks.get('generatedAt')} expected={expected_stocks}")
              except Exception as exc:
                  error=str(exc)
              time.sleep(5)

          live_match=bool(isinstance(remote_live,dict) and remote_live.get('lastUpdated')==expected_live and (remote_live.get('items') or []))
          desk_match=bool(isinstance(remote_desk,dict) and remote_desk.get('generatedAt')==expected_live)
          stock_match=bool(isinstance(remote_stocks,dict) and remote_stocks.get('generatedAt')==expected_stocks)

          page_checks={}
          for page in core_pages:
              try:
                  status, content_type, body=request_bytes(root+page)
                  text=body.decode('utf-8','replace')
                  marker=next((m for m in known_error_markers if m in text), None)
                  page_checks[page]={'ok':bool(status==200 and '<html' in text.lower() and not marker),'status':status,'contentType':content_type,'bytes':len(body),'errorMarker':marker}
              except Exception as exc:
                  page_checks[page]={'ok':False,'error':str(exc)}
          all_pages_ok=all(item.get('ok') for item in page_checks.values())

          runtime_checks={}
          for path in runtime_files:
              local=Path(path).read_bytes()
              try:
                  status, content_type, body=request_bytes(root+path)
                  runtime_checks[path]={'ok':bool(status==200 and body==local),'status':status,'contentType':content_type,'localSha256':sha256(local),'publicSha256':sha256(body),'bytes':len(body)}
              except Exception as exc:
                  runtime_checks[path]={'ok':False,'localSha256':sha256(local),'error':str(exc)}
          runtime_match=all(item.get('ok') for item in runtime_checks.values())

          tts_local=Path('assets/js/site-tts-v14.js').read_text(encoding='utf-8')
          policy_local=Path('scripts/cosyvoice_policy.py').read_text(encoding='utf-8')
          ns_match=re.search(r'^ASSET_NAMESPACE\s*=\s*["\']([^"\']+)["\']', policy_local, re.M)
          current_namespace=ns_match.group(1) if ns_match else ''
          namespace_line=f'const NAMESPACE = "-{current_namespace}-";'
          tts_guard_ok=bool(
              current_namespace and
              'function containsArticle(node)' in tts_local and
              'addedNodes' in tts_local and
              'const MANIFEST_URL = "data/tts-manifest.json";' in tts_local and
              namespace_line in tts_local and
              'semantic-sentence-reference-locked' in tts_local and
              'new MutationObserver(() => refreshButtons())' not in tts_local
          )

          overall=bool(live_match and desk_match and stock_match and all_pages_ok and runtime_match and tts_guard_ok)
          payload={
              'checkedAt': datetime.now(timezone.utc).isoformat(), 'publicBaseUrl': root,
              'mainLastUpdated': expected_live,
              'publicLastUpdated': remote_live.get('lastUpdated') if isinstance(remote_live,dict) else None,
              'mainWindowLabel': local_live.get('windowLabel'),
              'publicWindowLabel': remote_live.get('windowLabel') if isinstance(remote_live,dict) else None,
              'publicItemCount': len(remote_live.get('items') or []) if isinstance(remote_live,dict) else 0,
              'mainDeskExpectedAt': expected_live,
              'publicDeskGeneratedAt': remote_desk.get('generatedAt') if isinstance(remote_desk,dict) else None,
              'mainStocksGeneratedAt': expected_stocks,
              'publicStocksGeneratedAt': remote_stocks.get('generatedAt') if isinstance(remote_stocks,dict) else None,
              'liveMatch': live_match, 'deskMatch': desk_match, 'stockMatch': stock_match,
              'allCorePagesOk': all_pages_ok, 'pageChecks': page_checks,
              'runtimeMatch': runtime_match, 'runtimeChecks': runtime_checks,
              'ttsHangRegressionGuard': tts_guard_ok,
              'voiceAssetNamespace': current_namespace, 'match': overall, 'error': error,
          }
          open('/tmp/pages-live-status.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(payload,ensure_ascii=False))
          if not overall: raise SystemExit('PUBLIC_SITE_PROBE_FAILED')
          PY

      - name: Publish probe result to pages-status branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/pages-live-status.json
          rm -rf /tmp/pages-status
          mkdir -p /tmp/pages-status/data
          cp /tmp/pages-live-status.json /tmp/pages-status/data/pages-live-status.json
          cd /tmp/pages-status
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b pages-status
          git add data/pages-live-status.json
          git commit -q -m "Update public Pages publication probe"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin pages-status
