name: Watchdog coverage gate schema fix v2

on:
  push:
    paths:
      - '.github/workflows/watchdog-gate-schema-fix-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair merge gate persistence and current Live metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('scripts/merge_live_into_desk.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('source_gate = bool(coverage.get("sourceGateMet", True))','source_gate = bool(coverage.get("sourceGateMet", coverage.get("sourceGate", False)))')
          s=s.replace('geographic_gate = bool(coverage.get("geographicGateMet", True))','geographic_gate = bool(coverage.get("geographicGateMet", coverage.get("geographicGate", False)))')
          s=s.replace('football_gate = counts["football"] >= FLOORS["football"] and bool(coverage.get("footballGateMet", True))','football_gate = counts["football"] >= FLOORS["football"] and bool(coverage.get("footballGateMet", coverage.get("footballGate", False)))')
          needle='    coverage["japanCountVerified"] = counts["japan"]\n    coverage["footballGateMet"] = football_gate\n'
          repl='    coverage["japanCountVerified"] = counts["japan"]\n    coverage["sourceGateMet"] = source_gate\n    coverage["geographicGateMet"] = geographic_gate\n    coverage["footballGateMet"] = football_gate\n'
          if needle not in s:
              raise SystemExit('merge gate insertion point missing')
          s=s.replace(needle,repl)
          p.write_text(s,encoding='utf-8')

          lp=Path('data/live.json')
          live=json.loads(lp.read_text(encoding='utf-8'))
          cov=live.setdefault('coverage',{})
          cov['sourceGateMet']=bool(cov.get('sourceGateMet',cov.get('sourceGate',False)))
          cov['geographicGateMet']=bool(cov.get('geographicGateMet',cov.get('geographicGate',False)))
          cov['footballGateMet']=bool(cov.get('footballGateMet',cov.get('footballGate',False)))
          cov['publishingGateMet']=bool(cov.get('deskLatestDepthMet')) and cov['sourceGateMet'] and cov['geographicGateMet'] and cov['footballGateMet']
          cov['status']='COMPLETE' if cov['publishingGateMet'] else 'INCOMPLETE'
          lp.write_text(json.dumps(live,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit permanent fix and clean temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/watchdog-gate-schema-fix.yml .github/workflows/watchdog-gate-schema-fix-v2.yml
          git add scripts/merge_live_into_desk.py data/live.json
          git commit -m "Persist canonical Live coverage gate evidence"
          git push origin main
