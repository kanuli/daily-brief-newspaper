name: One-time Manga Anime Desk Depth Recovery 2026-09-02

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recover-manga-depth-20260902.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "one-time-manga-depth-recovery-20260902"
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote verified fresh Manga Anime event without touching Live
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path=Path('data/desk-latest.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          assert data.get('editorialStandardVersion') == 3
          assert data.get('contentVersion') == 3
          desks=data.setdefault('desks',{})
          rows=desks.setdefault('manga-anime',[])

          story={
            'id':'manga-victoria-season2-special-20260902-1309',
            'desk':'manga-anime',
            'status':'LATEST',
            'title':'《手札が多めのビクトリア》宣布製作第2季及新作特別篇　9月8日先播總集篇',
            'dek':'第一季9月1日深夜播畢後，官方同步確認第2季與新作特別篇已進入製作，並公開新視覺。',
            'summary':'電視動畫《手札が多めのビクトリア》在第一季完結後正式宣布製作第2季及新作特別篇；9月8日深夜亦會播出回顧主要角色相遇、離別及重聚歷程的總集篇。',
            'body':'電視動畫《手札が多めのビクトリア》第一季在日本於9月1日深夜播出最終話後，製作方宣布新作特別篇及第2季確定製作，並公開由Victoria、Nonna與Jeffrey登場的新視覺。\n\n官方同時安排9月8日深夜0時30分播出總集篇《これまでとこれから》，回顧三名主要角色由相遇、離別到再次重聚並成為家人的經歷。ORICON NEWS及Crunchyroll News均在9月2日確認相關製作消息。',
            'context':'本作改編自守雨原作小說，第一季自7月起在東京電視台系列播出，由Studio DEEN負責動畫製作。',
            'why':'新季度與特別篇屬動畫系列後續製作的正式確認，直接影響作品後續播映、製作及粉絲關注度。',
            'watchNext':'留意官方公布第2季及特別篇的播出日期、製作陣容與新預告。',
            'sourceName':'ORICON NEWS／Crunchyroll News',
            'sourceUrl':'https://www.oricon.co.jp/news/2477608/full/',
            'timeLabel':'9月2日13:09 HKT核實',
            'sources':[
              {'name':'ORICON NEWS','url':'https://www.oricon.co.jp/news/2477608/full/'},
              {'name':'Crunchyroll News','url':'https://www.crunchyroll.com/news/latest/2026/9/1/victoria-of-many-faces-season-2-special-episode-anime-announced'}
            ],
            'deskSlugs':['manga-anime'],
            'section':'漫畫／動畫｜新作／續篇製作',
            'sectionLabel':'漫畫／動畫',
            'mediaLabel':'漫畫 / Anime',
            'image':None
          }

          if not any(r.get('id') == story['id'] for r in rows if isinstance(r,dict)):
              rows.insert(0,story)

          hkt=timezone(timedelta(hours=8))
          data['generatedAt']=datetime.now(hkt).replace(microsecond=0).isoformat()
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          reread=json.loads(path.read_text(encoding='utf-8'))
          manga=reread['desks']['manga-anime']
          assert any(r.get('id') == story['id'] for r in manga)
          assert len({r.get('id') for r in manga if isinstance(r,dict) and r.get('id')}) >= 7
          assert reread.get('editorialStandardVersion') == 3
          assert reread.get('contentVersion') == 3
          print('MANGA_DEPTH_RECOVERY_LOCAL_PASS retained_ids=',len({r.get('id') for r in manga if isinstance(r,dict) and r.get('id')}))
          PY

      - name: Commit recovery and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/recover-manga-depth-20260902.yml
          git add data/desk-latest.json
          git commit -m "Recover Manga Anime rolling desk depth"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "MANGA_DEPTH_RECOVERY_PUSH_PASS"
              exit 0
            fi
            sleep $((attempt * 2))
            git fetch origin main
            git rebase origin/main
          done
          exit 1
