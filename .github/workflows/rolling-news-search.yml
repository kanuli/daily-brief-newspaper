name: Rolling News Search 15m

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/rolling_news_collector.py"
      - ".github/workflows/rolling-news-search.yml"
  schedule:
    # 24/7 rolling discovery. Publication has its own separate 06:00-24:00 HKT window.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "rolling-news-search-15m"
  # Do not cancel a queued collector when GitHub runners are busy. A newer
  # schedule must wait behind the existing run so discovery can eventually
  # advance instead of entering a cancel/requeue starvation loop.
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current collector code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore previous rolling staging snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin news-staging:refs/remotes/origin/news-staging || true
          if git show origin/news-staging:data/search-staging.json > /tmp/search-staging.json 2>/dev/null; then
            echo "Previous staging snapshot restored"
          else
            echo '{}' > /tmp/search-staging.json
            echo "No previous staging snapshot; starting fresh"
          fi

      - name: Search all 10 news desks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rolling_news_collector.py \
            --existing /tmp/search-staging.json \
            --output data/search-staging.json

      - name: Publish discovery staging only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/search-staging.json
          if git diff --cached --quiet; then
            echo "No staging changes"
            exit 0
          fi
          git commit -m "Stage 15-minute rolling news candidates"
          git push --force-with-lease origin HEAD:news-staging
          echo "ROLLING_NEWS_STAGING_PUBLISHED branch=news-staging cadence=15m mode=24x7"
