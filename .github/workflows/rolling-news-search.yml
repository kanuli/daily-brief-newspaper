name: Rolling News Search 15m

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/rolling_news_collector.py"
      - ".github/workflows/rolling-news-search.yml"
  schedule:
    # HKT 06:00-23:45 plus 24:00. UTC = HKT-8.
    - cron: "*/15 0-16,22-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "rolling-news-search-15m"
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Enforce 06:00-24:00 HKT search window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Asia/Hong_Kong date +%H)
          MINUTE=$(TZ=Asia/Hong_Kong date +%M)
          ALLOWED=false
          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 23 ]; then
            ALLOWED=true
          elif [ "$HOUR" = "00" ] && [ "$MINUTE" = "00" ]; then
            ALLOWED=true
          fi
          echo "HKT=${HOUR}:${MINUTE} allowed=${ALLOWED}"
          echo "allowed=${ALLOWED}" >> "$GITHUB_OUTPUT"

      - name: Checkout current collector code
        if: steps.window.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore previous rolling staging snapshot
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin news-staging:refs/remotes/origin/news-staging || true
          if git show origin/news-staging:data/search-staging.json > /tmp/search-staging.json 2>/dev/null; then
            echo "Previous staging snapshot restored"
          else
            echo '{}' > /tmp/search-staging.json
            echo "No previous staging snapshot; starting fresh"
          fi

      - name: Search all 10 news desks
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rolling_news_collector.py \
            --existing /tmp/search-staging.json \
            --output data/search-staging.json

      - name: Publish discovery staging only
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/search-staging.json
          git commit -m "Stage 15-minute rolling news candidates"
          git push --force-with-lease origin HEAD:news-staging
          echo "ROLLING_NEWS_STAGING_PUBLISHED branch=news-staging"
