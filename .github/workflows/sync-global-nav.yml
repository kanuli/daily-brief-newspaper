name: Sync Global Navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/css/newspaper.css'
      - 'assets/css/live.css'
      - 'assets/css/extras.css'
      - 'assets/js/live-article.js'
      - 'assets/js/daily-extras.js'
      - 'assets/js/system-panel.js'
      - 'assets/js/page-updated-time.js'
      - '.github/workflows/sync-global-nav.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-global-navigation
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Normalize every root navbar and timestamp client
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          NAV_RE = re.compile(r'(<nav\b[^>]*class=["\'][^"\']*section-nav[^"\']*["\'][^>]*>)(.*?)(</nav>)', re.I | re.S)
          RETAIL_RE = re.compile(r'<a\b[^>]*href=["\'][^"\']*retail-deals\.html[^"\']*["\'][^>]*>.*?</a>', re.I | re.S)
          CSS_RE = re.compile(r'assets/css/newspaper\.css\?v=[^"\']+', re.I)
          LIVE_CSS_RE = re.compile(r'assets/css/live\.css\?v=[^"\']+', re.I)
          EXTRAS_CSS_RE = re.compile(r'assets/css/extras\.css\?v=[^"\']+', re.I)
          LIVE_ARTICLE_RE = re.compile(r'assets/js/live-article\.js\?v=[^"\']+', re.I)
          DAILY_EXTRAS_RE = re.compile(r'assets/js/daily-extras\.js\?v=[^"\']+', re.I)
          PAGE_TIME_RE = re.compile(r'<script\b[^>]*src=["\']assets/js/page-updated-time\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*', re.I)

          labels = {
              'live.html': '🔴 Live', 'index.html': '📰 頭版', 'world.html': '🌍 世界', 'asia.html': '🌏 亞洲',
              'hong-kong.html': '🇭🇰 香港', 'japan.html': '🇯🇵 日本', 'finance.html': '📈 財經', 'stocks.html': '📊 Stock News',
              'technology.html': '🤖 AI / 科技', 'manga-anime.html': '📚 漫畫 / Anime',
              'manchester-united.html': '🏟️ Manchester United', 'football.html': '⚽ Football', 'archive.html': '🗂️ Archive',
          }

          def relabel(inner):
              for href, label in labels.items():
                  pattern = re.compile(r'(<a\b[^>]*href=["\'][^"\']*' + re.escape(href) + r'[^"\']*["\'][^>]*>).*?(</a>)', re.I | re.S)
                  inner = pattern.sub(lambda m, label=label: m.group(1) + label + m.group(2), inner)
              return inner

          changed=[]; checked=[]
          for path in sorted(Path('.').glob('*.html')):
              if path.name == 'retail-deals.html':
                  raise SystemExit('retired retail-deals.html must not exist')
              text=path.read_text(encoding='utf-8')
              match=NAV_RE.search(text)
              if not match: continue
              checked.append(path.name)
              inner=RETAIL_RE.sub('', match.group(2))
              inner=relabel(inner)
              if 'retail-deals.html' in inner or '🛒 最新優惠' in inner:
                  raise SystemExit(f'{path.name}: retired Retail navigation remains')
              football=inner.find('football.html'); archive=inner.find('archive.html')
              if football>=0 and archive>=0 and not football < archive:
                  raise SystemExit(f'{path.name}: nav order must be Football -> Archive')
              new_nav=match.group(1)+inner+match.group(3)
              new_text=text[:match.start()]+new_nav+text[match.end():]
              new_text=CSS_RE.sub('assets/css/newspaper.css?v=20260904-content-width-v1', new_text)
              new_text=LIVE_CSS_RE.sub('assets/css/live.css?v=20260904-topic-layout-v10', new_text)
              new_text=EXTRAS_CSS_RE.sub('assets/css/extras.css?v=20260905-vocab-width-height-v10', new_text)
              new_text=LIVE_ARTICLE_RE.sub('assets/js/live-article.js?v=20260904-topic-layout-v3', new_text)
              new_text=DAILY_EXTRAS_RE.sub('assets/js/daily-extras.js?v=20260904-section-width-v1', new_text)
              new_text=PAGE_TIME_RE.sub('', new_text)
              script='<script src="assets/js/page-updated-time.js?v=20260901-page-time-v1" defer></script>\n'
              if '</body>' not in new_text.lower(): raise SystemExit(f'{path.name}: missing body close tag')
              new_text=re.sub(r'</body>', script+'</body>', new_text, count=1, flags=re.I)
              if new_text!=text:
                  path.write_text(new_text,encoding='utf-8'); changed.append(path.name)
          if not checked: raise SystemExit('No root section-nav pages found')
          print('GLOBAL_NAV_CHECKED',len(checked),checked)
          print('GLOBAL_NAV_CHANGED',len(changed),changed)
          PY

      - name: Verify runtime navbar contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('assets/js/system-panel.js').read_text(encoding='utf-8')
          required=['🌍 世界','🌏 亞洲','🇭🇰 香港','🇯🇵 日本','📈 財經','📊 Stock News','🤖 AI / 科技','📚 漫畫 / Anime','🏟️ Manchester United','⚽ Football','🗂️ Archive','🔴 Live','📰 頭版']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('system-panel runtime icon labels missing: '+repr(missing))
          if 'retail-deals.html' in text or '🛒 最新優惠' in text:
              raise SystemExit('retired Retail navigation remains in system-panel')
          print('RUNTIME_NAV_RETAIL_RETIRED_OK')
          PY

      - name: Commit synchronized navbars
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then echo 'GLOBAL_NAV_ALREADY_SYNCED'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' assets/js/system-panel.js
          git commit -m 'Synchronize navigation after Retail retirement'
          git push origin HEAD:main

      - name: Explicitly deploy latest main to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo 'GLOBAL_NAV_PAGES_DISPATCHED'
