name: Generate Daily Brief

on:
  schedule:
    - cron: "15 7 * * *"
      timezone: "Asia/Hong_Kong"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install --upgrade openai pydantic

      - name: Resolve Hong Kong edition date
        id: edition
        shell: bash
        run: echo "date=$(TZ=Asia/Hong_Kong date +%F)" >> "$GITHUB_OUTPUT"

      - name: Generate daily newspaper data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          DATE="${{ steps.edition.outputs.date }}"
          if [ -f "data/$DATE.json" ]; then
            echo "Edition $DATE already exists; skipping duplicate generation."
            exit 0
          fi
          python scripts/generate_daily.py

      - name: Commit new edition
        shell: bash
        run: |
          DATE="${{ steps.edition.outputs.date }}"
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add -- "data/latest.json" "data/archive.json"
          if [ -f "data/$DATE.json" ]; then git add -- "data/$DATE.json"; fi
          if [ -f "editions/$DATE.html" ]; then git add -- "editions/$DATE.html"; fi
          if git diff --cached --quiet; then
            echo "No new edition changes to commit."
            exit 0
          fi
          git commit -m "Publish Daily Brief $DATE"
          git push
