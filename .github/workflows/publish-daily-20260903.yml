name: Publish Daily 2026-09-03

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/publish_daily_20260903.py"
      - ".github/workflows/publish-daily-20260903.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish Daily Edition
        run: python scripts/publish_daily_20260903.py
      - name: Validate site schema
        run: python scripts/validate_site_data.py
      - name: Validate Daily v3
        run: python scripts/validate_daily_v3.py
      - name: Validate editorial depth
        run: python scripts/validate_editorial_v2.py
      - name: Validate Stock News
        run: python scripts/validate_stock_news.py
      - name: Build static fallback
        run: python scripts/build_static_news_fallback.py
      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/2026-09-03.json data/archive.json data/topic-more/2026-09-03.json data/desk-latest.json data/live.json editions/2026-09-03.html index.html world.html asia.html hong-kong.html japan.html finance.html technology.html manga-anime.html manchester-united.html football.html live.html archive.html 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Publish 3 Sep 2026 Cantonese Daily Edition"
          git push origin HEAD:main
