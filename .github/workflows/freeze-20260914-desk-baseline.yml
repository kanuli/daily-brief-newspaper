name: One-shot 2026-09-14 desk baseline freeze

on:
  push:
    paths:
      - '.github/workflows/freeze-20260914-desk-baseline.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze rolling desk to Daily baseline and self-clean
        run: |
          python scripts/catch_up_live_into_desk.py
          git rm .github/workflows/freeze-20260914-desk-baseline.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/desk-latest.json data/live.json
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Freeze 2026-09-14 08:00 desk baseline"
          else
            git commit -m "Freeze 2026-09-14 08:00 desk baseline"
          fi
          git push