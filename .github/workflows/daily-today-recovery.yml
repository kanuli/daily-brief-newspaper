name: Today Daily Recovery

on:
  push:
    branches:
      - main
    paths:
      - data/live.json
      - data/desk-latest.json
      - data/latest.json
      - scripts/build_today_daily_from_desk.py
      - scripts/sync_daily_archive.py
      - .github/workflows/daily-today-recovery.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today-daily-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build TODAY Daily from current verified Rolling Desk when stale
        id: build
        shell: bash
        run: |
          set -euo pipefail
          before=$(python -c 'import json; print(json.load(open("data/latest.json",encoding="utf-8")).get("date",""))')
          python scripts/build_today_daily_from_desk.py --write | tee /tmp/daily-recovery.json
          after=$(python -c 'import json; print(json.load(open("data/latest.json",encoding="utf-8")).get("date",""))')
          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "after=${after}" >> "$GITHUB_OUTPUT"
          if [ "$before" != "$after" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate recovered Daily
        if: steps.build.outputs.changed == 'true'
        run: |
          python scripts/validate_daily_v3.py
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          d=json.load(open('data/latest.json',encoding='utf-8'))
          today=datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=8))).date().isoformat()
          if d.get('date') != today:
              raise SystemExit(f"Daily recovery did not reach today: {d.get('date')} != {today}")
          print('TODAY_DAILY_RECOVERY_VALIDATED', today, len(d.get('articles') or []))
          PY

      - name: Self-heal Daily archive from every valid dated edition
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_daily_archive.py | tee /tmp/archive-sync.json
          python - <<'PY'
          import json
          from pathlib import Path
          archive=json.load(open('data/archive.json',encoding='utf-8'))
          rows=archive.get('editions') or []
          if not rows:
              raise SystemExit('Archive is empty after self-heal')
          dates=[str(r.get('date') or '') for r in rows]
          if dates != sorted(dates, reverse=True):
              raise SystemExit('Archive is not reverse chronological')
          for row in rows:
              url=str(row.get('url') or '')
              if not url or not Path(url).is_file():
                  raise SystemExit(f"Archive wrapper missing: {url}")
              dated=Path('data') / f"{row['date']}.json"
              if not dated.is_file():
                  raise SystemExit(f"Archive points to missing Daily JSON: {dated}")
          print('DAILY_ARCHIVE_SELF_HEAL_VALIDATED', rows[0]['date'], len(rows))
          PY

      - name: Commit recovered Daily and archive to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_and_commit() {
            git add -- data/latest.json data/archive.json data/topic-more editions
            git add -- data/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json
            if git diff --cached --quiet; then
              echo "TODAY_DAILY_ARCHIVE_RECOVERY_NOOP"
              return 1
            fi
            current=$(python -c 'import json; print(json.load(open("data/latest.json",encoding="utf-8")).get("date","unknown"))')
            git commit -m "Self-heal Daily and archive through ${current}"
            return 0
          }

          if ! stage_and_commit; then
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "TODAY_DAILY_ARCHIVE_RECOVERY_PUSHED"
              exit 0
            fi
            echo "Push race on attempt ${attempt}; rebuilding from latest main"
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_today_daily_from_desk.py --write
            python scripts/validate_daily_v3.py
            python scripts/sync_daily_archive.py
            if ! stage_and_commit; then
              echo "Another producer already persisted the same recovery state."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Daily/archive recovery push failed after retries" >&2
          exit 1

      - name: Recovery status
        if: always()
        run: echo "Daily recovery ${{ steps.build.outputs.before }} -> ${{ steps.build.outputs.after }} changed=${{ steps.build.outputs.changed }}"
