name: Protect Golden F01 Reference

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/patch_golden_retention.py"
      - ".github/workflows/protect-golden-f01.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/patch_golden_retention.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cosyvoice-retention.yml .github/workflows/cosyvoice-capacity-guard.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Protect Nvidia golden F01 reference asset"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
