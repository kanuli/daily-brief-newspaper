name: One-shot align desk freshness contract
on:
  push:
    paths:
      - '.github/workflows/fix-desk-freshness-contract.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align freshness windows, validate, and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/desk_freshness_policy.py')
          s=p.read_text(encoding='utf-8')
          old='''PUBLIC_DESK_FRESHNESS_HOURS = {\n    "world": 8,\n    "asia": 12,\n    "hong-kong": 12,\n    "japan": 12,\n    "market-economy": 8,\n    "ai-tech": 12,\n    "manga-anime": 24,\n    "manchester-united": 24,\n    "football": 8,\n}'''
          new='''PUBLIC_DESK_FRESHNESS_HOURS = {\n    "world": 24,\n    "asia": 24,\n    "hong-kong": 24,\n    "japan": 24,\n    "market-economy": 24,\n    "ai-tech": 24,\n    "manga-anime": 48,\n    "manchester-united": 48,\n    "football": 48,\n}'''
          if old not in s:
              raise SystemExit('expected freshness policy block not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python scripts/merge_live_into_desk.py
          python scripts/validate_publication_current.py
          rm -f .tmp-publication-qa-20260914.txt
          git rm .github/workflows/fix-desk-freshness-contract.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/desk_freshness_policy.py data/desk-latest.json .tmp-publication-qa-20260914.txt || true
          git commit -m "Align public desk freshness windows with Daily contract"
          git push