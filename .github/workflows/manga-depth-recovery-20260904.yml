name: Manga Anime Depth Recovery 2026-09-04

on:
  push:
    paths:
      - '.github/workflows/manga-depth-recovery-20260904.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover Manga Anime depth
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/desk-latest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('editorialStandardVersion') == 3
          assert data.get('contentVersion') == 3
          desks = data.setdefault('desks', {})
          desk = desks.setdefault('manga-anime', [])

          story_id = 'manga-anime-dark-gathering-season2-20260904-1210'
          if not any(x.get('id') == story_id for x in desk):
              story = {
                'id': story_id,
                'desk': 'manga-anime',
                'status': 'LATEST',
                'title': '《Dark Gathering》動畫第2季確認2027年播出　京都篇由原作第34話展開',
                'dek': '官方更新第2季播出年份並公開首張恐怖視覺，故事舞台移至京都，主創與主要聲優陣容延續。',
                'summary': '《Dark Gathering》官方確認電視動畫第2季將於2027年播出，並公開以A水壩靈體為主題的首張恐怖視覺；新一季由原作單行本第9卷第34話「上洛」開始描寫京都篇。',
                'body': '《Dark Gathering》動畫官方9月4日更新第2季資料，確認新一季將於2027年播出。官方播出頁已標示「第2期 2027年放送決定」，同日公開的首張恐怖視覺以昏暗水壩監査廊與A水壩靈體為主題。\n\nORICON NEWS同日報道，第2季會把舞台移至京都，從原作單行本第9卷第34話「上洛」開始改編；監督博史池畠、系列構成村越繁、動畫製作OLM等主要製作陣容延續，篠原侑、島崎信長、花澤香菜及川口莉奈等主要聲優亦繼續參與。',
                'context': '第1季於2023年播出；第2季早前已宣布製作，今次更新首次把正式播出年份鎖定在2027年，並進一步確認京都篇內容。',
                'why': '這是作品第2季從「製作決定」進一步進入有播出年份與新視覺的實質宣傳階段，對動畫新作時間表及原作粉絲均屬新資訊。',
                'watchNext': '留意正式開播月份、追加預告、主題曲、播出平台及京都篇更多角色與製作資訊。',
                'sourceName': 'TV動畫《Dark Gathering》官方／ORICON NEWS',
                'sourceUrl': 'https://darkgathering.jp/onair/',
                'timeLabel': '9月4日12:10 HKT核實',
                'sources': [
                  {'name': 'TV動畫《Dark Gathering》官方', 'url': 'https://darkgathering.jp/onair/'},
                  {'name': 'ORICON NEWS', 'url': 'https://www.oricon.co.jp/news/2478185/'}
                ],
                'deskSlugs': ['manga-anime'],
                'section': '漫畫／動畫｜新作動畫／Dark Gathering',
                'sectionLabel': '漫畫／動畫',
                'mediaLabel': '漫畫 / Anime',
                'image': None
              }
              desk.insert(0, story)

          data['generatedAt'] = '2026-09-04T12:10:00+08:00'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'editor-in-chief-robot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/desk-latest.json
          git rm .github/workflows/manga-depth-recovery-20260904.yml
          git commit -m 'Restore Manga/Anime rolling desk depth' || exit 0
          git push
