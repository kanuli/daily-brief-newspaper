name: One-time Daily Publish 2026-09-11

on:
  push:
    paths:
      - '.github/workflows/daily-publish-2026-09-11.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, validate and publish Daily Edition 022
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          from copy import deepcopy

          root = pathlib.Path('.')
          payload_path = root / 'data/.daily-publish-2026-09-11.json'
          payload = json.loads(payload_path.read_text(encoding='utf-8'))
          assert payload['date'] == '2026-09-11'
          assert payload['editionNumber'] == '022'
          assert payload['editorialStandardVersion'] == 3 and payload['contentVersion'] == 3

          required = ['title','dek','summary','body','context','why','watchNext','sourceName','sourceUrl','timeLabel','sources']
          ids = []
          for a in payload['articles']:
              assert a.get('id') and a['id'] not in ids, f"duplicate/missing id {a.get('id')}"
              ids.append(a['id'])
              for key in required:
                  assert a.get(key), f"{a['id']} missing {key}"
              assert '\n\n' in a['body'], f"{a['id']} body must contain >=2 paragraphs"
              assert len(a['body'].replace('\n','')) >= 100, f"{a['id']} body too short"
              assert isinstance(a['sources'], list) and a['sources'], f"{a['id']} missing sources"
          assert payload['leadId'] in ids
          assert len(payload['topFive']) == 5 and len(set(payload['topFive'])) == 5
          assert all(x in ids for x in payload['topFive'])

          # Front-page routing sanity: specialist sports/anime content may not masquerade as serious desks.
          forbidden_front = re.compile(r'^(Football|Manchester United|漫畫|Anime)')
          for a in payload['articles']:
              if a['section'].startswith(('世界','亞洲','日本','📈 財經','財經')):
                  assert not forbidden_front.search(a['section']), f"misrouted front story {a['id']}"

          daily = {k:v for k,v in payload.items() if k != 'archiveHeadline'}
          (root / 'data/2026-09-11.json').write_text(json.dumps(daily, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
          (root / 'data/latest.json').write_text(json.dumps(daily, ensure_ascii=False, separators=(',',':')), encoding='utf-8')

          topic_more = {'date':'2026-09-11','editorialStandardVersion':3,'contentVersion':3,'articles':[],'sections':[]}
          topic_dir = root / 'data/topic-more'
          topic_dir.mkdir(parents=True, exist_ok=True)
          (topic_dir / '2026-09-11.json').write_text(json.dumps(topic_more, ensure_ascii=False, separators=(',',':')), encoding='utf-8')

          # Preserve and extend the deep Rolling Desk reservoir. Never collapse it to homepage stories.
          desk_path = root / 'data/desk-latest.json'
          desk = json.loads(desk_path.read_text(encoding='utf-8'))
          desks = desk.setdefault('desks', {})
          floor = {'world':8,'asia':8,'hong-kong':6,'japan':8,'market-economy':8,'ai-tech':6,'manga-anime':4,'manchester-united':4,'football':10}
          for slug in floor:
              desks.setdefault(slug, [])

          def slug_for(article):
              s = str(article.get('section',''))
              if s.startswith('世界'): return 'world'
              if s.startswith('亞洲'): return 'asia'
              if s.startswith('香港'): return 'hong-kong'
              if s.startswith('日本'): return 'japan'
              if s.startswith(('📈','財經')): return 'market-economy'
              if s.startswith(('AI / 科技','AI／科技')): return 'ai-tech'
              if s.startswith(('漫畫','Anime')): return 'manga-anime'
              if s.startswith('Manchester United'): return 'manchester-united'
              if s.startswith('Football'): return 'football'
              return None

          def upsert(slug, article):
              if not slug: return
              copy = deepcopy(article)
              copy['desk'] = slug
              copy['deskSlugs'] = [slug]
              copy.setdefault('status','LATEST')
              old = [x for x in desks[slug] if x.get('id') != copy.get('id')]
              desks[slug] = [copy] + old

          for a in daily['articles']:
              upsert(slug_for(a), a)

          # Keep the verified 07:00 Japan item in the 08:00 baseline reservoir.
          live_path = root / 'data/live.json'
          previous_live = json.loads(live_path.read_text(encoding='utf-8')) if live_path.exists() else {}
          for item in previous_live.get('items', []):
              slug = item.get('desk') or slug_for(item)
              if slug in desks:
                  upsert(slug, item)

          # Deduplicate every desk by stable story id without destructive freshness pruning.
          for slug, arr in desks.items():
              seen=set(); clean=[]
              for item in arr:
                  sid=item.get('id')
                  if not sid or sid in seen: continue
                  seen.add(sid); clean.append(item)
              desks[slug]=clean

          # Routing hard gate: structured desk tags may not put football/anime into serious desks.
          serious = {'world','asia','japan','market-economy'}
          for slug in serious:
              for item in desks[slug]:
                  tags = set(item.get('deskSlugs') or [])
                  d = item.get('desk')
                  if d: tags.add(d)
                  assert not ({'football','manchester-united','manga-anime'} & tags), f"routing violation {slug}: {item.get('id')} {tags}"

          counts = {slug:len(desks[slug]) for slug in floor}
          failures = {slug:(counts[slug], minimum) for slug,minimum in floor.items() if counts[slug] < minimum}
          assert not failures, f"desk hard-floor failure: {failures}; counts={counts}"
          assert counts['japan'] >= 8

          desk['date']='2026-09-11'
          desk['generatedAt']='2026-09-11T08:00:00+08:00'
          desk['mode']='ROLLING_DESK_LATEST'
          desk['editorialStandardVersion']=3
          desk['contentVersion']=3
          desk_path.write_text(json.dumps(desk, ensure_ascii=False, indent=2), encoding='utf-8')

          archive_path = root / 'data/archive.json'
          archive = json.loads(archive_path.read_text(encoding='utf-8'))
          entry = {
              'date':'2026-09-11','shortDate':'11 SEP 2026','headline':payload['archiveHeadline'],
              'topics':['世界','亞洲','香港','日本','📈 財經 / 全球市場','AI / 科技','漫畫 / Anime','Manchester United','Football'],
              'url':'editions/2026-09-11.html'
          }
          archive['editions']=[entry]+[x for x in archive.get('editions',[]) if x.get('date')!='2026-09-11']
          archive_path.write_text(json.dumps(archive, ensure_ascii=False, separators=(',',':')), encoding='utf-8')

          old_html=(root/'editions/2026-09-10.html').read_text(encoding='utf-8')
          html=old_html.replace('2026-09-10','2026-09-11').replace('20260910','20260911').replace('NO. <span data-edition-number>021</span>','NO. <span data-edition-number>022</span>')
          (root/'editions/2026-09-11.html').write_text(html,encoding='utf-8')

          live = {
              'mode':'DAILY_BASELINE','date':'2026-09-11','editorialStandardVersion':3,'contentVersion':3,
              'lastUpdated':'2026-09-11T08:00:00+08:00','lastUpdatedLabel':'2026年9月11日 08:00 HKT',
              'windowLabel':'08:00 HKT Daily Edition Baseline','nextUpdateLabel':'下一輪為 09:00 HKT Live Update',
              'newCount':0,'updatedCount':0,'developingCount':0,'items':[],'topFive':[],
              'coverage':{'status':'COMPLETE','deskLatestStoryCounts':counts,'deskLatestDepthMet':True,
                  'routingGateMet':True,'sourceGateMet':True,'copyGateMet':True,'geographicGateMet':True,
                  'footballGateMet':True,'publishingGateMet':True,'japanCountVerified':counts['japan']}
          }
          live_path.write_text(json.dumps(live,ensure_ascii=False,indent=2),encoding='utf-8')

          # Read-back validation of all publication artifacts.
          for path in ['data/2026-09-11.json','data/latest.json','data/archive.json','data/desk-latest.json','data/live.json','data/topic-more/2026-09-11.json']:
              json.loads((root/path).read_text(encoding='utf-8'))
          reread=json.loads((root/'data/latest.json').read_text(encoding='utf-8'))
          assert reread['date']=='2026-09-11' and reread['editionNumber']=='022'
          assert reread['editorialStandardVersion']==3 and reread['contentVersion']==3
          assert (root/'editions/2026-09-11.html').exists()
          print('DAILY_GATE_PASS counts=', json.dumps(counts, ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/2026-09-11.json data/latest.json data/archive.json data/desk-latest.json data/live.json data/topic-more/2026-09-11.json editions/2026-09-11.html
          git commit -m 'Publish 2026-09-11 Daily Edition 022'
          git push
