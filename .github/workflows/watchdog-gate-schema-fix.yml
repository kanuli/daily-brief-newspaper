name: Watchdog coverage gate schema fix

on:
  push:
    paths:
      - '.github/workflows/watchdog-gate-schema-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Persist canonical coverage gate evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('scripts/merge_live_into_desk.py')
          s=p.read_text(encoding='utf-8')
          old='''    source_gate = bool(coverage.get("sourceGateMet", True))\n    geographic_gate = bool(coverage.get("geographicGateMet", True))\n    football_gate = counts["football"] >= FLOORS["football"] and bool(coverage.get("footballGateMet", True))\n    publication_ready = depth_met and source_gate and geographic_gate and football_gate\n    coverage["deskLatestStoryCounts"] = counts\n    coverage["deskLatestDepthMet"] = depth_met\n    coverage["japanCountVerified"] = counts["japan"]\n    coverage["footballGateMet"] = football_gate\n    coverage["publishingGateMet"] = publication_ready\n'''
          new='''    # Persist canonical *GateMet evidence instead of silently defaulting missing\n    # fields to True. Legacy publishers used sourceGate/geographicGate/footballGate.\n    source_gate = bool(coverage.get("sourceGateMet", coverage.get("sourceGate", False)))\n    geographic_gate = bool(coverage.get("geographicGateMet", coverage.get("geographicGate", False)))\n    football_gate = counts["football"] >= FLOORS["football"] and bool(\n        coverage.get("footballGateMet", coverage.get("footballGate", False))\n    )\n    publication_ready = depth_met and source_gate and geographic_gate and football_gate\n    coverage["deskLatestStoryCounts"] = counts\n    coverage["deskLatestDepthMet"] = depth_met\n    coverage["japanCountVerified"] = counts["japan"]\n    coverage["sourceGateMet"] = source_gate\n    coverage["geographicGateMet"] = geographic_gate\n    coverage["footballGateMet"] = football_gate\n    coverage["publishingGateMet"] = publication_ready\n'''
          if old not in s:
              raise SystemExit('expected merge gate block not found')
          p.write_text(s.replace(old,new),encoding='utf-8')

          # Canonicalize the current Live snapshot too; do not invent evidence:\n          # only map already-true legacy gate evidence to the validator schema.\n          lp=Path('data/live.json')
          live=json.loads(lp.read_text(encoding='utf-8'))
          cov=live.setdefault('coverage',{})
          cov['sourceGateMet']=bool(cov.get('sourceGateMet',cov.get('sourceGate',False)))
          cov['geographicGateMet']=bool(cov.get('geographicGateMet',cov.get('geographicGate',False)))
          cov['footballGateMet']=bool(cov.get('footballGateMet',cov.get('footballGate',False)))
          cov['publishingGateMet']=bool(cov.get('deskLatestDepthMet')) and cov['sourceGateMet'] and cov['geographicGateMet'] and cov['footballGateMet']
          cov['status']='COMPLETE' if cov['publishingGateMet'] else 'INCOMPLETE'
          lp.write_text(json.dumps(live,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit permanent fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/watchdog-gate-schema-fix.yml
          git add scripts/merge_live_into_desk.py data/live.json
          git commit -m "Persist canonical Live coverage gate evidence"
          git push origin main
