# Immediate publication-state watchdog trigger enabled 2026-09-08
# Existing watchdog recovery invocation refreshed after 19:00 publication-state failure.
name: Live Publication Auto Maintenance

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "live-publication-auto-maintenance"
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect current Live publication state and verified prepublish draft
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin prepublish-news:refs/remotes/origin/prepublish-news || true
          if git show origin/prepublish-news:data/prepublish.json > /tmp/prepublish.json 2>/dev/null; then
            export HAVE_DRAFT=true
          else
            printf '%s\n' '{}' > /tmp/prepublish.json
            export HAVE_DRAFT=false
          fi

          if python scripts/validate_desk_freshness.py --report /tmp/live-maintenance-freshness.json; then
            export DESK_FRESHNESS_OK=true
          else
            export DESK_FRESHNESS_OK=false
          fi

          python - <<'PY' > /tmp/live-failover.env
          import json
          import os
          from datetime import datetime, timedelta, timezone

          HKT=timezone(timedelta(hours=8))
          now=datetime.now(timezone.utc)
          draft=json.load(open('/tmp/prepublish.json',encoding='utf-8'))
          live=json.load(open('data/live.json',encoding='utf-8'))
          have_draft=os.environ.get('HAVE_DRAFT') == 'true'
          desk_fresh=os.environ.get('DESK_FRESHNESS_OK') == 'true'
          floors={
              'world':8,'asia':8,'hong-kong':6,'japan':8,'market-economy':8,
              'ai-tech':6,'manga-anime':4,'manchester-united':4,'football':10,
          }

          def parse(value):
              return datetime.fromisoformat(str(value).replace('Z','+00:00'))

          coverage=live.get('coverage') if isinstance(live.get('coverage'),dict) else {}
          counts=coverage.get('deskLatestStoryCounts') if isinstance(coverage.get('deskLatestStoryCounts'),dict) else {}
          depth_ok=all(int(counts.get(slug) or 0) >= minimum for slug,minimum in floors.items())
          coverage_ok=(
              coverage.get('status') == 'COMPLETE'
              and coverage.get('publishingGateMet') is True
              and coverage.get('deskLatestDepthMet') is True
              and depth_ok
              and desk_fresh
          )
          try:
              current=parse(live.get('lastUpdated') or '').astimezone(timezone.utc)
          except Exception:
              current=datetime.min.replace(tzinfo=timezone.utc)

          live_age=now-current
          catastrophic_stale=live_age > timedelta(hours=6)
          local_now=now.astimezone(HKT)
          due_hour=local_now.hour
          allowed_now=(due_hour in (0,6,7) or 9 <= due_hour <= 23)
          due=local_now.replace(minute=0,second=0,microsecond=0)
          current_is_due=allowed_now and current.astimezone(HKT) >= due
          promote=False
          emergency=False
          reason='healthy'
          target=None

          if not have_draft:
              reason='no-prepublish-draft'
          else:
              try:
                  target=parse(draft.get('targetPublication') or '').astimezone(timezone.utc)
              except Exception:
                  reason='invalid-draft-target'
              else:
                  local=target.astimezone(HKT)
                  target_allowed=(local.hour in (0,6,7) or 9 <= local.hour <= 23)
                  if draft.get('status') != 'VERIFIED_DRAFT':
                      reason='draft-not-verified'
                  elif draft.get('publicationType') != 'LIVE':
                      reason='draft-not-live'
                  elif not isinstance(draft.get('articles'),list) or not draft['articles']:
                      reason='verified-draft-empty'
                  elif current >= target:
                      reason='main-live-current'
                  else:
                      age=now-target
                      if age < timedelta(minutes=8):
                          reason='normal-publisher-grace'
                      elif target_allowed and age <= timedelta(minutes=90):
                          promote=True
                          reason='main-live-behind-verified-draft'
                      elif catastrophic_stale and age <= timedelta(hours=36):
                          # Emergency mode is deliberately narrow: Live must be
                          # catastrophically stale and input must already be a
                          # source-verified draft. Story/source timestamps are
                          # preserved; only the missed publication gate is bypassed.
                          promote=True
                          emergency=True
                          reason='emergency-stale-live-verified-draft'
                      elif not target_allowed:
                          reason='outside-live-publication-window'
                      else:
                          reason='verified-draft-too-old'

          # Stale Live must never be considered healthy simply because the
          # current clock is outside a normal publication window.
          repair=((current_is_due and not coverage_ok and not promote) or (catastrophic_stale and not promote))
          if repair:
              reason='catastrophic-live-stale-no-promotable-draft' if catastrophic_stale else 'current-live-coverage-or-freshness-incomplete-no-promotable-draft'

          print('REPAIR=' + ('true' if repair else 'false'))
          print('PROMOTE=' + ('true' if promote else 'false'))
          print('EMERGENCY=' + ('true' if emergency else 'false'))
          print('REASON=' + reason)
          print('DRAFT_ID=' + str(draft.get('draftId') or ''))
          print('TARGET=' + (target.isoformat() if target else ''))
          print('CURRENT=' + str(live.get('lastUpdated') or ''))
          print('COVERAGE=' + str(coverage.get('status') or 'missing'))
          print('DESK_FRESH=' + ('true' if desk_fresh else 'false'))
          print('LIVE_AGE_MINUTES=' + str(int(live_age.total_seconds() // 60)))
          PY
          source /tmp/live-failover.env
          echo "Live watchdog: repair=${REPAIR}; promote=${PROMOTE}; emergency=${EMERGENCY}; reason=${REASON}; current=${CURRENT:-none}; coverage=${COVERAGE:-none}; deskFresh=${DESK_FRESH:-false}; ageMinutes=${LIVE_AGE_MINUTES:-unknown}"
          echo "repair=${REPAIR}" >> "$GITHUB_OUTPUT"
          echo "promote=${PROMOTE}" >> "$GITHUB_OUTPUT"
          echo "emergency=${EMERGENCY}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "draft_id=${DRAFT_ID}" >> "$GITHUB_OUTPUT"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Repair current Live coverage, freshness and Rolling Desk state
        id: repair
        if: steps.inspect.outputs.repair == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/recover_desk_container_watchdog.py
            python scripts/sync_daily_into_desk_watchdog.py
            python scripts/recover_manga_freshness_watchdog.py
            python scripts/recover_desk_freshness_watchdog.py
            python scripts/merge_live_into_desk.py
            python scripts/validate_desk_freshness.py --report /tmp/live-maintenance-freshness-after.json
            python scripts/validate_publication_current.py
            python scripts/audit_tts_language.py

            git add -- data/live.json data/desk-latest.json
            if git diff --cached --quiet; then
              echo "LIVE_COVERAGE_REPAIR_NOOP publication already caught up"
              exit 0
            fi

            git commit -m "Repair current Live coverage, freshness and Rolling Desk state"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "LIVE_COVERAGE_REPAIR_PASS"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Current Live coverage repair could not push after retries" >&2
          exit 1

      - name: Promote verified draft when normal publisher missed the hour
        id: promote
        if: steps.inspect.outputs.repair != 'true' && steps.inspect.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if [ "${{ steps.inspect.outputs.emergency }}" = "true" ]; then
              python scripts/promote_verified_live_draft.py /tmp/prepublish.json --max-age-minutes 2160
            else
              python scripts/promote_verified_live_draft.py /tmp/prepublish.json
            fi

            # Persist the independently verified Live snapshot first. Global
            # Rolling Desk freshness is health state, not a transaction guard
            # for an otherwise valid new article.
            git add -- data/live.json
            if git diff --cached --quiet; then
              echo "LIVE_FAILOVER_NOOP normal publisher already caught up"
              exit 0
            fi

            TARGET_LABEL=$(python - <<'PY'
          import json
          from datetime import datetime
          d=json.load(open('/tmp/prepublish.json',encoding='utf-8'))
          t=datetime.fromisoformat(d['targetPublication'].replace('Z','+00:00'))
          print('24:00' if t.hour == 0 else f'{t.hour:02d}:00')
          PY
            )
            if [ "${{ steps.inspect.outputs.emergency }}" = "true" ]; then
              git commit -m "Emergency publish verified Live recovery for ${TARGET_LABEL} HKT"
            else
              git commit -m "Failover publish verified ${TARGET_LABEL} HKT Live update"
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "LIVE_PUBLICATION_AUTO_FAILOVER_PASS draft=${{ steps.inspect.outputs.draft_id }} target=${{ steps.inspect.outputs.target }} emergency=${{ steps.inspect.outputs.emergency }}"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Verified Live failover could not push after retries" >&2
          exit 1

      - name: Live publication healthy
        if: steps.inspect.outputs.repair != 'true' && steps.inspect.outputs.promote != 'true'
        run: echo "Live publication maintenance healthy (${{ steps.inspect.outputs.reason }})."

      - name: Report robot outcome to Editor-in-Chief
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_WORKFLOW: ${{ github.workflow }}
          REPORT_CONCLUSION: ${{ job.status }}
          REPORT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run editor-in-chief-newsroom-assignment.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f trigger_workflow="${REPORT_WORKFLOW}" \
            -f trigger_conclusion="${REPORT_CONCLUSION}" \
            -f trigger_run_id="${REPORT_RUN_ID}"
          echo "EDITOR_CALLBACK_SENT workflow=${REPORT_WORKFLOW} conclusion=${REPORT_CONCLUSION} run_id=${REPORT_RUN_ID}"

