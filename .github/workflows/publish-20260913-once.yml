name: Publish 2026-09-13 Daily Once
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_20260913.py'
      - '.github/workflows/publish-20260913-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Daily Edition 024
        run: |
          python scripts/publish_20260913.py
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('data/2026-09-13.json'), Path('data/latest.json'), Path('data/desk-latest.json')]:
              text = p.read_text(encoding='utf-8')
              text = text.replace('本輪賽事', '今場賽事').replace('本輪結果', '今場結果')
              p.write_text(text, encoding='utf-8')
          live_path = Path('data/live.json')
          live = json.loads(live_path.read_text(encoding='utf-8'))
          live.setdefault('coverage', {})['status'] = 'DAILY_BASELINE'
          live_path.write_text(json.dumps(live, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate Daily v3
        run: python scripts/validate_daily_v3.py
      - name: Validate editorial routing and site data
        run: |
          python scripts/validate_editorial_v2.py
          python scripts/validate_site_data.py
      - name: Validate Stock News oversight
        run: |
          if ! python scripts/validate_stock_news.py > /tmp/stock.log 2>&1; then
            cp /tmp/stock.log stock-validation-debug.txt
            git config user.name 'daily-brief-publisher'
            git config user.email 'actions@users.noreply.github.com'
            git add stock-validation-debug.txt
            git commit -m 'chore: capture 2026-09-13 Stock News validation failure'
            git push origin main
            cat /tmp/stock.log
            exit 1
          fi
          cat /tmp/stock.log
      - name: Build static fallback
        run: python scripts/build_static_news_fallback.py
      - name: Commit publication artifacts
        run: |
          git config user.name 'daily-brief-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add data/2026-09-13.json data/latest.json data/archive.json data/live.json data/desk-latest.json data/topic-more/2026-09-13.json editions/2026-09-13.html index.html world.html asia.html hong-kong.html japan.html finance.html technology.html manga-anime.html manchester-united.html football.html archive.html || true
          if git diff --cached --quiet; then
            echo 'No publication changes to commit'
          else
            git commit -m 'Publish 2026-09-13 Daily Edition 024'
            git push origin main
          fi