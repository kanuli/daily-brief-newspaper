name: Publish 2026-09-13 Daily Once
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_20260913.py'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Daily Edition 024
        run: python scripts/publish_20260913.py
      - name: Validate Daily v3
        run: |
          if ! python scripts/validate_daily_v3.py > /tmp/daily-v3.log 2>&1; then
            cp /tmp/daily-v3.log daily-v3-validation-debug.txt
            git config user.name 'daily-brief-publisher'
            git config user.email 'actions@users.noreply.github.com'
            git add daily-v3-validation-debug.txt
            git commit -m 'chore: capture 2026-09-13 Daily validation failure'
            git push origin main
            cat /tmp/daily-v3.log
            exit 1
          fi
          cat /tmp/daily-v3.log
      - name: Validate editorial routing and site data
        run: |
          python scripts/validate_editorial_v2.py
          python scripts/validate_site_data.py
      - name: Validate Stock News oversight
        run: python scripts/validate_stock_news.py
      - name: Build static fallback
        run: python scripts/build_static_news_fallback.py
      - name: Commit publication artifacts
        run: |
          git config user.name 'daily-brief-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add data/2026-09-13.json data/latest.json data/archive.json data/live.json data/desk-latest.json data/topic-more/2026-09-13.json editions/2026-09-13.html index.html world.html asia.html hong-kong.html japan.html finance.html technology.html manga-anime.html manchester-united.html football.html archive.html || true
          if git diff --cached --quiet; then
            echo 'No publication changes to commit'
          else
            git commit -m 'Publish 2026-09-13 Daily Edition 024'
            git push origin main
          fi