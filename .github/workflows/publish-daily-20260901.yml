name: Publish 2026-09-01 Daily Edition

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-daily-20260901.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-publish-20260901"
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover fresh Hong Kong depth
        run: python scripts/inject_hk_recovery_20260901.py
      - name: Build Daily Edition
        run: python scripts/publish_daily_20260901.py
      - name: Validate Site Schema
        run: python scripts/validate_site_data.py
      - name: Validate Daily v3
        run: python scripts/validate_daily_v3.py
      - name: Validate Editorial Depth
        run: python scripts/validate_editorial_v2.py
      - name: Validate Stock News
        run: python scripts/validate_stock_news.py
      - name: Commit publication artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/2026-09-01.json data/archive.json data/topic-more/2026-09-01.json data/desk-latest.json data/live.json editions/2026-09-01.html
          git commit -m "Publish 2026-09-01 Daily Edition" || true
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
