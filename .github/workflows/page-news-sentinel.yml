name: Page News Sentinel

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "scripts/page_news_sentinel.py"
      - "scripts/run_page_news_sentinel.py"
      - "scripts/desk_freshness_policy.py"
      - "data/latest.json"
      - "data/live.json"
      - "data/desk-latest.json"
      - "data/stocks-latest.json"
      - ".github/workflows/page-news-sentinel.yml"
  schedule:
    # Availability is already checked every 10 minutes by pages-probe.
    # This pass reports editorial/public freshness to the Editor-in-Chief.
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: "page-news-sentinel"
  cancel-in-progress: true

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous sentinel state
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/previous-page-news-sentinel.json
          git fetch -q --depth=1 origin page-sentinel-status || true
          git show FETCH_HEAD:data/page-news-sentinel-status.json > /tmp/previous-page-news-sentinel.json 2>/dev/null || true

      - name: Run sentinel unit tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/test_page_news_sentinel.py

      - name: Audit every public news page
        id: audit
        shell: bash
        run: |
          set +e
          args=(
            --public-base "https://kanuli.github.io/daily-brief-newspaper/"
            --output /tmp/page-news-sentinel-status.json
          )
          [ -s /tmp/previous-page-news-sentinel.json ] && args+=(--previous-status /tmp/previous-page-news-sentinel.json)
          python scripts/run_page_news_sentinel.py "${args[@]}"
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish sentinel status snapshot
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/page-news-sentinel-status.json
          rm -rf /tmp/page-sentinel-status
          mkdir -p /tmp/page-sentinel-status/data
          cp /tmp/page-news-sentinel-status.json /tmp/page-sentinel-status/data/page-news-sentinel-status.json
          cd /tmp/page-sentinel-status
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b page-sentinel-status
          git add data/page-news-sentinel-status.json
          git commit -q -m "Update page news sentinel status"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin page-sentinel-status

      - name: Assign page findings to Editor-in-Chief
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          needs_editor=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/page-news-sentinel-status.json',encoding='utf-8'))
          print('true' if d.get('failedPageCount',0) or d.get('repairWorkflows') else 'false')
          PY
          )

          if [ "$needs_editor" != "true" ]; then
            echo 'EDITOR_IN_CHIEF_ASSIGNMENT_NOT_REQUIRED'
            exit 0
          fi

          wf='editor-in-chief-newsroom-assignment.yml'
          active=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          if [ "${active:-0}" -gt 0 ]; then
            result='already-active'
            echo 'EDITOR_IN_CHIEF_ASSIGNMENT_ALREADY_ACTIVE'
          elif gh workflow run "$wf" --repo "${GITHUB_REPOSITORY}" --ref main; then
            result='assigned'
            echo 'EDITOR_IN_CHIEF_ASSIGNMENT_DISPATCHED'
          else
            result='dispatch-failed'
            echo 'EDITOR_IN_CHIEF_ASSIGNMENT_DISPATCH_FAILED' >&2
          fi

          python - "$result" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path('/tmp/page-news-sentinel-status.json')
          d=json.loads(path.read_text(encoding='utf-8'))
          d['editorInChiefAssignment']={
              'workflow':'editor-in-chief-newsroom-assignment.yml',
              'result':sys.argv[1],
              'requestedRepairs':d.get('repairWorkflows') or [],
          }
          if sys.argv[1] == 'dispatch-failed':
              d['status']='EDITORIAL_ATTENTION_REQUIRED'
              d['escalationRequired']=True
          path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          if [ "$result" = "dispatch-failed" ]; then
            exit 1
          fi

      - name: Republish sentinel state with assignment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/page-news-sentinel-status.json
          rm -rf /tmp/page-sentinel-status
          mkdir -p /tmp/page-sentinel-status/data
          cp /tmp/page-news-sentinel-status.json /tmp/page-sentinel-status/data/page-news-sentinel-status.json
          cd /tmp/page-sentinel-status
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b page-sentinel-status
          git add data/page-news-sentinel-status.json
          git commit -q -m "Update page news sentinel assignment status"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin page-sentinel-status

      - name: Escalate persistent page-news failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          escalate=$(python - <<'PY'
          import json
          from pathlib import Path
          current=json.load(open('/tmp/page-news-sentinel-status.json',encoding='utf-8'))
          previous={}
          previous_path=Path('/tmp/previous-page-news-sentinel.json')
          if previous_path.is_file():
              try:
                  previous=json.loads(previous_path.read_text(encoding='utf-8'))
              except Exception:
                  previous={}
          transitioned=(
              current.get('status') == 'EDITORIAL_ATTENTION_REQUIRED'
              and previous.get('status') != 'EDITORIAL_ATTENTION_REQUIRED'
          )
          print('true' if current.get('escalationRequired') or transitioned else 'false')
          PY
          )
          [ "$escalate" = "true" ] || exit 0

          title="[Page News Sentinel] Persistent public-news freshness failure"
          body=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/page-news-sentinel-status.json',encoding='utf-8'))
          print('Automated Editor-in-Chief escalation. A public page/news failure survived the repair cycle, or the sentinel itself could not collect authoritative evidence.\n')
          print(f"Checked: {d.get('checkedAtHKT')}\n")
          for row in d.get('pageResults') or []:
              if not row.get('ok'):
                  print(f"- `{row.get('page')}`: {'; '.join(row.get('reasons') or [])}")
          print('\nPage Sentinel does not dispatch repair Robots directly. It assigns findings to the Editor-in-Chief, which owns Robot selection and deduplication. No news or timestamps are fabricated.')
          PY
          )
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Existing Page News Sentinel escalation issue #${existing}; not duplicating or spamming comments."
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "$title" --body "$body"
          fi

      - name: Final sentinel verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=$(python -c 'import json; print(json.load(open("/tmp/page-news-sentinel-status.json",encoding="utf-8")).get("status","UNKNOWN"))')
          echo "PAGE_NEWS_SENTINEL_STATUS=${status}"
          if [ "$status" = "EDITORIAL_ATTENTION_REQUIRED" ]; then
            exit 1
          fi
