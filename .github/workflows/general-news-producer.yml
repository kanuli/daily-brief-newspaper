name: General News Verified Producer

on:
  workflow_dispatch:
    inputs:
      editorial_trial_contract:
        description: "Immutable reviewed Site EIC trial contract (not a force override)"
        required: false
        type: string
      editorial_trial_dispatcher_run:
        description: "Owning Site EIC dispatcher run; claim and child binding are mandatory"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: "general-news-verified-producer"
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      code_sha: ${{ steps.snapshot.outputs.code_sha }}
      active: ${{ steps.trial_guard.outputs.active }}
      pending: ${{ steps.pending.outputs.pending }}
      stale_count: ${{ steps.prepare.outputs.stale_count }}
      candidate_count: ${{ steps.prepare.outputs.candidate_count }}
      stale_desks: ${{ steps.prepare.outputs.stale_desks }}
    steps:
      - name: Checkout current newsroom code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind one immutable Site EIC editorial trial before source or model work
        id: trial_guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_CONTRACT: ${{ inputs.editorial_trial_contract }}
          TRIAL_DISPATCHER: ${{ inputs.editorial_trial_dispatcher_run }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/editorial_revision_trial.py bind --root . \
            --contract "$TRIAL_CONTRACT" --dispatcher "$TRIAL_DISPATCHER" \
            --state /tmp/eic-editorial-trial-state.json --github-output "$GITHUB_OUTPUT"
          if [ -s /tmp/eic-editorial-trial-state.json ]; then
            # Preserve the exact reviewed validator code before the later
            # prepublish-branch checkout replaces the main working tree.
            mkdir -p /tmp/eic-editorial-reviewed/scripts
            cp scripts/editorial_revision_trial.py scripts/probe_general_news_fallback_capability.py \
              scripts/general_news_local_fallback.py scripts/general_news_verified_producer.py \
              scripts/general_news_verification_robot.py scripts/parallel_general_news_fallback.py /tmp/eic-editorial-reviewed/scripts/
          fi

      - name: Load the latest discovery reservoir
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin news-staging:refs/remotes/origin/news-staging
          git show origin/news-staging:data/search-staging.json > /tmp/search-staging.json

      - name: Reuse any pending verified draft before producing another
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin prepublish-news:refs/remotes/origin/prepublish-news || true
          git show origin/prepublish-news:data/prepublish.json > /tmp/current-prepublish.json 2>/dev/null || echo '{}' > /tmp/current-prepublish.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone

          try:
              data=json.load(open('/tmp/current-prepublish.json',encoding='utf-8'))
          except Exception:
              data={}
          try:
              live=json.load(open('data/live.json',encoding='utf-8'))
          except Exception:
              live={}
          created=str(data.get('createdAt') or '')
          age=999999.0
          if created:
              try:
                  dt=datetime.fromisoformat(created.replace('Z','+00:00')).astimezone(timezone.utc)
                  age=max(0.0,(datetime.now(timezone.utc)-dt).total_seconds()/60.0)
              except Exception:
                  pass
          draft_id=str(data.get('draftId') or '')
          published_draft_id=str(((live.get('coverage') or {}).get('verifiedDraftId') or ''))
          already_published=bool(draft_id and published_draft_id == draft_id)
          pending=(
              data.get('status') == 'VERIFIED_DRAFT'
              and data.get('publicationType') == 'LIVE'
              and bool(data.get('articles'))
              and age <= 120
              and not already_published
          )
          print('pending=' + ('true' if pending else 'false'))
          print('pending_draft=' + draft_id)
          print('pending_age_minutes=' + f'{age:.1f}')
          print('already_published=' + ('true' if already_published else 'false'))
          print('published_draft=' + published_draft_id)
          PY

      - name: Prepare bounded source-verification work
        if: steps.pending.outputs.pending != 'true'
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/general_news_verified_producer.py scripts/general_news_verification_robot.py
          python scripts/general_news_verification_robot.py prepare /tmp/search-staging.json --output /tmp/general-news-verification-request.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('/tmp/general-news-verification-request.json',encoding='utf-8'))
          print('stale_count=' + str(len(data.get('staleDesks') or [])))
          print('candidate_count=' + str(int(data.get('candidateCount') or 0)))
          print('stale_desks=' + ','.join(data.get('staleDesks') or []))
          PY


      - name: Freeze the single child source snapshot and shared deadline
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eic-parallel
          cp /tmp/search-staging.json /tmp/eic-parallel/staging.json
          if [ -s /tmp/general-news-verification-request.json ]; then
            cp /tmp/general-news-verification-request.json /tmp/eic-parallel/request.json
          else
            echo '{"staleDesks":[],"candidates":[],"candidateCount":0}' > /tmp/eic-parallel/request.json
          fi
          if [ -s /tmp/eic-editorial-trial-state.json ]; then
            cp /tmp/eic-editorial-trial-state.json /tmp/eic-parallel/state.json
          fi
          python scripts/parallel_general_news_fallback.py plan --directory /tmp/eic-parallel \
            --active '${{ steps.trial_guard.outputs.active }}' \
            --deadline-unix '${{ steps.trial_guard.outputs.fallback_deadline_unix }}'
          echo "code_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preserve this run's fixed source plan, never a news publication
        uses: actions/upload-artifact@v4
        with:
          name: gemma-source-plan
          path: /tmp/eic-parallel/*.json
          if-no-files-found: error
          retention-days: 1

  workers:
    needs: prepare
    if: needs.prepare.outputs.pending != 'true' && needs.prepare.outputs.candidate_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        worker: [0, 1, 2]
    steps:
      - name: Checkout the exact prepared reviewed code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.code_sha }}
          persist-credentials: false

      - name: Restore this run's exact source plan
        uses: actions/download-artifact@v4
        with:
          name: gemma-source-plan
          path: /tmp/eic-parallel

      - name: Read-only authorize immutable child, code, partition and deadline
        id: authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/parallel_general_news_fallback.py authorize --directory /tmp/eic-parallel \
            --active '${{ needs.prepare.outputs.active }}' --github-output "$GITHUB_OUTPUT"

      - name: Cache open-source local fallback model
        # Only the reviewed Google model is allowed. No Qwen restore or fallback.
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-google-gemma3-4b-qat-b0313423c944-v1

      - name: Run open-source local capacity fallback
        id: local_fallback
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -r scripts/requirements-general-news-fallback.txt
          python scripts/check_general_news_fallback_dependencies.py
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts its own service on 11434. Do not accidentally
          # query that daemon while our failed startup hides its runtime logs.
          export OLLAMA_HOST=127.0.0.1:11435
          export OLLAMA_MODELS="$HOME/.ollama/models"
          if curl -fsS http://127.0.0.1:11435/api/version >/dev/null 2>&1; then
            echo "LOCAL_MODEL_OWNED_PORT_ALREADY_OCCUPIED" >&2
            exit 1
          fi
          env -i PATH="$PATH" HOME="$HOME" OLLAMA_HOST="$OLLAMA_HOST" \
            OLLAMA_MODELS="$OLLAMA_MODELS" OLLAMA_NUM_PARALLEL=1 \
            OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_CONTEXT_LENGTH=32768 \
            ollama serve >/tmp/ollama.log 2>&1 &
          owned_pid=$!
          trap 'kill "$owned_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if ! kill -0 "$owned_pid" 2>/dev/null; then
              break
            fi
            if curl -fsS http://127.0.0.1:11435/api/tags >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/ollama.log >&2 || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          python - <<'PY'
          import shutil
          from pathlib import Path
          available_kib = next(int(line.split()[1]) for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:'))
          free_bytes = shutil.disk_usage('.').free
          print(f'LOCAL_MODEL_RESOURCES availableMemoryMiB={available_kib // 1024} freeDiskGiB={free_bytes // (1024 ** 3)}')
          if available_kib < 10 * 1024 * 1024 or free_bytes < 8 * 1024 ** 3:
              raise SystemExit('LOCAL_MODEL_RESOURCES_INSUFFICIENT')
          PY
          ollama pull gemma3:4b-it-qat
          python - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('http://127.0.0.1:11435/api/tags', timeout=5) as response:
              models = json.load(response).get('models', [])
          matching = [row for row in models if isinstance(row, dict) and row.get('name') == 'gemma3:4b-it-qat']
          expected = 'b0313423c9448adfab711aacbc9d0b885a390eb31f1145d7f8495d1e6f84f257'
          if len(matching) != 1 or matching[0].get('digest') != expected:
              raise SystemExit('LOCAL_MODEL_IDENTITY_NOT_REVIEWED')
          print('LOCAL_MODEL_IDENTITY_VERIFIED developer=Google-DeepMind model=gemma3:4b-it-qat digest=' + expected)
          PY
          python scripts/owned_general_news_runtime.py \
            --deadline-unix '${{ steps.authorization.outputs.deadline_unix }}'
          fallback_seconds=$(python -c 'import math, sys, time; deadline=float(sys.argv[1]); remaining=min(600, math.floor(deadline-time.time())); assert math.isfinite(deadline) and remaining > 0; print(remaining)' '${{ steps.authorization.outputs.deadline_unix }}')
          set +e
          timeout --signal=KILL "${fallback_seconds}s" \
            python -u scripts/parallel_general_news_fallback.py worker \
            --directory /tmp/eic-parallel --worker '${{ matrix.worker }}'
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "GENERAL_NEWS_LOCAL_CAPACITY_FALLBACK_OK model=gemma3:4b-it-qat"
            exit 0
          fi
          cat /tmp/ollama.log >&2 || true
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit "$rc"


      - name: Preserve only this run's bounded worker fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-worker-${{ matrix.worker }}
          path: /tmp/eic-parallel/fragment.json
          if-no-files-found: ignore
          retention-days: 1

  produce:
    needs: [prepare, workers]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout the exact prepared reviewed code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.code_sha }}
          fetch-depth: 0

      - name: Restore this run's exact source plan
        uses: actions/download-artifact@v4
        with:
          name: gemma-source-plan
          path: /tmp/eic-parallel

      - name: Restore immutable authority and preserve reviewed finalizer
        id: trial_guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/parallel_general_news_fallback.py restore --directory /tmp/eic-parallel \
            --active '${{ needs.prepare.outputs.active }}' --github-output "$GITHUB_OUTPUT"
          cp /tmp/eic-parallel/staging.json /tmp/search-staging.json
          cp /tmp/eic-parallel/request.json /tmp/general-news-verification-request.json
          mkdir -p verification-work /tmp/eic-editorial-reviewed/scripts
          cp scripts/editorial_revision_trial.py scripts/probe_general_news_fallback_capability.py \
            scripts/general_news_local_fallback.py scripts/general_news_verified_producer.py \
            scripts/general_news_verification_robot.py scripts/parallel_general_news_fallback.py \
            scripts/owned_general_news_runtime.py \
            /tmp/eic-editorial-reviewed/scripts/
          mkdir -p /tmp/eic-editorial-reviewed/.github/workflows
          cp .github/workflows/general-news-producer.yml /tmp/eic-editorial-reviewed/.github/workflows/
          if [ -s /tmp/eic-parallel/state.json ]; then
            cp /tmp/eic-parallel/state.json /tmp/eic-editorial-trial-state.json
          fi

      - name: Download only this workflow run's worker fragments
        if: needs.prepare.outputs.pending != 'true' && needs.prepare.outputs.candidate_count != '0'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: gemma-worker-*
          path: /tmp/eic-fragments
          merge-multiple: false

      - name: Validate bounded fragments before unchanged canonical merge
        id: local_fallback
        if: needs.prepare.outputs.pending != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/parallel_general_news_fallback.py collect --directory /tmp/eic-parallel \
            --fragments /tmp/eic-fragments --github-output "$GITHUB_OUTPUT"
          cp /tmp/eic-parallel/facts.raw verification-work/facts.raw
          cp /tmp/eic-parallel/copy.raw verification-work/copy.raw

      - name: Record producer capacity outcome
        id: capacity
        if: always() && steps.trial_guard.outcome == 'success' && steps.trial_guard.outputs.active != 'true' && needs.prepare.outputs.pending != 'true' && needs.prepare.outputs.candidate_count != '0'
        env:
          VERIFY_OK: ${{ 'false' }}
          VERIFY_CAPACITY: ${{ 'false' }}
          COPY_OK: ${{ 'false' }}
          COPY_CAPACITY: ${{ 'false' }}
          LOCAL_FALLBACK_OK: ${{ steps.local_fallback.outputs.ok }}
          LOCAL_FALLBACK_OUTCOME: success
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          verify_ok=os.environ.get("VERIFY_OK") == "true"
          copy_ok=os.environ.get("COPY_OK") == "true"
          local_fallback_ok=os.environ.get("LOCAL_FALLBACK_OK") == "true"
          local_fallback_outcome=os.environ.get("LOCAL_FALLBACK_OUTCOME") or ""
          capacity=True  # This reviewed producer uses only the Google-local path.
          now=datetime.now(timezone.utc)
          if capacity and local_fallback_ok:
              status="DEGRADED_LOCAL_FALLBACK"
              reason="Reviewed Google-local producer succeeded; canonical publication gates remain mandatory"
              blocked_until=None
          elif capacity and local_fallback_outcome in {"failure", "success"}:
              status="LOCAL_FALLBACK_FAILED"
              reason="Reviewed Google-local workers produced no publishable verified output"
              blocked_until=None
          elif capacity:
              status="QUOTA_EXHAUSTED"
              reason="Reviewed Google-local path unavailable before a verified worker outcome"
              blocked_until=now + timedelta(hours=6)
          elif verify_ok and copy_ok:
              status="AVAILABLE"
              reason="GitHub Copilot verification and copy path succeeded"
              blocked_until=None
          else:
              status="ERROR"
              reason="General Producer failed for a non-capacity reason"
              blocked_until=None

          data={
              "schemaVersion": 1,
              "producer": "General News Verified Producer",
              "checkedAt": now.isoformat().replace("+00:00","Z"),
              "status": status,
              "reason": reason,
              "blockedUntil": blocked_until.isoformat().replace("+00:00","Z") if blocked_until else None,
              "recoveryOwner": (
                  "workflow:general-news-producer.yml"
                  if local_fallback_ok
                  else (
                      "automation:Newsroom Publisher"
                      if status in {"LOCAL_FALLBACK_FAILED", "QUOTA_EXHAUSTED"}
                      else None
                  )
              ),
              "localFallbackModel": "gemma3:4b-it-qat" if (local_fallback_ok or status == "LOCAL_FALLBACK_FAILED") else None,
              "workflowRunId": os.environ.get("GITHUB_RUN_ID"),
          }
          Path("/tmp/producer-capacity.json").write_text(
              json.dumps(data,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          print("blocked=" + ("true" if status == "QUOTA_EXHAUSTED" else "false"))
          print("status=" + status)
          PY
          cat /tmp/producer-capacity.json

      - name: Persist producer capacity telemetry
        if: always() && steps.trial_guard.outcome == 'success' && steps.trial_guard.outputs.active != 'true' && needs.prepare.outputs.pending != 'true' && needs.prepare.outputs.candidate_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/producer-capacity.json
          encoded=$(base64 -w0 /tmp/producer-capacity.json)
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/producer-capacity.json?ref=prepublish-news" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/data/producer-capacity.json"
            -f message="Update General Producer capacity status"
            -f content="$encoded"
            -f branch="prepublish-news")
          if [ -n "$current_sha" ]; then
            args+=(-f sha="$current_sha")
          fi
          gh api "${args[@]}" >/dev/null
          echo "GENERAL_NEWS_PRODUCER_CAPACITY_TELEMETRY_PERSISTED status=${{ steps.capacity.outputs.status }}"

      - name: Merge only schema-valid evidence and copy
        if: needs.prepare.outputs.pending != 'true' && (needs.prepare.outputs.candidate_count == '0' || ('false' == 'true' && 'false' == 'true') || steps.local_fallback.outputs.ok == 'true')
        shell: bash
        run: |
          set -euo pipefail
          candidates='${{ needs.prepare.outputs.candidate_count }}'
          if [ "${candidates:-0}" -gt 0 ]; then
            set +e
            python scripts/general_news_verification_robot.py merge /tmp/search-staging.json \
              --request /tmp/general-news-verification-request.json \
              --facts verification-work/facts.raw \
              --copies verification-work/copy.raw \
              --output /tmp/enriched-search-staging.json \
              --report /tmp/general-news-verification-report.json
            merge_rc=$?
            set -e
            if [ "$merge_rc" -ne 0 ]; then
              echo '{"requestedCandidates":0,"factVerifiedCandidates":0,"copyVerifiedCandidates":0,"mergedCandidateIds":[],"mergeError":true}' > /tmp/general-news-verification-report.json
              cp /tmp/search-staging.json /tmp/enriched-search-staging.json
            fi
          else
            echo '{"requestedCandidates":0,"factVerifiedCandidates":0,"copyVerifiedCandidates":0,"mergedCandidateIds":[]}' > /tmp/general-news-verification-report.json
            cp /tmp/search-staging.json /tmp/enriched-search-staging.json
          fi
          cat /tmp/general-news-verification-report.json

      - name: Produce outcome using Editor-in-Chief freshness targets
        if: needs.prepare.outputs.pending != 'true' && (needs.prepare.outputs.candidate_count == '0' || ('false' == 'true' && 'false' == 'true') || steps.local_fallback.outputs.ok == 'true')
        id: producer
        shell: bash
        run: |
          set -euo pipefail
          python scripts/general_news_verification_robot.py produce /tmp/enriched-search-staging.json --output /tmp/general-news-prepublish.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('/tmp/general-news-prepublish.json',encoding='utf-8'))
          articles=data.get('articles') or []
          stale=(data.get('coverage') or {}).get('staleDesks') or []
          publishable=data.get('status') == 'VERIFIED_DRAFT' and bool(articles)
          unresolved=bool(stale) and not publishable
          print('publishable=' + ('true' if publishable else 'false'))
          print('unresolved=' + ('true' if unresolved else 'false'))
          print('draft_id=' + str(data.get('draftId') or ''))
          print('article_count=' + str(len(articles)))
          print('stale_count=' + str(len(stale)))
          print('stale_desks=' + ','.join(stale))
          PY

      - name: Persist the verified draft on the isolated prepublish branch
        if: needs.prepare.outputs.pending != 'true' && steps.producer.outputs.publishable == 'true'
        env:
          VERIFY_OK: ${{ 'false' }}
          COPY_OK: ${{ 'false' }}
          LOCAL_FALLBACK_OK: ${{ steps.local_fallback.outputs.ok }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.trial_guard.outputs.active }}' = 'true' ]; then
            GH_TOKEN='${{ github.token }}' python scripts/editorial_revision_trial.py stamp-draft --root . \
              --state /tmp/eic-editorial-trial-state.json --draft /tmp/general-news-prepublish.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin prepublish-news
          git checkout -B prepublish-news origin/prepublish-news
          cp /tmp/general-news-prepublish.json data/prepublish.json
          git add -- data/prepublish.json
          if git diff --cached --quiet; then
            echo "GENERAL_NEWS_PREPUBLISH_NOOP draft already persisted"
            exit 0
          fi
          git commit -m "Prepare verified general-news draft"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:prepublish-news; then
              echo "GENERAL_NEWS_PREPUBLISH_PASS"
              exit 0
            fi
            git fetch origin prepublish-news
            git rebase origin/prepublish-news
            sleep $((attempt * 2))
          done
          echo "Could not persist general-news draft" >&2
          exit 1

      - name: Report degraded local fallback
        if: steps.capacity.outputs.status == 'DEGRADED_LOCAL_FALLBACK'
        run: echo "GENERAL_NEWS_PRODUCER_DEGRADED localFallback=gemma3:4b-it-qat"

      - name: Finalize reviewed trial from exact persisted draft or preserve failed capacity
        if: always() && steps.trial_guard.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OK: ${{ 'false' }}
          COPY_OK: ${{ 'false' }}
          LOCAL_FALLBACK_OK: ${{ steps.local_fallback.outputs.ok }}
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/eic-editorial-reviewed/scripts/editorial_revision_trial.py finish --root /tmp/eic-editorial-reviewed \
            --state /tmp/eic-editorial-trial-state.json --draft /tmp/general-news-prepublish.json

      - name: Report producer capacity failover
        if: steps.capacity.outputs.blocked == 'true'
        run: echo "GENERAL_NEWS_PRODUCER_CAPACITY_EXHAUSTED localFallbackUnavailable=true recoveryOwner=automation:Newsroom Publisher"

      - name: Fail when Copilot and local fallback are both unavailable
        if: steps.capacity.outputs.blocked == 'true' && steps.local_fallback.outputs.ok != 'true'
        shell: bash
        run: |
          echo "GENERAL_NEWS_PRODUCER_ALL_CONTENT_ENGINES_UNAVAILABLE" >&2
          exit 1

      - name: Fail non-capacity verification/copy errors
        if: always() && needs.prepare.outputs.pending != 'true' && needs.prepare.outputs.candidate_count != '0' && steps.capacity.outputs.blocked != 'true' && steps.local_fallback.outputs.ok != 'true' && ('false' != 'true' || 'false' != 'true')
        shell: bash
        run: |
          echo "GENERAL_NEWS_PRODUCER_ERROR verification/copy failed for a non-capacity reason" >&2
          exit 1

      - name: Report healthy no-op
        if: needs.prepare.outputs.pending != 'true' && needs.prepare.outputs.stale_count == '0'
        run: echo "GENERAL_NEWS_HEALTHY_NOOP no desk exceeds Editor-in-Chief freshness target"

      - name: Fail loudly while stale desks still have no verified publishable update
        if: needs.prepare.outputs.pending != 'true' && steps.producer.outputs.unresolved == 'true'
        shell: bash
        run: |
          echo "GENERAL_NEWS_UNRESOLVED stale desks remain after discovery + source verification: ${{ steps.producer.outputs.stale_desks }}" >&2
          exit 1
