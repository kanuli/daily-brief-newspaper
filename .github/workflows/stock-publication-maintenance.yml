name: Stock News Hourly Maintenance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/stock-publication-maintenance.yml"
      - "scripts/promote_verified_stock_draft.py"
      - "scripts/stock_news_heartbeat.py"
      - "scripts/stock_verified_producer.py"
      - "scripts/stock_news_rules.py"
      - "scripts/clean_stock_boilerplate.py"
      - "scripts/validate_stock_news.py"
      - "scripts/rolling_news_collector.py"
      - "data/stock-verified-seeds.json"
  schedule:
    # HKT 06:00-24:00, five minutes after each hour; skip 08:00 HKT because Daily Edition owns that slot. GitHub cron is UTC.
    - cron: "5 22,23 * * *"
    - cron: "5 1-16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "stock-news-hourly-maintenance"
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read manual verified draft and latest rolling discovery
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin prepublish-news:refs/remotes/origin/prepublish-news || true
          git fetch -q origin news-staging:refs/remotes/origin/news-staging || true

          if git show origin/prepublish-news:data/prepublish.json > /tmp/prepublish.json 2>/dev/null; then
            echo "draft_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "draft_available=false" >> "$GITHUB_OUTPUT"
          fi

          if git show origin/news-staging:data/search-staging.json > /tmp/search-staging.json 2>/dev/null; then
            echo "staging_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "staging_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce 15-symbol rolling collector contract and refresh Stock discovery
        if: steps.inputs.outputs.staging_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          required = ["GOOG", "GLDM", "ICE", "MCD", "EMXC", "GBTC", "DBA", "AAPL", "EWY", "META", "MSFT", "NVDA", "TSM", "PLTR", "VT"]
          path = Path('scripts/rolling_news_collector.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text, str(path))

          query_plan = None
          stock_terms = None
          for node in tree.body:
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  value = node.value
                  for target in targets:
                      if isinstance(target, ast.Name) and target.id == 'QUERY_PLAN':
                          query_plan = ast.literal_eval(value)
                      if isinstance(target, ast.Name) and target.id == 'STOCK_TERMS':
                          stock_terms = ast.literal_eval(value)

          if not isinstance(query_plan, dict) or not isinstance(query_plan.get('stock-news'), list):
              raise SystemExit('Stock collector QUERY_PLAN[stock-news] is missing')
          queries = query_plan['stock-news']
          if len(queries) != len(required):
              raise SystemExit(f'Stock collector query count mismatch: expected {len(required)}, got {len(queries)}')
          for symbol, query in zip(required, queries):
              if symbol.lower() not in str(query).lower():
                  raise SystemExit(f'Stock collector query order/coverage mismatch at {symbol}: {query!r}')

          if not isinstance(stock_terms, (tuple, list)):
              raise SystemExit('Stock collector STOCK_TERMS is missing')
          joined_terms = ' '.join(str(term).lower() for term in stock_terms)
          missing_terms = [symbol for symbol in required if symbol.lower() not in joined_terms]
          if missing_terms:
              raise SystemExit(f'Stock collector relevance terms missing tracked symbols: {missing_terms}')

          compile(text, str(path), 'exec')
          print('STOCK_COLLECTOR_15_SYMBOL_CONTRACT_PASS', ','.join(required))
          PY

          python scripts/rolling_news_collector.py \
            --existing /tmp/search-staging.json \
            --output /tmp/search-staging-current.json
          mv /tmp/search-staging-current.json /tmp/search-staging.json

      - name: Record truthful hourly Stock News check
        if: steps.inputs.outputs.staging_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stock_news_heartbeat.py /tmp/search-staging.json --min-interval-minutes 45

      - name: Build primary-source verified Stock draft
        if: steps.inputs.outputs.staging_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stock_verified_producer.py /tmp/search-staging.json --output /tmp/stock-prepublish.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/stock-prepublish.json',encoding='utf-8'))
          print('PRIMARY_SOURCE_STOCK_DRAFT', d.get('draftId'), 'articles', len(d.get('articles') or []), 'errors', len(d.get('errors') or []))
          PY

      - name: Promote primary-source verified tracked-stock material
        if: steps.inputs.outputs.staging_available == 'true'
        shell: bash
        run: |
          set -uo pipefail
          if python scripts/promote_verified_stock_draft.py /tmp/stock-prepublish.json; then
            echo "PRIMARY_STOCK_PROMOTION_ACCEPTED"
          else
            echo "PRIMARY_STOCK_PROMOTION_REJECTED retaining current verified text artifact"
          fi

      - name: Promote newer manual verified tracked-stock material when available
        if: steps.inputs.outputs.draft_available == 'true'
        shell: bash
        run: |
          set -uo pipefail
          if python scripts/promote_verified_stock_draft.py /tmp/prepublish.json; then
            echo "MANUAL_STOCK_PROMOTION_ACCEPTED"
          else
            echo "MANUAL_STOCK_PROMOTION_REJECTED retaining current verified text artifact"
          fi

      - name: Remove repeated verification boilerplate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/clean_stock_boilerplate.py

      - name: Validate Stock News contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_stock_news.py
          python scripts/audit_tts_language.py

      - name: Publish check state or verified content change
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path('data/stocks-latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc)
          hkt = now.astimezone(ZoneInfo('Asia/Hong_Kong'))
          data['generatedAt'] = now.isoformat()
          data['lastUpdatedLabel'] = f"{hkt.year}年{hkt.month}月{hkt.day}日 {hkt:%H:%M} HKT"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('STOCK_COMPLETION_STAMP', data['generatedAt'], data['lastUpdatedLabel'])
          PY

          python scripts/validate_stock_news.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/stocks-latest.json scripts/rolling_news_collector.py

          if git diff --cached --quiet; then
            echo "STOCK_HOURLY_NOOP no newer check state or verified story"
            exit 0
          fi

          git commit -m "Refresh Stock News verified content and check state"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "STOCK_HOURLY_MAINTENANCE_PASS"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done

          echo "Stock News hourly maintenance could not push after retries" >&2
          exit 1

      - name: Dispatch Pages after Stock publication
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main"}'
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d "$payload"
          echo "STOCK_PAGES_DEPLOY_DISPATCHED"
