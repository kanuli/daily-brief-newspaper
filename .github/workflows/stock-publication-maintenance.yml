name: Stock News Hourly Maintenance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/stock-publication-maintenance.yml"
      - "scripts/promote_verified_stock_draft.py"
      - "scripts/stock_news_heartbeat.py"
      - "scripts/stock_verified_producer.py"
      - "scripts/stock_news_rules.py"
      - "scripts/clean_stock_boilerplate.py"
      - "scripts/validate_stock_news.py"
      - "scripts/rolling_news_collector.py"
      - "data/stock-verified-seeds.json"
  schedule:
    # HKT 06:00-24:00, five minutes after each hour; skip 08:00 HKT because Daily Edition owns that slot. GitHub cron is UTC.
    - cron: "5 22,23 * * *"
    - cron: "5 1-16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "stock-news-hourly-maintenance"
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read manual verified draft and latest rolling discovery
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin prepublish-news:refs/remotes/origin/prepublish-news || true
          git fetch -q origin news-staging:refs/remotes/origin/news-staging || true

          if git show origin/prepublish-news:data/prepublish.json > /tmp/prepublish.json 2>/dev/null; then
            echo "draft_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "draft_available=false" >> "$GITHUB_OUTPUT"
          fi

          if git show origin/news-staging:data/search-staging.json > /tmp/search-staging.json 2>/dev/null; then
            echo "staging_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "staging_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce 15-symbol rolling collector contract and refresh Stock discovery
        if: steps.inputs.outputs.staging_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/rolling_news_collector.py')
          text = path.read_text(encoding='utf-8')

          queries = '''    "stock-news": [
              '(GOOG OR Google OR Alphabet) earnings guidance product analyst SEC filing partnership regulation when:12h',
              '(GLDM OR "SPDR Gold MiniShares" OR gold price rates dollar) when:12h',
              '(ICE OR "Intercontinental Exchange" OR NYSE parent) earnings analyst SEC filing market data when:12h',
              '(MCD OR McDonald) earnings guidance product analyst SEC filing when:12h',
              '(EMXC OR "emerging markets ex China" OR Taiwan Korea India equities flows) when:12h',
              '(GBTC OR "Grayscale Bitcoin Trust" OR bitcoin ETF crypto regulation flows) when:12h',
              '(DBA OR "Invesco DB Agriculture" OR agriculture commodities weather supply demand) when:12h',
              '(AAPL OR Apple) earnings guidance product analyst SEC filing when:12h',
              '(EWY OR "iShares MSCI South Korea" OR KOSPI Samsung "SK Hynix" Korea equities) when:12h',
              '(META OR "Meta Platforms") earnings guidance product AI analyst SEC filing regulation when:12h',
              '(MSFT OR Microsoft) earnings guidance product AI analyst SEC filing partnership when:12h',
              '(NVDA OR Nvidia) earnings guidance product AI analyst SEC filing partnership when:12h',
              '(TSM OR TSMC OR "Taiwan Semiconductor") earnings guidance supply chain analyst SEC when:12h',
              '(PLTR OR Palantir) earnings guidance contract analyst SEC filing when:12h',
              '(VT OR "Vanguard Total World" OR global equities rates dollar oil geopolitics) when:12h',
          ],'''
          text, n1 = re.subn(
              r'    "stock-news": \[\n.*?\n    \],(?=\n    "ai-tech":)',
              queries,
              text,
              count=1,
              flags=re.S,
          )
          if n1 != 1:
              raise SystemExit(f'could not replace Stock query plan safely: replacements={n1}')

          terms = '''STOCK_TERMS = (
              "goog", "google", "alphabet",
              "gldm", "spdr gold minishares", "gold price", "gold rates",
              "intercontinental exchange", "ice stock", "nyse parent",
              "mcd", "mcdonald",
              "emxc", "emerging markets ex china", "taiwan korea india equities",
              "gbtc", "grayscale bitcoin trust", "bitcoin etf", "crypto regulation",
              "invesco db agriculture", "dba etf", "agriculture commodities",
              "aapl", "apple",
              "ewy", "ishares msci south korea", "kospi", "samsung", "sk hynix", "korea equities",
              "meta", "meta platforms",
              "msft", "microsoft",
              "nvda", "nvidia",
              "tsm", "tsmc", "taiwan semiconductor",
              "pltr", "palantir",
              " vt ", "vanguard total world", "global equities",
          )'''
          text, n2 = re.subn(
              r'STOCK_TERMS = \(\n.*?\n\)(?=\n\n\ndef now_utc)',
              terms,
              text,
              count=1,
              flags=re.S,
          )
          if n2 != 1:
              raise SystemExit(f'could not replace Stock relevance terms safely: replacements={n2}')

          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')
          print('STOCK_COLLECTOR_15_SYMBOL_CONTRACT_PASS')
          PY

          python scripts/rolling_news_collector.py \
            --existing /tmp/search-staging.json \
            --output /tmp/search-staging-current.json
          mv /tmp/search-staging-current.json /tmp/search-staging.json

      - name: Record truthful hourly Stock News check
        if: steps.inputs.outputs.staging_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stock_news_heartbeat.py /tmp/search-staging.json --min-interval-minutes 45

      - name: Build primary-source verified Stock draft
        if: steps.inputs.outputs.staging_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stock_verified_producer.py /tmp/search-staging.json --output /tmp/stock-prepublish.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/stock-prepublish.json',encoding='utf-8'))
          print('PRIMARY_SOURCE_STOCK_DRAFT', d.get('draftId'), 'articles', len(d.get('articles') or []), 'errors', len(d.get('errors') or []))
          PY

      - name: Promote primary-source verified tracked-stock material
        if: steps.inputs.outputs.staging_available == 'true'
        shell: bash
        run: |
          set -uo pipefail
          if python scripts/promote_verified_stock_draft.py /tmp/stock-prepublish.json; then
            echo "PRIMARY_STOCK_PROMOTION_ACCEPTED"
          else
            echo "PRIMARY_STOCK_PROMOTION_REJECTED retaining current verified text artifact"
          fi

      - name: Promote newer manual verified tracked-stock material when available
        if: steps.inputs.outputs.draft_available == 'true'
        shell: bash
        run: |
          set -uo pipefail
          if python scripts/promote_verified_stock_draft.py /tmp/prepublish.json; then
            echo "MANUAL_STOCK_PROMOTION_ACCEPTED"
          else
            echo "MANUAL_STOCK_PROMOTION_REJECTED retaining current verified text artifact"
          fi

      - name: Remove repeated verification boilerplate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/clean_stock_boilerplate.py

      - name: Validate Stock News contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_stock_news.py
          python scripts/audit_tts_language.py

      - name: Publish check state or verified content change
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path('data/stocks-latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc)
          hkt = now.astimezone(ZoneInfo('Asia/Hong_Kong'))
          data['generatedAt'] = now.isoformat()
          data['lastUpdatedLabel'] = f"{hkt.year}年{hkt.month}月{hkt.day}日 {hkt:%H:%M} HKT"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('STOCK_COMPLETION_STAMP', data['generatedAt'], data['lastUpdatedLabel'])
          PY

          python scripts/validate_stock_news.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/stocks-latest.json scripts/rolling_news_collector.py

          if git diff --cached --quiet; then
            echo "STOCK_HOURLY_NOOP no newer check state or verified story"
            exit 0
          fi

          git commit -m "Refresh Stock News verified content and check state"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "STOCK_HOURLY_MAINTENANCE_PASS"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done

          echo "Stock News hourly maintenance could not push after retries" >&2
          exit 1

      - name: Dispatch Pages after Stock publication
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main"}'
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d "$payload"
          echo "STOCK_PAGES_DEPLOY_DISPATCHED"
