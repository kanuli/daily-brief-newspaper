name: GitHub Pages Auto Maintenance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages-maintenance.yml"
      - "assets/js/system-panel.js"
      - "assets/js/site-tts-v10.js"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Deploy Daily Brief to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: "github-pages-auto-maintenance"
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Pages deployment health against public Live, voice manifest and runtime
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS=$(gh run list --repo "${{ github.repository }}" --workflow pages.yml --limit 10 --json status,conclusion,databaseId,headSha,createdAt,updatedAt)
          ACTIVE=$(python -c 'import json,sys; r=json.load(sys.stdin); print(sum(1 for x in r if x.get("status") != "completed"))' <<< "$RUNS")
          if [ "$ACTIVE" -gt 0 ]; then
            echo "restart=false" >> "$GITHUB_OUTPUT"
            echo "reason=pages-active" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_CONCLUSION=$(python -c 'import json,sys; r=json.load(sys.stdin); print((r[0].get("conclusion") if r else "") or "")' <<< "$RUNS")
          if [ -z "$LATEST_CONCLUSION" ] || [ "$LATEST_CONCLUSION" != "success" ]; then
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "reason=pages-${LATEST_CONCLUSION:-missing}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf /tmp/site
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" /tmp/site >/dev/null 2>&1

          SNAPSHOT_OK=$(python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path

          base='https://kanuli.github.io/daily-brief-newspaper/data/'
          local_live=json.loads(Path('/tmp/site/data/live.json').read_text(encoding='utf-8'))
          local_tts=json.loads(Path('/tmp/site/data/tts-manifest.json').read_text(encoding='utf-8'))

          def remote_json(name):
              req=urllib.request.Request(
                  base+name+'?v='+str(int(time.time()*1000)),
                  headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'daily-brief-pages-maintenance'},
              )
              with urllib.request.urlopen(req,timeout=20) as response:
                  return json.loads(response.read().decode('utf-8'))

          try:
              public_live=remote_json('live.json')
              public_tts=remote_json('tts-manifest.json')
          except Exception as exc:
              print('snapshot-fetch-error', exc)
              print('0')
              raise SystemExit

          live_ok=bool(local_live.get('lastUpdated') and public_live.get('lastUpdated')==local_live.get('lastUpdated'))
          voice_ok=bool(
              public_tts.get('prosodyPolicy')==local_tts.get('prosodyPolicy') and
              int(public_tts.get('availableArticleCount') or 0)==int(local_tts.get('availableArticleCount') or 0) and
              str(public_tts.get('lastVoicePublishedAt') or '')==str(local_tts.get('lastVoicePublishedAt') or '')
          )
          print(
              'snapshot live', public_live.get('lastUpdated'), '/', local_live.get('lastUpdated'),
              'voice', public_tts.get('prosodyPolicy'), public_tts.get('availableArticleCount'), public_tts.get('lastVoicePublishedAt'),
              '/', local_tts.get('prosodyPolicy'), local_tts.get('availableArticleCount'), local_tts.get('lastVoicePublishedAt')
          )
          print('1' if live_ok and voice_ok else '0')
          PY
          )
          SNAPSHOT_OK=$(printf '%s\n' "$SNAPSHOT_OK" | tail -n 1)
          if [ "$SNAPSHOT_OK" != "1" ]; then
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "reason=public-data-or-voice-manifest-behind-main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNTIME_OK=$(python - <<'PY'
          import hashlib, pathlib, time, urllib.request
          base='https://kanuli.github.io/daily-brief-newspaper/'
          paths=['assets/js/system-panel.js','assets/js/site-tts-v10.js']
          ok=True
          for rel in paths:
              local=pathlib.Path('/tmp/site')/rel
              if not local.is_file():
                  print('missing-local', rel)
                  ok=False
                  continue
              expected=hashlib.sha256(local.read_bytes()).hexdigest()
              try:
                  req=urllib.request.Request(base+rel+'?v='+str(int(time.time()*1000)),headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'daily-brief-pages-maintenance'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      actual=hashlib.sha256(response.read()).hexdigest()
              except Exception as exc:
                  print('runtime-fetch-error', rel, exc)
                  ok=False
                  continue
              print('runtime', rel, 'expected', expected, 'public', actual)
              if actual != expected:
                  ok=False
          print('1' if ok else '0')
          PY
          )
          RUNTIME_OK=$(printf '%s\n' "$RUNTIME_OK" | tail -n 1)
          if [ "$RUNTIME_OK" != "1" ]; then
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "reason=public-runtime-behind-main" >> "$GITHUB_OUTPUT"
          else
            echo "restart=false" >> "$GITHUB_OUTPUT"
            echo "reason=public-live-voice-runtime-current" >> "$GITHUB_OUTPUT"
          fi

      - name: Restart Pages deployment
        if: steps.inspect.outputs.restart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Pages auto maintenance: ${{ steps.inspect.outputs.reason }}"
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
          echo "PAGES_AUTO_MAINTENANCE_RESTART_DISPATCHED"

      - name: Pages healthy
        if: steps.inspect.outputs.restart != 'true'
        run: echo "Pages deployment healthy (${{ steps.inspect.outputs.reason }})."
