name: Publish CosyVoice2-Yue Daily Lead

on:
  push:
    branches: ["main"]
    paths:
      - "data/latest.json"
      - "scripts/generate_cosyvoice_lead.py"
      - ".github/workflows/cosyvoice-publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "cosyvoice2-yue-publish"
  cancel-in-progress: true

jobs:
  generate-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system audio libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg sox libsox-dev libsndfile1

      - name: Install proven CPU CosyVoice2-Yue runtime
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools==69.5.1"
          python -m pip install "numpy==1.26.4"
          python -m pip install "torch==2.3.1" "torchaudio==2.3.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "pynini==2.1.6.post1"
          python -m pip install --no-build-isolation "openai-whisper==20231117"
          python -m pip install \
            "conformer==0.3.2" "diffusers==0.29.0" "gdown==5.1.0" \
            "hydra-core==1.3.2" "HyperPyYAML==1.2.2" "ruamel.yaml==0.18.16" \
            "inflect==7.3.1" "librosa==0.10.2" "lightning==2.2.4" \
            "matplotlib==3.7.5" "modelscope==1.20.0" "networkx==3.1" \
            "omegaconf==2.3.0" "onnx==1.16.0" "onnxruntime==1.18.0" \
            "opencc" "protobuf==4.25.8" "pyarrow==18.1.0" "pydantic==2.7.0" \
            "pyworld==0.3.4" "rich==13.7.1" "soundfile==0.12.1" \
            "tensorboard==2.14.0" "transformers==4.51.3" "wetext==0.0.4" \
            "wget==3.2" "huggingface_hub>=0.30,<2" "tqdm>=4.66"

      - name: Clone official WenetSpeech-Yue CosyVoice code
        run: |
          git clone --depth 1 --recursive https://github.com/ASLP-lab/WenetSpeech-Yue.git /tmp/WenetSpeech-Yue
          test -f /tmp/WenetSpeech-Yue/CosyVoice2-Yue/cosyvoice/cli/cosyvoice.py

      - name: Generate production Daily lead WAV
        env:
          HF_HUB_DISABLE_XET: "1"
          WSYUE_ROOT: /tmp/WenetSpeech-Yue
          COSY_MODEL_DIR: /tmp/Cosyvoice2-Yue
        run: python scripts/generate_cosyvoice_lead.py

      - name: Verify production audio and manifest
        run: |
          test -s assets/audio/cosyvoice/latest-lead.wav
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/audio/cosyvoice/latest-lead.wav
          codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 assets/audio/cosyvoice/latest-lead.wav)"
          test "$codec" = "pcm_s16le"
          python - <<'PY'
          import hashlib, json
          source = open('data/latest.json', 'rb').read()
          latest = json.loads(source.decode('utf-8'))
          manifest = json.load(open('data/tts-manifest.json', encoding='utf-8'))
          assert manifest['engine'] == 'ASLP-lab/Cosyvoice2-Yue'
          assert manifest['voice'] == 'F01 female reference'
          assert manifest['sourceSha256'] == hashlib.sha256(source).hexdigest()
          assert manifest['leadId'] == latest['leadId']
          entry = manifest['articles'][latest['leadId']]
          assert entry['audio'] == 'assets/audio/cosyvoice/latest-lead.wav'
          assert entry['wavEncoding'] == 'PCM16'
          assert entry['bytes'] > 50000
          assert entry['durationSeconds'] > 2
          print('COSYVOICE_PRODUCTION_MANIFEST_PASS_PCM16')
          PY

      - name: Commit verified CosyVoice2-Yue audio locally
        id: commit_audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/audio/cosyvoice/latest-lead.wav data/tts-manifest.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CosyVoice audio already current"
          else
            git commit -m "Publish CosyVoice2-Yue Daily lead audio"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase and publish only if source article is still current
        if: steps.commit_audio.outputs.changed == 'true'
        run: |
          git fetch origin main
          git rebase origin/main
          if python - <<'PY'
          import hashlib, json, sys
          manifest = json.load(open('data/tts-manifest.json', encoding='utf-8'))
          current = hashlib.sha256(open('data/latest.json', 'rb').read()).hexdigest()
          if current != manifest['sourceSha256']:
              print('Daily lead source changed during synthesis; skip stale audio cleanly.')
              sys.exit(1)
          print('CosyVoice source hash still current after rebase.')
          PY
          then
            git push origin HEAD:main
          else
            git reset --hard origin/main
            echo "Stale CosyVoice generation safely skipped; no incorrect audio published."
          fi

      - name: Configure Pages after verified audio
        uses: actions/configure-pages@v5

      - name: Upload site including verified CosyVoice audio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site including verified CosyVoice audio
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live CosyVoice2-Yue manifest and WAV
        run: python scripts/check_live_cosyvoice_pages.py
