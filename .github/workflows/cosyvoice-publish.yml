name: Publish CosyVoice2-Yue F01 All News

on:
  push:
    branches: ["main"]
    paths:
      - "data/latest.json"
      - "data/desk-latest.json"
      - "data/live.json"
      - "data/stocks-latest.json"
      - "data/topic-more/**"
      - "data/editorial-overrides/**"
      - "scripts/generate_cosyvoice_lead.py"
      - "scripts/generate_cosyvoice_all.py"
      - "scripts/check_live_cosyvoice_pages.py"
      - ".github/workflows/cosyvoice-publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "cosyvoice2-yue-f01-all-news"
  cancel-in-progress: false

jobs:
  generate-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system audio libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg sox libsox-dev libsndfile1

      - name: Install proven CPU CosyVoice2-Yue runtime
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools==69.5.1"
          python -m pip install "numpy==1.26.4"
          python -m pip install "torch==2.3.1" "torchaudio==2.3.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "pynini==2.1.6.post1"
          python -m pip install --no-build-isolation "openai-whisper==20231117"
          python -m pip install \
            "conformer==0.3.2" "diffusers==0.29.0" "gdown==5.1.0" \
            "hydra-core==1.3.2" "HyperPyYAML==1.2.2" "ruamel.yaml==0.18.16" \
            "inflect==7.3.1" "librosa==0.10.2" "lightning==2.2.4" \
            "matplotlib==3.7.5" "modelscope==1.20.0" "networkx==3.1" \
            "omegaconf==2.3.0" "onnx==1.16.0" "onnxruntime==1.18.0" \
            "opencc" "protobuf==4.25.8" "pyarrow==18.1.0" "pydantic==2.7.0" \
            "pyworld==0.3.4" "rich==13.7.1" "soundfile==0.12.1" \
            "tensorboard==2.14.0" "transformers==4.51.3" "wetext==0.0.4" \
            "wget==3.2" "huggingface_hub>=0.30,<2" "tqdm>=4.66"

      - name: Clone official WenetSpeech-Yue CosyVoice code
        run: |
          git clone --depth 1 --recursive https://github.com/ASLP-lab/WenetSpeech-Yue.git /tmp/WenetSpeech-Yue
          test -f /tmp/WenetSpeech-Yue/CosyVoice2-Yue/cosyvoice/cli/cosyvoice.py

      - name: Generate or reuse F01 WAV for every current news story
        env:
          HF_HUB_DISABLE_XET: "1"
          WSYUE_ROOT: /tmp/WenetSpeech-Yue
          COSY_MODEL_DIR: /tmp/Cosyvoice2-Yue
          COSY_ARTICLE_MAX_TEXT_CHARS: "340"
        run: python scripts/generate_cosyvoice_all.py

      - name: Verify complete F01 manifest and PCM16 audio set
        run: |
          test -s assets/audio/cosyvoice/latest-lead.wav
          codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 assets/audio/cosyvoice/latest-lead.wav)"
          test "$codec" = "pcm_s16le"
          python - <<'PY'
          import json, pathlib, wave
          manifest = json.load(open('data/tts-manifest.json', encoding='utf-8'))
          assert manifest['version'] >= 2
          assert manifest['engine'] == 'ASLP-lab/Cosyvoice2-Yue'
          assert manifest['voice'] == 'F01 female reference'
          assert manifest['language'] == 'yue-HK'
          assert manifest['pronunciationPolicy'] == 'cantonese-only'
          assert manifest['coveragePolicy'] == 'all-current-news-f01-only'
          assert manifest['articleCount'] == manifest['collectedStoryCount']
          assert manifest['articleCount'] == len(manifest['articles'])
          assert manifest['articleCount'] > 1
          titles = set()
          for key, entry in manifest['articles'].items():
              assert entry['title'] not in titles, entry['title']
              titles.add(entry['title'])
              assert entry['wavEncoding'] == 'PCM16'
              assert entry['contentSha256']
              path = pathlib.Path(entry['audio'])
              assert path.is_file(), path
              assert path.stat().st_size == entry['bytes'] and entry['bytes'] > 50000
              with wave.open(str(path), 'rb') as wav:
                  assert wav.getsampwidth() == 2
                  duration = wav.getnframes() / float(wav.getframerate())
                  assert duration > 2
          print(f"COSYVOICE_ALL_NEWS_MANIFEST_PASS articles={manifest['articleCount']}")
          PY

      - name: Commit verified all-news F01 audio locally
        id: commit_audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/audio/cosyvoice/latest-lead.wav assets/audio/cosyvoice/articles data/tts-manifest.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All current F01 audio already published"
          else
            git commit -m "Publish CosyVoice2-Yue F01 audio for all current news"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase onto newest main and publish reusable F01 snapshot
        run: |
          git fetch origin main
          if [ "${{ steps.commit_audio.outputs.changed }}" = "true" ]; then
            git rebase origin/main
            git push origin HEAD:main
          else
            git reset --hard origin/main
          fi

      - name: Confirm F01 snapshot still covers newest news before deployment
        id: coverage
        run: |
          if python - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          import generate_cosyvoice_all as gen
          manifest = json.load(open('data/tts-manifest.json', encoding='utf-8'))
          _, _, stories, _, _, source_set_sha, _ = gen.collect_current_stories()
          titles = {gen.clean(entry.get('title')) for entry in (manifest.get('articles') or {}).values()}
          current_titles = {gen.clean(story.get('title')) for story in stories}
          if manifest.get('coveragePolicy') != 'all-current-news-f01-only':
              print('F01 coverage policy missing')
              sys.exit(1)
          if manifest.get('sourceSetSha256') != source_set_sha:
              print('News source changed during F01 generation; keep audio for reuse but do not deploy stale snapshot.')
              sys.exit(1)
          if titles != current_titles:
              print(f'Title coverage mismatch manifest={len(titles)} current={len(current_titles)}')
              sys.exit(1)
          print(f'F01 snapshot current for {len(current_titles)} stories')
          PY
          then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages after verified audio
        if: steps.coverage.outputs.current == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site including all F01 audio
        if: steps.coverage.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site including all F01 audio
        if: steps.coverage.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live all-news F01 manifest and WAV availability
        if: steps.coverage.outputs.current == 'true'
        run: python scripts/check_live_cosyvoice_pages.py
