name: One-time 19:00 Rolling Desk Patch

on:
  push:
    paths:
      - 'data/.desk-refresh-1900-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Rolling Desk safely
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('data/desk-latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          desks = data['desks']

          def story(id, desk_slugs, section, title, dek, summary, body, context, why, watch, source_name, source_url, time_label, sources):
              return {
                  'id': id, 'deskSlugs': desk_slugs, 'section': section, 'status': 'LATEST',
                  'title': title, 'dek': dek, 'summary': summary, 'body': body,
                  'context': context, 'why': why, 'watchNext': watch,
                  'sourceName': source_name, 'sourceUrl': source_url, 'timeLabel': time_label,
                  'sources': sources,
              }

          rain = story(
              'jp-kanto-heavy-rain-1900', ['japan'], '日本｜天氣／公共安全',
              '關東局部雷雨持續至深夜，東京與神奈川多區維持Level 4大雨及河川氾濫警戒',
              '神田川、善福寺川先後出現氾濫危險警報，川崎與神奈川北部亦在傍晚升至Level 4。',
              'TV Asahi最新更新顯示，東京、埼玉與神奈川傍晚出現強烈局部雷雨，部分地區發出Level 4大雨或河川氾濫危險警報。',
              '關東地區午後形成強烈局部雷雨，東京23區、埼玉及神奈川多處的警戒級別在傍晚上升。TV Asahi於18:59 JST更新指，杉並區善福寺川與新宿區一帶神田川均曾發出Level 4氾濫危險警報；神奈川北部及川崎市亦先後升至Level 4大雨警戒。\n\n氣象部門警告群馬至關東南部的活躍雨雲可能留至深夜，低窪地區浸水、河川急升及山泥傾瀉風險仍在。Level 4屬地方政府發布避難指示的重要參考級別，居民需按所在地河川水位與地方資訊採取行動。',
              '關東大氣持續不穩，東京、千葉與埼玉午後已多次出現短時間強降雨。',
              '警報涉及人口密集都市圈及河川氾濫風險，直接影響晚間交通與居民安全。',
              '地方避難指示、河川水位、鐵路道路中斷及深夜前雨雲變化。',
              'TV Asahi', 'https://news.tv-asahi.co.jp/news_society/articles/000528082.html',
              '22 Aug 2026 · 18:42–19:02 JST／17:42–18:02 HKT',
              [
                  {'name':'TV Asahi','url':'https://news.tv-asahi.co.jp/news_society/articles/000528082.html'},
                  {'name':'Tokyo Metropolitan Government','url':'https://www.kasen-suibo.metro.tokyo.lg.jp/'},
              ],
          )

          honor = story(
              'tech-honor-lightning-robot-1900', ['ai-tech'], 'AI／科技｜中國／人形機械人',
              'Honor人形機械人「閃電」百米測試跑出9.32秒',
              '成績來自世界人形機械人運動會備賽測試，不是人類田徑賽正式世界紀錄。',
              'Honor自研人形機械人在北京100米備賽測試錄得9.32秒，峰值速度14.5米／秒。',
              'Honor自研人形機械人「閃電」在第二屆世界人形機械人運動會的備賽測試中完成100米，錄得9.32秒，峰值速度達14.5米／秒。Reuters及中國科技媒體均報道相同測試數據，機械人將參加100米、400米大型組與1500米競速項目。\n\n這項成績是機械人競速測試，不屬World Athletics認可的人類田徑世界紀錄。技術意義在於雙足人形機械人在高速運動時的平衡、關節響應、視覺導航與散熱能力進一步提高；正式賽事能否重現測試速度更值得觀察。',
              '中國正把人形機械人列為重要新興產業，賽事逐步轉向自主運動與實際場景能力測試。',
              '高速雙足運動是控制、硬件與感知能力的綜合測試。',
              '正式預賽與決賽成績、是否全自主完成及高速穩定性。',
              'Reuters', 'https://www.reuters.com/sports/chinese-humanoid-robot-lightning-beats-human-100m-world-record-state-media-says-2026-08-22/',
              '22 Aug 2026 · 18:07 HKT',
              [
                  {'name':'Reuters','url':'https://www.reuters.com/sports/chinese-humanoid-robot-lightning-beats-human-100m-world-record-state-media-says-2026-08-22/'},
                  {'name':'IT之家','url':'https://m.ithome.com/html/992981.htm'},
              ],
          )

          lineup = story(
              'mu-hull-lineup-1900', ['manchester-united','football'], 'Manchester United｜Premier League／開幕戰',
              'Hull–Manchester United正選公布：Tielemans與Andrey Santos同任中場，Cunha領攻',
              'Rashford與Sesko先列後備；Mason Mount未能通過最後體能測試，Amad亦缺陣。',
              'United作客Hull的聯賽開幕戰正選確認，兩名新中場Tielemans與Andrey Santos同時正選。',
              'Manchester United在19:30 HKT作客Hull City的新季Premier League首戰已公布正選。Youri Tielemans與Andrey Santos雙雙正選，Matheus Cunha領銜前線；Marcus Rashford重返球隊後先列後備，Benjamin Sesko亦在替補席候命。\n\nHull以3-4-2-1迎戰，多名新援獲派正選。United方面Mason Mount因最後體能測試未過而缺陣，Amad亦不在名單。這場比賽是Michael Carrick首個完整球季的正式起點，兩名新中場能否迅速建立控球與壓迫節奏是重點。',
              'Hull重返英超，United則在上季第三名後進入Carrick首個完整球季。',
              '正式正選名單提供新援定位與戰術結構的第一個實戰訊號。',
              '中場控制、Rashford與Sesko何時入替，以及最終FT賽果。',
              'The Guardian', 'https://www.theguardian.com/football/live/2026/aug/22/hull-city-v-manchester-united-premier-league-live',
              '22 Aug 2026 · pre-match line-ups confirmed before 19:30 HKT kickoff',
              [
                  {'name':'The Guardian','url':'https://www.theguardian.com/football/live/2026/aug/22/hull-city-v-manchester-united-premier-league-live'},
                  {'name':'talkSPORT','url':'https://talksport.com/football/4521560/hull-city-man-united-live-commentary-time-score-team-news/'},
              ],
          )

          joao = story(
              'football-joao-pedro-2034-1900', ['football'], 'Football｜Premier League／Chelsea',
              'João Pedro與Chelsea續約至2034年，首季20球後獲長期新約',
              '24歲巴西前鋒上季成為球迷票選年度最佳球員。',
              'Chelsea官方與Reuters確認João Pedro簽下新合約至2034年。',
              'Chelsea宣布前鋒João Pedro簽下新合約，將留隊至2034年。這名24歲巴西國腳2025年由Brighton加盟，上季在各項賽事攻入20球，並獲球迷選為球會年度最佳球員；他亦在Club World Cup淘汰賽階段取得重要入球。\n\n續約在Chelsea周一作客Fulham展開Premier League新季前完成，反映球會把João Pedro視為長期進攻核心。新帥Xabi Alonso亦公開稱讚他的領導力與季前投入程度，下一步是新季能否延續入球效率。',
              'Chelsea近年傾向以長約鎖定核心及年輕球員。',
              '正式合約決定直接影響Chelsea中長期前場配置。',
              '周一對Fulham正選安排、新季入球效率及其他前鋒角色。',
              'Chelsea FC', 'https://www.chelseafc.com/en/news/article/joao-pedro-signs-new-chelsea-contract',
              '22 Aug 2026 · confirmed',
              [
                  {'name':'Chelsea FC','url':'https://www.chelseafc.com/en/news/article/joao-pedro-signs-new-chelsea-contract'},
                  {'name':'Reuters','url':'https://www.reuters.com/sports/soccer/pedro-signs-contract-extension-with-chelsea-2026-08-22/'},
              ],
          )

          def replace_or_prepend(slug, target_ids, new_story, max_items=None):
              existing = [x for x in desks[slug] if x.get('id') not in set(target_ids)]
              desks[slug] = [new_story] + existing
              if max_items:
                  desks[slug] = desks[slug][:max_items]

          replace_or_prepend('japan', ['jp-fuji-child','jp-kanto-heavy-rain-1900'], rain, 5)
          replace_or_prepend('ai-tech', ['tech-taiwan-ai-gdp','tech-honor-lightning-robot-1900'], honor, 4)
          replace_or_prepend('manchester-united', ['mu-hull','mu-hull-lineup-1900'], lineup, 3)

          # Football target is a fuller newspaper desk: retain existing high-value stories and add current confirmed events.
          desks['football'] = [x for x in desks['football'] if x.get('id') not in {'football-joao-pedro-2034-1900','mu-hull-lineup-1900'}]
          desks['football'] = [lineup, joao] + desks['football']
          desks['football'] = desks['football'][:8]

          data['generatedAt'] = '2026-08-22T19:10:00+08:00'
          data['editorialStandardVersion'] = 3
          data['contentVersion'] = 3
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Validate v3 editorial depth
        run: python scripts/validate_editorial_v2.py
      - name: Commit Rolling Desk patch
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "126388745+kanuli@users.noreply.github.com"
          git add data/desk-latest.json
          if git diff --cached --quiet; then
            echo "No desk changes needed"
          else
            git commit -m "Refresh 19:00 HKT rolling desk [desk-refresh-bot]"
            git push origin HEAD:main
          fi
