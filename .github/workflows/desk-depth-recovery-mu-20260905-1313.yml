name: One-shot MU desk depth recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desk-depth-recovery-mu-20260905-1313.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Expand rolling desk without touching Live
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/desk-latest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          stories=[
            {
              'id':'manchester-united-champions-league-squad-20260905-1313',
              'desk':'manchester-united',
              'status':'LATEST',
              'title':'曼聯提交歐聯25人A名單　Mainoo與Yoro可循B名單繼續參賽',
              'dek':'曼聯正式公布2026/27歐聯聯賽階段A名單；Mainoo與Yoro雖未列入25人名單，但因符合青年球員資格仍可透過B名單出戰。',
              'summary':'Manchester United已向UEFA提交2026/27歐聯25人A名單；Kobbie Mainoo及Leny Yoro未列A名單，但仍符合B名單參賽資格。',
              'body':'Manchester United在9月5日最新消息中正式公布2026/27 UEFA Champions League聯賽階段A名單。球會確認已提交25人名單，為重返歐聯作準備。\n\nKobbie Mainoo及Leny Yoro沒有列入A名單，但兩人因年齡及球會註冊年期符合UEFA的B名單規則，因此仍可在賽前加入B名單並代表曼聯出戰。這項正式註冊是獨立於今輪WSL開季及青訓轉會的另一宗球會事件。',
              'context':'曼聯今季重返歐聯，A名單提交後界定聯賽階段主要可用陣容；符合條件的年輕球員可透過B名單另行註冊。',
              'why':'正式歐聯註冊直接界定曼聯聯賽階段可用的一隊陣容，也澄清Mainoo與Yoro未列A名單並不等於無資格參賽。',
              'watchNext':'留意首輪歐聯前提交的B名單，以及Mainoo、Yoro是否進入比賽名單。',
              'sourceName':'Manchester United／Manchester Evening News',
              'sourceUrl':'https://www.manutd.com/en/news/reds-submit-champions-league-squad-2026-27',
              'timeLabel':'9月5日17:10 HKT核實',
              'sources':[
                {'name':'Manchester United','url':'https://www.manutd.com/en/news/reds-submit-champions-league-squad-2026-27'},
                {'name':'Manchester Evening News via Yahoo Sports','url':'https://uk.sports.yahoo.com/news/manchester-united-confirm-25-man-081808845.html'}
              ],
              'deskSlugs':['manchester-united','football'],
              'section':'曼聯｜歐聯／球員註冊',
              'sectionLabel':'曼聯',
              'mediaLabel':'Manchester United',
              'image':None
            },
            {
              'id':'manchester-united-bradbury-stoke-20260905-1710',
              'desk':'manchester-united',
              'status':'LATEST',
              'title':'曼聯青訓前鋒Louie Bradbury轉投Stoke City　簽兩年職業合約另加一年選項',
              'dek':'17歲威爾斯青年國腳結束四年曼聯青訓生涯，Stoke確認他加盟青年體系並簽下2+1年職業合約。',
              'summary':'Manchester United與Stoke City均確認17歲前鋒Louie Bradbury永久轉會；Stoke公布兩年職業合約，並持有再延長一年的選項。',
              'body':'Manchester United最新消息確認，青訓前鋒Louie Bradbury已同意永久轉投Championship球會Stoke City，交易仍待完成註冊。Bradbury在U14階段加入曼聯，之後升上U18及U21，今季離隊前仍有代表青年隊上陣。\n\nStoke City方面確認這名17歲威爾斯青年國腳簽下兩年職業合約，球會另有延長一年的選項，並將先加入U18及U21發展體系。Stoke當地報道亦獨立確認轉會與合約安排。這是與Gabriele Biancheri轉投Wacker Innsbruck不同的另一宗青訓永久離隊事件。',
              'context':'曼聯在夏季轉會窗後仍持續整理青訓球員發展路徑，部分未接近一隊固定位置的年輕球員轉往其他球會尋找更直接的成年隊機會。',
              'why':'Bradbury屬曼聯近年青訓前鋒之一，永久離隊直接改變青年梯隊人員配置，亦反映球會在青年球員發展與一隊路徑之間的取捨。',
              'watchNext':'留意Bradbury在Stoke U21／U18的首次上陣、註冊完成，以及他能否較快獲得一隊訓練或盃賽機會。',
              'sourceName':'Manchester United／Stoke City／Stoke Sentinel',
              'sourceUrl':'https://www.manutd.com/en/news',
              'timeLabel':'9月5日17:10 HKT核實',
              'sources':[
                {'name':'Manchester United','url':'https://www.manutd.com/en/news'},
                {'name':'Stoke City / Stoke Sentinel reporting','url':'https://www.thedugout.football/clubs/stoke-city/news/aHR0cHM6Ly93d3cuc3Rva2VzZW50aW5lbC5jby51ay9zcG9ydC9mb290YmFsbC90cmFuc2Zlci1uZXdzL3N0b2tlLWNpdHktY29uZmlybS1zdHJpa2VyLXRyYW5zZmVyLTExMTQyMTI1'}
              ],
              'deskSlugs':['manchester-united','football'],
              'section':'曼聯｜青訓／轉會',
              'sectionLabel':'曼聯',
              'mediaLabel':'Manchester United',
              'image':None
            }
          ]
          for story in reversed(stories):
              for slug in ('manchester-united','football'):
                  arr=data.setdefault('desks',{}).setdefault(slug,[])
                  if not any(x.get('id')==story['id'] for x in arr):
                      arr.insert(0,story.copy())
          data['generatedAt']='2026-09-05T17:10:00+08:00'
          data['date']='2026-09-05'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit recovery and remove one-shot workflow
        run: |
          rm -f .github/workflows/desk-depth-recovery-mu-20260905-1313.yml
          git config user.name 'daily-brief-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/desk-latest.json .github/workflows/desk-depth-recovery-mu-20260905-1313.yml
          git commit -m 'Restore Manchester United rolling-desk depth'
          git push origin HEAD:main
