name: Merge Live into Rolling Desk

on:
  push:
    branches: ["main"]
    paths:
      - "data/live.json"
      - "scripts/merge_live_into_desk.py"
      - "scripts/recover_desk_depth.py"
      - "scripts/validate_publication_current.py"
      - ".github/workflows/merge-live-into-desk.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "rolling-desk-merge"
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align Rolling Desk to current Live
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/recover_desk_depth.py
            python scripts/merge_live_into_desk.py
            python scripts/validate_publication_current.py
            python scripts/audit_tts_language.py

            git add -- data/desk-latest.json data/live.json
            if git diff --cached --quiet; then
              echo "ROLLING_DESK_CURRENT no merge change required"
              exit 0
            fi

            LIVE_LABEL=$(python -c 'import json; print(json.load(open("data/live.json",encoding="utf-8")).get("windowLabel", "Live"))')
            git commit -m "Sync Rolling Desk to ${LIVE_LABEL}"
            if git push origin HEAD:main; then
              echo "ROLLING_DESK_AUTO_SYNC_PASS ${LIVE_LABEL}"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Rolling Desk auto-sync could not push after retries" >&2
          exit 1
