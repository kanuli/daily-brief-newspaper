name: Merge Live into Rolling Desk

on:
  push:
    branches: ["main"]
    paths:
      - "data/latest.json"
      - "data/live.json"
      - "scripts/merge_live_into_desk.py"
      - "scripts/catch_up_live_into_desk.py"
      - "scripts/desk_retention.py"
      - "scripts/desk_freshness_policy.py"
      - "scripts/sync_daily_into_desk.py"
      - "scripts/normalize_daily_sections.py"
      - "scripts/validate_daily_v3.py"
      - "scripts/validate_desk_freshness.py"
      - "scripts/test_desk_freshness.py"
      - "scripts/recover_desk_depth.py"
      - "scripts/recover_desk_depth_watchdog.py"
      - "scripts/restore_complete_desk_reservoir.py"
      - "scripts/validate_publication_current.py"
      - ".github/workflows/merge-live-into-desk.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "rolling-desk-merge"
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare publisher workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Normalize and validate Daily v3 sections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize_daily_sections.py
          python scripts/validate_daily_v3.py

      - name: Persist Daily schema repair
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(python -c 'import json; print(json.load(open("data/latest.json",encoding="utf-8")).get("date", ""))')
          git add -- data/latest.json
          if [ -n "$DATE" ] && [ -f "data/${DATE}.json" ]; then
            git add -- "data/${DATE}.json"
          fi
          if git diff --cached --quiet; then
            echo "DAILY_SCHEMA_CHECKPOINT_NOOP"
            exit 0
          fi
          git commit -m "Normalize Daily v3 sections index"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "DAILY_SCHEMA_CHECKPOINT_PASS"
              exit 0
            fi
            sleep $((attempt * 2))
            git fetch origin main
            git rebase origin/main
          done
          echo "Daily schema repair could not push after retries" >&2
          exit 1

      - name: Restore complete reservoir after destructive overwrite
        shell: bash
        run: python scripts/restore_complete_desk_reservoir.py

      - name: Persist emergency reservoir recovery
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/desk-latest.json
          if git diff --cached --quiet; then
            echo "ROLLING_DESK_RESERVOIR_CHECKPOINT_NOOP"
            exit 0
          fi
          git commit -m "Restore complete Rolling Desk reservoir after destructive overwrite"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "ROLLING_DESK_RESERVOIR_CHECKPOINT_PASS"
              exit 0
            fi
            sleep $((attempt * 2))
            git fetch origin main
            git rebase origin/main
          done
          echo "Rolling Desk emergency reservoir checkpoint could not push after retries" >&2
          exit 1

      - name: Catch up missed Live snapshots
        shell: bash
        run: python scripts/catch_up_live_into_desk.py

      - name: Sync verified Daily into Rolling Desk
        shell: bash
        run: python scripts/sync_daily_into_desk.py

      - name: Merge current Live snapshot
        shell: bash
        run: python scripts/merge_live_into_desk.py

      - name: Recover hard desk depth
        shell: bash
        run: python scripts/recover_desk_depth_watchdog.py

      # Persistence must happen before freshness validation. Otherwise one stale
      # desk prevents legitimate new Live stories for every other desk from ever
      # reaching main, creating a permanent freshness deadlock. This checkpoint
      # stores only real Daily/Live/depth output; it does not manufacture or
      # retimestamp stale stories.
      - name: Persist legitimate Rolling Desk progress before freshness gate
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git add -- data/desk-latest.json data/live.json
          if git diff --cached --quiet; then
            echo "ROLLING_DESK_PROGRESS_CHECKPOINT_NOOP"
            exit 0
          fi
          LIVE_LABEL=$(python -c 'import json; print(json.load(open("data/live.json",encoding="utf-8")).get("windowLabel", "Live"))')
          git commit -m "Persist verified Rolling Desk progress for ${LIVE_LABEL}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "ROLLING_DESK_PROGRESS_CHECKPOINT_PASS ${LIVE_LABEL}"
              exit 0
            fi
            sleep $((attempt * 2))
            git fetch origin main
            git rebase origin/main
          done
          echo "Rolling Desk progress checkpoint could not push after retries" >&2
          exit 1

      # Freshness remains fail-closed. Old dated recovery templates were removed
      # from this workflow because once their real timestamps expire they cannot
      # legally repair freshness and must never be retimestamped as new news.
      - name: Validate desk freshness
        shell: bash
        run: python scripts/validate_desk_freshness.py

      - name: Validate current publication
        shell: bash
        run: python scripts/validate_publication_current.py

      - name: Audit Traditional Chinese TTS coverage
        shell: bash
        run: python scripts/audit_tts_language.py

      - name: Test desk freshness policy
        shell: bash
        run: python scripts/test_desk_freshness.py

      - name: Dispatch Pages after fully healthy Rolling Desk change
        if: steps.checkpoint.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main"}'
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d "$payload"
          echo "ROLLING_DESK_PAGES_DEPLOY_DISPATCHED"
