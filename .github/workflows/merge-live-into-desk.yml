name: Merge Live into Rolling Desk

on:
  push:
    branches: ["main"]
    paths:
      - "data/latest.json"
      - "data/live.json"
      - "scripts/merge_live_into_desk.py"
      - "scripts/catch_up_live_into_desk.py"
      - "scripts/desk_retention.py"
      - "scripts/desk_freshness_policy.py"
      - "scripts/sync_daily_into_desk.py"
      - "scripts/validate_desk_freshness.py"
      - "scripts/test_desk_freshness.py"
      - "scripts/recover_desk_depth.py"
      - "scripts/recover_desk_depth_watchdog.py"
      - "scripts/validate_publication_current.py"
      - ".github/workflows/merge-live-into-desk.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "rolling-desk-merge"
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align Rolling Desk to verified Daily and current Live
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # First replay every committed Live snapshot newer than the Rolling
            # reservoir. This closes gaps when a previous hourly merge failed.
            python scripts/catch_up_live_into_desk.py

            # Then align today's verified Daily, recover any hard-floor deficit,
            # re-merge the current Live snapshot, and run all publication gates.
            python scripts/sync_daily_into_desk.py
            python scripts/recover_desk_depth_watchdog.py
            python scripts/merge_live_into_desk.py
            python scripts/validate_desk_freshness.py
            python scripts/validate_publication_current.py
            python scripts/audit_tts_language.py
            python scripts/test_desk_freshness.py

            git add -- data/desk-latest.json data/live.json
            if git diff --cached --quiet; then
              echo "ROLLING_DESK_CURRENT no merge change required"
              exit 0
            fi

            LIVE_LABEL=$(python -c 'import json; print(json.load(open("data/live.json",encoding="utf-8")).get("windowLabel", "Live"))')
            git commit -m "Sync Rolling Desk to verified Daily + ${LIVE_LABEL}"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "ROLLING_DESK_AUTO_SYNC_PASS ${LIVE_LABEL}"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Rolling Desk auto-sync could not push after retries" >&2
          exit 1

      - name: Dispatch Pages after Rolling Desk change
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main"}'
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d "$payload"
          echo "ROLLING_DESK_PAGES_DEPLOY_DISPATCHED"
