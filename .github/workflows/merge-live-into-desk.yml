name: Merge Live into Rolling Desk

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "rolling-desk-merge"
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare publisher workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Preflight checked-out Live before publication writes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/scheduled_publication_contract.py data/live.json \
            --merge-commit "$(git rev-parse HEAD)" | tee "$RUNNER_TEMP/rolling-desk-live-preflight.json"

      - name: Retain Live preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-desk-live-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rolling-desk-live-preflight.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Regression test atomic publication guard
        shell: bash
        run: python scripts/test_atomic_publish.py

      - name: Normalize and validate Daily v3 sections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize_daily_sections.py
          python scripts/validate_daily_v3.py

      - name: Persist Daily schema repair
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(python -c 'import json; print(json.load(open("data/latest.json",encoding="utf-8")).get("date", ""))')
          git add -- data/latest.json
          if [ -n "$DATE" ] && [ -f "data/${DATE}.json" ]; then
            git add -- "data/${DATE}.json"
          fi
          if git diff --cached --quiet; then
            echo "DAILY_SCHEMA_CHECKPOINT_NOOP"
            exit 0
          fi
          git commit -m "Normalize Daily v3 sections index"
          python scripts/push_publication_checkpoint.py
          echo "DAILY_SCHEMA_CHECKPOINT_PASS"

      - name: Restore complete reservoir after destructive overwrite
        shell: bash
        run: python scripts/restore_complete_desk_reservoir.py

      - name: Validate recovered reservoir before persistence
        shell: bash
        run: python scripts/validate_desk_integrity.py --allow-stale

      - name: Persist emergency reservoir recovery
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/desk-latest.json
          if git diff --cached --quiet; then
            echo "ROLLING_DESK_RESERVOIR_CHECKPOINT_NOOP"
            exit 0
          fi
          git commit -m "Restore complete Rolling Desk reservoir after destructive overwrite"
          python scripts/push_publication_checkpoint.py
          echo "ROLLING_DESK_RESERVOIR_CHECKPOINT_PASS"

      - name: Catch up missed Live snapshots
        shell: bash
        run: |
          set -o pipefail
          python scripts/catch_up_live_into_desk.py 2>&1 | tee "$RUNNER_TEMP/rolling-desk-catchup.log"

      - name: Retain rejected snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-desk-catchup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rolling-desk-catchup.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Sync verified Daily into Rolling Desk
        shell: bash
        run: python scripts/sync_daily_into_desk.py

      - name: Recover hard desk depth
        shell: bash
        run: python scripts/recover_desk_depth_watchdog.py

      - name: Merge current Live and derive coverage from the final Desk
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:data/live.json > "$RUNNER_TEMP/predecessor-live.json"
          python scripts/merge_live_into_desk.py
          python scripts/formal_desk_checkpoint.py "$RUNNER_TEMP/predecessor-live.json"

      # This integrity gate is intentionally before the checkpoint below.  It
      # allows stale-but-complete emergency restoration earlier in the job, but
      # the canonical progress checkpoint itself may only persist a non-empty,
      # valid, current, hard-depth-complete desk matching the current Live cycle.
      - name: Fail closed before Rolling Desk persistence
        shell: bash
        run: python scripts/validate_desk_integrity.py

      # Persistence must happen before freshness validation. Otherwise one stale
      # desk prevents legitimate new Live stories for every other desk from ever
      # reaching main, creating a permanent freshness deadlock. This checkpoint
      # stores only real Daily/Live/depth output; it does not manufacture or
      # retimestamp stale stories.
      - name: Persist legitimate Rolling Desk progress before freshness gate
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git add -- data/desk-latest.json
          if ! cmp -s "$RUNNER_TEMP/predecessor-live.json" data/live.json; then
            git add -- data/live.json
          fi
          if git diff --cached --quiet; then
            echo "ROLLING_DESK_PROGRESS_CHECKPOINT_NOOP"
            exit 0
          fi
          LIVE_LABEL=$(python -c 'import json; print(json.load(open("data/live.json",encoding="utf-8")).get("windowLabel", "Live"))')
          git commit -m "Persist verified Rolling Desk progress for ${LIVE_LABEL}"
          python scripts/push_publication_checkpoint.py
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "ROLLING_DESK_PROGRESS_CHECKPOINT_PASS ${LIVE_LABEL}"

      # Freshness remains fail-closed. Old dated recovery templates were removed
      # from this workflow because once their real timestamps expire they cannot
      # legally repair freshness and must never be retimestamped as new news.
      - name: Validate desk freshness
        shell: bash
        run: python scripts/validate_desk_freshness.py

      - name: Validate Rolling Desk checkpoint for the separate Daily stage
        shell: bash
        run: python scripts/validate_publication_current.py --rolling-desk-checkpoint

      - name: Audit Traditional Chinese TTS coverage
        shell: bash
        run: python scripts/audit_tts_language.py

      - name: Test desk freshness policy
        shell: bash
        run: python scripts/test_desk_freshness.py
