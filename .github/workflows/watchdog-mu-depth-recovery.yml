name: Watchdog MU depth recovery

on:
  push:
    paths:
      - '.github/workflows/watchdog-mu-depth-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add verified current Manchester United story
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/desk-latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          story = {
            "id": "mu-women-rebeca-bernal-signing-20260903-0913",
            "desk": "manchester-united",
            "status": "LATEST",
            "title": "曼聯女足簽入墨西哥隊長Rebeca Bernal　由Washington Spirit轉會加盟",
            "dek": "29歲防守中場／中堅正式加盟曼聯女足，成為新季開幕前最新補強，並成為首名效力曼聯女足的墨西哥球員。",
            "summary": "Manchester United Women正式簽入墨西哥國家隊隊長Rebeca Bernal；Washington Spirit亦確認完成轉會，Bernal結束約一年半NWSL生涯轉戰英格蘭WSL。",
            "body": "曼聯女足正式完成Rebeca Bernal的轉會。29歲Bernal可出任防守中場及中堅，並長期擔任墨西哥國家隊隊長。Washington Spirit在9月2日確認把她轉會至Manchester United Women；她自2025年加盟Spirit後各項賽事上陣50場，並曾協助球隊贏得NWSL Challenge Cup。\n\n曼聯官方網站同日把『United Women sign Rebeca Bernal』列為最新女足消息。這宗轉會為Eva Olid的新季陣容增加經驗及防守多功能性，亦令Bernal成為首名代表曼聯女足的墨西哥球員。",
            "context": "曼聯女足今夏在新帥Eva Olid領軍下重整陣容，WSL新季即將展開。",
            "why": "這是已完成而非傳聞的正式轉會，直接影響曼聯女足新季陣容深度與防線配置。",
            "watchNext": "留意Bernal在WSL開季的註冊與首次上陣，以及她會被安排在防守中場還是中堅位置。",
            "sourceName": "Manchester United／Washington Spirit／AS México",
            "sourceUrl": "https://washingtonspirit.com/blog/2026/09/02/washington-spirit-transfers-midfielder-rebeca-bernal-to-englands-manchester-united-wfc/",
            "timeLabel": "9月3日09:13 HKT核實",
            "sources": [
              {"name": "Manchester United", "url": "https://www.manutd.com/en"},
              {"name": "Washington Spirit", "url": "https://washingtonspirit.com/blog/2026/09/02/washington-spirit-transfers-midfielder-rebeca-bernal-to-englands-manchester-united-wfc/"},
              {"name": "AS México", "url": "https://mexico.as.com/futbol/futbol-mexicano/rebeca-bernal-es-la-primera-jugadora-formada-en-liga-mx-en-jugar-en-el-futbol-europeo-f202609-n/"}
            ],
            "deskSlugs": ["manchester-united", "football"],
            "section": "曼聯｜女足／轉會",
            "sectionLabel": "曼聯",
            "mediaLabel": "Manchester United",
            "image": None
          }

          for desk in ('manchester-united', 'football'):
              arr = data['desks'].setdefault(desk, [])
              if not any(x.get('id') == story['id'] for x in arr):
                  arr.insert(0, story.copy())

          data['generatedAt'] = '2026-09-03T09:13:00+08:00'
          data['editorialStandardVersion'] = 3
          data['contentVersion'] = 3
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit recovery and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/watchdog-mu-depth-recovery.yml
          git add data/desk-latest.json
          git commit -m "Recover Manchester United desk depth"
          git push origin main
