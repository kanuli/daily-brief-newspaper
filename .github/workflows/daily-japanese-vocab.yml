name: Daily Japanese vocab

on:
  schedule:
    # 00:10 Hong Kong time every day (UTC+8).
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-japanese-vocab
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's 10 words
        run: python scripts/generate_daily_vocab.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          date = datetime.now(ZoneInfo("Asia/Hong_Kong")).date().isoformat()
          path = Path("data/vocab") / f"{date}.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          words = data.get("words", [])
          assert len(words) == 10, f"Expected 10 words, got {len(words)}"
          for level in ("N1", "N2", "N3", "N4", "N5"):
              count = sum(1 for word in words if word.get("level") == level)
              assert count == 2, f"{level}: expected 2, got {count}"
          print(f"Validated {path}: 10 words, 2 per JLPT level")
          PY

      - name: Commit generated vocab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vocab
          if git diff --cached --quiet; then
            echo "No vocab changes to commit."
            exit 0
          fi
          git commit -m "chore: generate daily Japanese vocab"
          git pull --rebase origin main
          git push origin HEAD:main
