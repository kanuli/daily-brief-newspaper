name: Daily Japanese vocab

on:
  schedule:
    # 00:10 Hong Kong time every day (UTC+8).
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-japanese-vocab
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's 10 teacher-quality words
        run: python scripts/generate_daily_vocab.py

      - name: Validate output and teaching-quality metadata
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          date = datetime.now(ZoneInfo("Asia/Hong_Kong")).date().isoformat()
          path = Path("data/vocab") / f"{date}.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          words = data.get("words", [])
          assert len(words) == 10, f"Expected 10 words, got {len(words)}"
          assert "teacher-core" in str(data.get("selectionPolicy", "")), data.get("selectionPolicy")
          seen = set()
          blocked = {("コム", "COM"), ("のこったぶん", "残った分"), ("アロハ", "アロハ"), ("ビア", "ビア")}
          for word in words:
              key = (str(word.get("reading", "")), str(word.get("kanji", "")))
              assert key not in seen, f"Duplicate word: {key}"
              seen.add(key)
              assert key not in blocked, f"Known unsuitable daily-teaching regression: {key}"
              assert word.get("teacherGrade") in {"A", "B"}, f"Non A/B teacher grade: {key}"
              assert word.get("teacherStatus") == "direct", f"Non-direct teacher status: {key}"
              assert word.get("teacherCommon") is True, f"Non-common word: {key}"
              assert word.get("selectionClass") == "teacher-core-common-direct", f"Wrong source class: {key}"
              assert not re.search(r"[A-Za-z0-9@:/\\]", key[1]), f"ASCII/code-like display: {key}"
          for level in ("N1", "N2", "N3", "N4", "N5"):
              count = sum(1 for word in words if word.get("level") == level)
              assert count == 2, f"{level}: expected 2, got {count}"
          latest = json.loads(Path("data/vocab/latest.json").read_text(encoding="utf-8"))
          assert latest == data, "latest.json must exactly match today's dated file"
          print(f"Validated {path}: 10 teacher-quality words, 2 per JLPT level")
          PY

      - name: Commit generated vocab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vocab
          if git diff --cached --quiet; then
            echo "No vocab changes to commit."
            exit 0
          fi
          git commit -m "chore: generate daily Japanese vocab"
          git pull --rebase origin main
          git push origin HEAD:main
