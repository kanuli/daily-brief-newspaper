name: One-shot 2026-09-14 publication QA diagnostic
on:
  push:
    paths:
      - '.github/workflows/diag-20260914-publication.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture current publication validator output and self-clean
        shell: bash
        run: |
          set +e
          python scripts/merge_live_into_desk.py >/tmp/merge.out 2>&1
          m=$?
          python scripts/validate_publication_current.py >/tmp/qa.out 2>&1
          q=$?
          set -e
          {
            echo "merge_rc=$m"
            cat /tmp/merge.out
            echo "qa_rc=$q"
            cat /tmp/qa.out
          } > .tmp-publication-qa-20260914.txt
          git rm .github/workflows/diag-20260914-publication.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/desk-latest.json .tmp-publication-qa-20260914.txt
          git commit -m "Capture 2026-09-14 publication QA diagnostic"
          git push