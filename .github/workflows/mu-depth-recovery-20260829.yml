name: One-off MU Topic Depth Recovery 2026-08-29

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mu-depth-recovery-20260829.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "mu-topic-depth-recovery-20260829"
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover unique current Manchester United depth only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path('data/desk-latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          desks = data.setdefault('desks', {})
          mu = list(desks.get('manchester-united') or [])

          # Remove an expired Aug-22 match follow-up and collapse the duplicate
          # Baleba/Ipswich team-news rewrite into the newer Reuters + club item.
          drop = {
              'mu-hull-fallout-20260825',
              'mu-ipswich-team-news-20260828-depth',
              'mu-collyer-west-brom-agreement-20260829-depth',
          }
          mu = [s for s in mu if s.get('id') not in drop]

          story = {
            'id': 'mu-collyer-west-brom-agreement-20260829-depth',
            'desk': 'manchester-united',
            'status': 'LATEST',
            'title': '曼聯與西布朗就高利亞永久轉會達協議　初步轉會費300萬鎊',
            'dek': 'BBC首席足球記者指交易連附加條款最高可達760萬鎊，曼聯另保留40%日後轉售分成。',
            'summary': '曼聯中場高利亞接近永久重返西布朗，兩會已就轉會費結構達成協議，球員預計選擇較穩定的上陣機會。',
            'body': 'BBC首席足球記者Simon Stone在8月28日報道，曼聯已與英冠西布朗就22歲中場Toby Collyer的永久轉會達成協議，初步轉會費為300萬英鎊，連附加條款整體可升至760萬英鎊，曼聯並保留40%的日後轉售分成。高利亞上季曾先後外借西布朗及侯城，今夏在曼聯中場大幅重組後，上陣空間進一步收窄。\n\n報道指，高利亞一度在西布朗與侯城之間作選擇，最終西布朗較穩定的上陣前景成為重要因素。這宗交易與同日的巴利巴傷情、葉士域治賽前部署、歐聯抽籤及聯賽盃抽籤屬不同事件，亦反映曼聯在轉會窗尾段同步處理一隊補強與邊緣球員去留。',
            'context': '高利亞由白禮頓青訓轉投曼聯後曾為一隊上陣，2025/26球季先後外借西布朗及侯城；曼聯今夏已重整中場人腳。',
            'why': '永久出售青訓中場會影響曼聯轉會收入及陣容精簡，而高比例轉售分成亦保留球員日後升值的財務回報。',
            'watchNext': '留意西布朗及曼聯正式公告、個人條款與註冊完成時間，以及交易能否在轉會窗關閉前完成。',
            'sourceName': 'BBC Sport／talkSPORT',
            'sourceUrl': 'https://sports.yahoo.com/articles/west-brom-agree-fee-man-151115937.html',
            'timeLabel': '8月29日06:13 HKT前核實',
            'sources': [
              {
                'name': 'BBC Sport／Simon Stone（Yahoo Sports轉載）',
                'url': 'https://sports.yahoo.com/articles/west-brom-agree-fee-man-151115937.html'
              },
              {
                'name': 'talkSPORT',
                'url': 'https://talksport.com/football/4519536/man-utd-west-brom-toby-collyer-talks-transfer/'
              }
            ],
            'deskSlugs': ['manchester-united'],
            'section': 'Manchester United｜轉會／青訓',
            'sectionLabel': 'Manchester United'
          }
          mu.insert(0, story)

          # Ensure no duplicate IDs after the event-level cleanup.
          seen = set(); cleaned = []
          for item in mu:
              sid = item.get('id')
              if not sid or sid in seen:
                  continue
              seen.add(sid); cleaned.append(item)
          desks['manchester-united'] = cleaned

          # Desk-only recovery: preserve data/live.json completely unchanged.
          hkt = timezone(timedelta(hours=8))
          data['generatedAt'] = datetime.now(hkt).replace(microsecond=0).isoformat()
          data['editorialStandardVersion'] = 3
          data['contentVersion'] = 3
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ids = [s.get('id') for s in cleaned]
          required = {
              'mu-collyer-west-brom-agreement-20260829-depth',
              'mu-baleba-ankle-injury-20260828-2200',
              'mu-ucl-draw-20260828-0600',
              'mu-league-cup-brighton-draw-20260828-depth',
          }
          if not required.issubset(set(ids)):
              raise SystemExit(f'MU recovery missing required distinct events: {sorted(required-set(ids))}')
          if len(cleaned) < 4:
              raise SystemExit(f'MU unique/current depth still below floor: {len(cleaned)}')
          print('MU_DEPTH_RECOVERY_OK', len(cleaned), ids)
          PY

            python scripts/validate_publication_current.py
            git add -- data/desk-latest.json
            if git diff --cached --quiet; then
              echo "MU_DEPTH_RECOVERY_NOOP"
              exit 0
            fi
            git commit -m "Recover unique Manchester United topic depth"
            if git push origin HEAD:main; then
              echo "MU_DEPTH_RECOVERY_PUSH_PASS"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "MU topic-depth recovery failed to push" >&2
          exit 1
