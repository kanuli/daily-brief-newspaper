name: Build Canto TTS Nano Listening Samples

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/generate_canto_nano_test.py"
      - "canto-voice-test.html"
      - ".github/workflows/canto-nano-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "canto-tts-nano-listening-test"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: canto-tts-nano-v1-hf-cache

      - name: Install canto-tts
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install "canto-tts"

      - name: Generate three independent listening samples
        env:
          HF_HUB_DISABLE_XET: "1"
        run: python scripts/generate_canto_nano_test.py

      - name: Publish test WAV files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/canto-nano-test
          if git diff --cached --quiet; then
            echo "CANTO_NANO_TEST_AUDIO_ALREADY_CURRENT"
            exit 0
          fi
          git commit -m "Publish canto-tts-nano listening samples"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "CANTO_NANO_TEST_AUDIO_PUBLISHED"
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
