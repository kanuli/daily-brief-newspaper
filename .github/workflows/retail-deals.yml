name: Retail Deals Collector

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/retail_deals_collector.py"
      - ".github/workflows/retail-deals.yml"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "retail-deals-collector"
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate collector syntax
        run: python -m py_compile scripts/retail_deals_collector.py

      - name: Collect latest public retail deals
        run: python scripts/retail_deals_collector.py --output data/retail-deals.json

      - name: Validate public retail dataset
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/retail-deals.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          version=data.get('schemaVersion')
          if version not in (1,2):
              raise SystemExit('bad retail schema version')
          required=('offers','promotions','sources') if version == 2 else ('products','promotions','sources')
          for key in required:
              if not isinstance(data.get(key), list):
                  raise SystemExit(f'{key} must be an array')
          if not data.get('generatedAt'):
              raise SystemExit('retail generatedAt missing')
          if not data['sources']:
              raise SystemExit('retail source-health rows missing')
          primary='offers' if version == 2 else 'products'
          print('RETAIL_PUBLIC_DATA_OK', version, len(data[primary]), len(data['promotions']), len(data['sources']), data['generatedAt'])
          PY

      - name: Commit latest retail deals
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/retail_deals_collector.py data/retail-deals.json
          if git diff --cached --quiet; then
            echo "No retail deal changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update latest retail deals"

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep 3
              continue
            fi
            if git push origin HEAD:main; then
              echo "RETAIL_DEALS_PUBLISHED"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 4
          done
          echo "Unable to publish retail deals after 3 attempts" >&2
          exit 1

      - name: Redeploy Pages with refreshed retail deals
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref main
          echo "RETAIL_PAGES_REDEPLOY_DISPATCHED"
