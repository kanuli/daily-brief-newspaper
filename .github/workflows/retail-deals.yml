# Watchdog freshness recovery trigger: 2026-09-08 10:31 HKT
name: Retail Promotion Collector

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/retail_deals_collector.py"
      - ".github/workflows/retail-deals.yml"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "retail-promotion-collector"
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate collector syntax
        run: python -m py_compile scripts/retail_deals_collector.py

      - name: Collect latest public retail promotions only
        run: python scripts/retail_deals_collector.py --output data/retail-deals.json

      - name: Validate promotion-only public dataset
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path('data/retail-deals.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('schemaVersion') != 3:
              raise SystemExit('retail promotion schema must be version 3')
          if not isinstance(data.get('promotions'), list):
              raise SystemExit('promotions must be an array')
          if not isinstance(data.get('sources'), list) or not data['sources']:
              raise SystemExit('sources must be a non-empty array')
          if not data.get('generatedAt'):
              raise SystemExit('generatedAt missing')

          forbidden = {
              'offers', 'products', 'currentPrice', 'regularPrice', 'priceHistory',
              'historicalLow', 'historicalHigh', 'previousObservedPrice', 'changePct'
          }

          def walk(value, path='root'):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in forbidden:
                          raise SystemExit(f'FORBIDDEN_PRICE_FIELD {path}.{key}')
                      walk(child, f'{path}.{key}')
              elif isinstance(value, list):
                  for idx, child in enumerate(value):
                      walk(child, f'{path}[{idx}]')

          walk(data)

          today = datetime.now(timezone.utc).astimezone(ZoneInfo('Asia/Hong_Kong')).date()
          active = []
          for idx, promo in enumerate(data['promotions']):
              start_raw = promo.get('startDate')
              end_raw = promo.get('endDate')
              if not start_raw or not end_raw:
                  raise SystemExit(f'promotion[{idx}] missing clear startDate/endDate')
              try:
                  start = datetime.strptime(start_raw, '%Y-%m-%d').date()
                  end = datetime.strptime(end_raw, '%Y-%m-%d').date()
              except ValueError as exc:
                  raise SystemExit(f'promotion[{idx}] invalid promotion date: {exc}')
              if start > end:
                  raise SystemExit(f'promotion[{idx}] startDate after endDate')
              if promo.get('active') is not False and start <= today <= end:
                  active.append(promo)

          if not active:
              raise SystemExit('no clearly dated current promotions')
          if len(active) != len(data['promotions']):
              raise SystemExit('public promotions dataset contains stale/future/non-current entries')

          print('RETAIL_PROMOTION_ONLY_OK', len(active), len(data['sources']), data['generatedAt'])
          PY

      - name: Commit latest retail promotions
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/retail_deals_collector.py data/retail-deals.json
          if git diff --cached --quiet; then
            echo "No retail promotion changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update latest retail promotions"

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep 3
              continue
            fi
            if git push origin HEAD:main; then
              echo "RETAIL_PROMOTIONS_PUBLISHED"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 4
          done
          echo "Unable to publish retail promotions after 3 attempts" >&2
          exit 1

      - name: Redeploy Pages with refreshed promotions
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main"}'
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d "$payload"
          echo "RETAIL_PROMOTION_PAGES_DEPLOY_DISPATCHED"
