name: Editor-in-Chief Newsroom Assignment

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/editor-in-chief-newsroom-assignment.yml"
      - "config/newsroom-robots.json"
      - "scripts/newsroom_control_plane.py"
      - ".github/workflows/daily-japanese-vocab.yml"
      - "scripts/generate_daily_vocab.py"
      - "scripts/rolling_news_collector.py"
      - "scripts/general_news_verified_producer.py"
      - "scripts/general_news_verification_robot.py"
      - "scripts/validate_desk_freshness.py"
      - "scripts/validate_stock_news.py"
      - "scripts/validate_publication_current.py"
      - "data/latest.json"
      - "data/live.json"
      - "data/desk-latest.json"
      - "data/stocks-latest.json"
      - "data/vocab/**"
  schedule:
    # Collector normally runs at :00/:15/:30/:45. Inspect after it has had time
    # to finish, then assign the next Robot from evidence rather than by timer.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: "editor-in-chief-newsroom-assignment"
  cancel-in-progress: true

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect independent newsroom evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/search-staging.json /tmp/page-news-sentinel.json /tmp/editor-status.json

          git fetch -q --depth=1 origin news-staging || true
          git show FETCH_HEAD:data/search-staging.json > /tmp/search-staging.json 2>/dev/null || echo '{}' > /tmp/search-staging.json

          git fetch -q --depth=1 origin page-sentinel-status || true
          git show FETCH_HEAD:data/page-news-sentinel-status.json > /tmp/page-news-sentinel.json 2>/dev/null || echo '{}' > /tmp/page-news-sentinel.json

          git fetch -q --depth=1 origin editor-status || true
          git show FETCH_HEAD:data/editor-in-chief-status.json > /tmp/editor-status.json 2>/dev/null || echo '{}' > /tmp/editor-status.json

      - name: Run current newsroom checks
        shell: bash
        run: |
          set +e
          python scripts/validate_desk_freshness.py --report /tmp/desk-freshness.json
          echo $? > /tmp/desk-rc
          python scripts/validate_stock_news.py
          echo $? > /tmp/stock-rc
          python scripts/validate_publication_current.py
          echo $? > /tmp/publication-rc
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo("Asia/Hong_Kong")).date().isoformat()
          dated=Path("data/vocab") / f"{today}.json"
          latest=Path("data/vocab/latest.json")
          ok=dated.is_file() and latest.is_file()
          if ok:
              try:
                  d=json.loads(dated.read_text(encoding="utf-8"))
                  l=json.loads(latest.read_text(encoding="utf-8"))
                  ok=(d.get("date")==today and l.get("date")==today)
              except Exception:
                  ok=False
          print(f"VOCAB_CURRENTNESS today={today} dated={dated.is_file()} ok={ok}")
          raise SystemExit(0 if ok else 1)
          PY
          echo $? > /tmp/vocab-rc
          set -e

      - name: Editor-in-Chief classifies faults and assigns Robots
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/newsroom_control_plane.py
          python scripts/newsroom_control_plane.py \
            --staging /tmp/search-staging.json \
            --freshness /tmp/desk-freshness.json \
            --editor-status /tmp/editor-status.json \
            --sentinel /tmp/page-news-sentinel.json \
            --stock-rc "$(cat /tmp/stock-rc)" \
            --publication-rc "$(cat /tmp/publication-rc)" \
            --vocab-rc "$(cat /tmp/vocab-rc)" \
            --output /tmp/editor-news-assignments.json
          python - <<'PY' > /tmp/editor-news-workflows.txt
          import json
          d=json.load(open('/tmp/editor-news-assignments.json',encoding='utf-8'))
          for row in d.get('assignments') or []:
              wf=str(row.get('workflow') or '').strip()
              if wf:
                  print(wf)
          PY

      - name: Dispatch assigned Robots without duplicate work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/editor-news-execution.jsonl
          while IFS= read -r wf; do
            [ -n "$wf" ] || continue

            assignment=$(WF="$wf" python - <<'PY'
          import json, os
          d=json.load(open('/tmp/editor-news-assignments.json',encoding='utf-8'))
          row=next((x for x in (d.get('assignments') or []) if x.get('workflow')==os.environ['WF']),{})
          print(json.dumps(row,separators=(',',':')))
          PY
            )
            mode=$(ASSIGNMENT="$assignment" python - <<'PY'
          import json,os
          print(json.loads(os.environ['ASSIGNMENT']).get('mode','normal'))
          PY
            )
            fault=$(ASSIGNMENT="$assignment" python - <<'PY'
          import json,os
          print(json.loads(os.environ['ASSIGNMENT']).get('faultClass','unknown'))
          PY
            )

            gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" --limit 10 \
              --json databaseId,status,createdAt > /tmp/assignment-active.json 2>/dev/null || printf '[]' > /tmp/assignment-active.json
            active=$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/assignment-active.json',encoding='utf-8'))
          print(sum(1 for r in rows if r.get('status') != 'completed'))
          PY
            )
            if [ "${active:-0}" -gt 0 ]; then
              printf '{"workflow":"%s","mode":"%s","faultClass":"%s","dispatched":false,"reason":"already-active","outcomeVerification":"required-next-cycle"}\n' "$wf" "$mode" "$fault" >> /tmp/editor-news-execution.jsonl
              continue
            fi

            ok=false
            if [ "$wf" = "rolling-news-search.yml" ]; then
              if gh workflow run "$wf" --repo "${GITHUB_REPOSITORY}" --ref main -f mode="$mode"; then ok=true; fi
            elif [ "$wf" = "stock-publication-maintenance.yml" ]; then
              if gh workflow run "$wf" --repo "${GITHUB_REPOSITORY}" --ref main -f recovery_mode="$mode"; then ok=true; fi
            else
              if gh workflow run "$wf" --repo "${GITHUB_REPOSITORY}" --ref main; then ok=true; fi
            fi

            if [ "$ok" = "true" ]; then
              printf '{"workflow":"%s","mode":"%s","faultClass":"%s","dispatched":true,"reason":"assigned-by-editor-in-chief","outcomeVerification":"required-next-cycle"}\n' "$wf" "$mode" "$fault" >> /tmp/editor-news-execution.jsonl
            else
              printf '{"workflow":"%s","mode":"%s","faultClass":"%s","dispatched":false,"reason":"dispatch-failed"}\n' "$wf" "$mode" "$fault" >> /tmp/editor-news-execution.jsonl
            fi
          done < /tmp/editor-news-workflows.txt

          echo "EDITOR_IN_CHIEF_ROBOT_EXECUTION"
          cat /tmp/editor-news-execution.jsonl || true

      - name: Publish Editor-in-Chief assignment telemetry
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/editor-news-assignments.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.load(open('/tmp/editor-news-assignments.json',encoding='utf-8'))
          execution=[]
          p=Path('/tmp/editor-news-execution.jsonl')
          if p.is_file():
              execution=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          a['execution']=execution
          a['dispatchedCount']=sum(1 for x in execution if x.get('dispatched'))
          a['alreadyActiveCount']=sum(1 for x in execution if x.get('reason')=='already-active')
          a['dispatchFailureCount']=sum(1 for x in execution if x.get('reason')=='dispatch-failed')
          Path('/tmp/editor-news-assignments-final.json').write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          rm -rf /tmp/editor-assignments-publish
          mkdir -p /tmp/editor-assignments-publish/data
          cp /tmp/editor-news-assignments-final.json /tmp/editor-assignments-publish/data/newsroom-assignments.json
          cd /tmp/editor-assignments-publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b editor-assignments
          git add data/newsroom-assignments.json
          git commit -q -m "Update Editor-in-Chief newsroom assignments"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin editor-assignments

      - name: Fail if an assignment could not be dispatched
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"reason":"dispatch-failed"' /tmp/editor-news-execution.jsonl 2>/dev/null; then
            echo "Editor-in-Chief could not dispatch one or more assigned Robots." >&2
            exit 1
          fi
          echo "EDITOR_IN_CHIEF_NEWSROOM_ASSIGNMENT_PASS"
