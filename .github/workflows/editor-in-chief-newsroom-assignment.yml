name: Editor-in-Chief Newsroom Assignment

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/editor-in-chief-newsroom-assignment.yml"
      - "config/newsroom-robots.json"
      - "scripts/newsroom_control_plane.py"
      - "scripts/daily_recovery_dependency.py"
      - ".github/workflows/daily-japanese-vocab.yml"
      - ".github/workflows/daily-today-recovery.yml"
      - "scripts/generate_daily_vocab.py"
      - "scripts/rolling_news_collector.py"
      - ".github/workflows/general-news-producer.yml"
      - "scripts/general_news_verified_producer.py"
      - "scripts/general_news_verification_robot.py"
      - "scripts/general_news_local_fallback.py"
      - "scripts/parallel_general_news_fallback.py"
      - "scripts/requirements-general-news-fallback.txt"
      - "scripts/check_general_news_fallback_dependencies.py"
      - "scripts/probe_general_news_fallback_capability.py"
      - "scripts/editorial_revision_trial.py"
      - "scripts/editorial_trial_observation.py"
      - "scripts/validate_desk_freshness.py"
      - "scripts/merge_live_into_desk.py"
      - "scripts/validate_stock_news.py"
      - "scripts/validate_publication_current.py"
      - "data/latest.json"
      - "data/live.json"
      - "data/desk-latest.json"
      - "data/stocks-latest.json"
      - "data/vocab/**"
      - "data/tts-manifest.json"
  workflow_run:
    workflows:
      - "Rolling News Search 15m"
      - "General News Verified Producer"
      - "Live Publication Auto Maintenance"
      - "Merge Live into Rolling Desk"
      - "Stock News Hourly Maintenance"
      - "Daily Japanese vocab"
      - "Today Daily Recovery"
      - "Deploy Daily Brief to GitHub Pages"
      - "Verify Public Pages Publication Snapshot"
      - "Publish Canto Nano Female Cantonese News Voice"
    types: [completed]
  schedule:
    # Safety net only. Normal continuation is event-driven from robot completion.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: "editor-in-chief-newsroom-assignment"
  # Never cancel an assignment cycle halfway through robot dispatch/telemetry.
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    # Existing control plane plus at most one bounded runtime capability check.
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect independent newsroom evidence and prior assignment outcome
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            /tmp/search-staging.json \
            /tmp/prepublish.json \
            /tmp/producer-capacity.json \
            /tmp/page-news-sentinel.json \
            /tmp/pages-live-status.json \
            /tmp/pages-deployment.json \
            /tmp/editor-status.json \
            /tmp/previous-assignments.json

          git fetch -q origin news-staging:refs/remotes/origin/news-staging || true
          git show origin/news-staging:data/search-staging.json > /tmp/search-staging.json 2>/dev/null || echo '{}' > /tmp/search-staging.json

          git fetch -q origin prepublish-news:refs/remotes/origin/prepublish-news || true
          git show origin/prepublish-news:data/prepublish.json > /tmp/prepublish.json 2>/dev/null || echo '{}' > /tmp/prepublish.json
          git show origin/prepublish-news:data/producer-capacity.json > /tmp/producer-capacity.json 2>/dev/null || echo '{}' > /tmp/producer-capacity.json

          git fetch -q origin page-sentinel-status:refs/remotes/origin/page-sentinel-status || true
          git show origin/page-sentinel-status:data/page-news-sentinel-status.json > /tmp/page-news-sentinel.json 2>/dev/null || echo '{}' > /tmp/page-news-sentinel.json

          git fetch -q origin pages-status:refs/remotes/origin/pages-status || true
          git show origin/pages-status:data/pages-live-status.json > /tmp/pages-live-status.json 2>/dev/null || echo '{}' > /tmp/pages-live-status.json

          # Read actual completed deployment evidence; dispatch is not proof.
          gh run list --repo "${GITHUB_REPOSITORY}" --workflow pages.yml --status success --limit 1 \
            --json databaseId,conclusion,updatedAt > /tmp/pages-deployment.json || echo '[]' > /tmp/pages-deployment.json

          git fetch -q origin editor-status:refs/remotes/origin/editor-status || true
          git show origin/editor-status:data/editor-in-chief-status.json > /tmp/editor-status.json 2>/dev/null || echo '{}' > /tmp/editor-status.json

          git fetch -q origin editor-assignments:refs/remotes/origin/editor-assignments || true
          git show origin/editor-assignments:data/newsroom-assignments.json > /tmp/previous-assignments.json 2>/dev/null || echo '{}' > /tmp/previous-assignments.json

      # Infrastructure only: one immutable attempt for the reviewed fallback revision.
      # No news discovery, article/draft writes, publication or leaf dispatch here.
      - name: Site Editor-in-Chief claims bounded infrastructure capability probe
        id: capability_claim
        # Owner explicitly disallowed Qwen; retain the immutable old ledger.
        if: ${{ false }}
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_general_news_fallback_capability.py prepare \
            --root . --state /tmp/eic-capability-claim.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore existing local fallback model for infrastructure probe
        if: ${{ false }}
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-1.5b-v1

      - name: Check repaired dependencies and synthetic local-model readiness only
        if: ${{ false }}
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        run: |
          python scripts/probe_general_news_fallback_capability.py run \
            --root . --state /tmp/eic-capability-claim.json \
            --result /tmp/eic-capability-result.json

      - name: Preserve immutable capability history and fresh runtime-only verdict
        if: ${{ false }}
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_general_news_fallback_capability.py finalize \
            --state /tmp/eic-capability-claim.json \
            --result /tmp/eic-capability-result.json \
            --capacity /tmp/producer-capacity.json

      - name: Run current newsroom checks
        shell: bash
        run: |
          set +e
          python scripts/validate_desk_freshness.py --report /tmp/desk-freshness.json
          echo $? > /tmp/desk-rc

          python scripts/validate_stock_news.py
          echo $? > /tmp/stock-rc

          python scripts/validate_publication_current.py
          echo $? > /tmp/publication-rc

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today=datetime.now(ZoneInfo("Asia/Hong_Kong")).date().isoformat()
          dated=Path("data/vocab") / f"{today}.json"
          latest=Path("data/vocab/latest.json")
          ok=dated.is_file() and latest.is_file()
          if ok:
              try:
                  d=json.loads(dated.read_text(encoding="utf-8"))
                  l=json.loads(latest.read_text(encoding="utf-8"))
                  ok=(d.get("date")==today and l.get("date")==today)
              except Exception:
                  ok=False
          print(f"VOCAB_CURRENTNESS today={today} dated={dated.is_file()} ok={ok}")
          raise SystemExit(0 if ok else 1)
          PY
          echo $? > /tmp/vocab-rc
          set -e

      - name: Editor-in-Chief classifies faults, dependencies and prior outcomes
        env:
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN='${{ github.token }}' python scripts/editorial_revision_trial.py inspect \
            --root . --permit /tmp/eic-editorial-trial-permit.json
          python -m py_compile scripts/newsroom_control_plane.py
          python scripts/newsroom_control_plane.py \
            --registry config/newsroom-robots.json \
            --staging /tmp/search-staging.json \
            --prepublish /tmp/prepublish.json \
            --producer-capacity /tmp/producer-capacity.json \
            --freshness /tmp/desk-freshness.json \
            --editor-status /tmp/editor-status.json \
            --sentinel /tmp/page-news-sentinel.json \
            --pages-status /tmp/pages-live-status.json \
            --pages-deployment /tmp/pages-deployment.json \
            --editorial-trial /tmp/eic-editorial-trial-permit.json \
            --previous-assignments /tmp/previous-assignments.json \
            --latest data/latest.json \
            --live data/live.json \
            --desk data/desk-latest.json \
            --stocks data/stocks-latest.json \
            --tts data/tts-manifest.json \
            --stock-rc "$(cat /tmp/stock-rc)" \
            --publication-rc "$(cat /tmp/publication-rc)" \
            --vocab-rc "$(cat /tmp/vocab-rc)" \
            --trigger-workflow "${TRIGGER_WORKFLOW:-}" \
            --trigger-conclusion "${TRIGGER_CONCLUSION:-}" \
            --output /tmp/editor-news-assignments.json

          python - <<'PY' > /tmp/editor-news-queue.b64
          import base64, json
          d=json.load(open('/tmp/editor-news-assignments.json',encoding='utf-8'))
          for row in d.get('assignments') or []:
              raw=json.dumps(row,separators=(',',':'),ensure_ascii=False).encode()
              print(base64.b64encode(raw).decode())
          PY

      - name: Dispatch only Editor-in-Chief-assigned Robots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/editor-news-execution.jsonl

          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            assignment="$(printf '%s' "$encoded" | base64 -d)"

            robot="$(jq -r '.robot' <<<"$assignment")"
            wf="$(jq -r '.workflow' <<<"$assignment")"
            mode="$(jq -r '.mode // "normal"' <<<"$assignment")"
            fault="$(jq -r '.faultClass // "unknown"' <<<"$assignment")"
            status="$(jq -r '.status // "assigned"' <<<"$assignment")"
            dispatchable="$(jq -r '.dispatchable // false' <<<"$assignment")"
            max_runtime="$(jq -r '.maxRuntimeMinutes // 30' <<<"$assignment")"
            assignment_id="$(jq -r '.assignmentId // ""' <<<"$assignment")"

            if [ "$dispatchable" != "true" ]; then
              blocked_by="$(jq -c '.blockedBy // []' <<<"$assignment")"
              printf '{"assignmentId":"%s","robot":"%s","workflow":"%s","mode":"%s","faultClass":"%s","dispatched":false,"reason":"%s","blockedBy":%s,"outcomeVerification":"required-next-cycle"}\n' \
                "$assignment_id" "$robot" "$wf" "$mode" "$fault" "$status" "$blocked_by" >> /tmp/editor-news-execution.jsonl
              continue
            fi

            gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" --limit 20 \
              --json databaseId,status,createdAt > /tmp/assignment-active.json 2>/dev/null || printf '[]' > /tmp/assignment-active.json

            stale_ids="$(MAX_RUNTIME="$max_runtime" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          rows=json.load(open('/tmp/assignment-active.json',encoding='utf-8'))
          now=datetime.now(timezone.utc)
          limit=float(os.environ['MAX_RUNTIME']) + 5.0
          out=[]
          for row in rows:
              if row.get('status') == 'completed':
                  continue
              try:
                  created=datetime.fromisoformat(str(row.get('createdAt')).replace('Z','+00:00')).astimezone(timezone.utc)
                  age=(now-created).total_seconds()/60.0
              except Exception:
                  continue
              if age > limit:
                  out.append(str(row.get('databaseId')))
          print(' '.join(out))
          PY
            )"

            if [ -n "$stale_ids" ]; then
              for run_id in $stale_ids; do
                echo "EDITOR_ROBOT_STUCK_CANCEL robot=$robot workflow=$wf run=$run_id maxRuntime=${max_runtime}m"
                gh run cancel "$run_id" --repo "${GITHUB_REPOSITORY}" || true
              done
              sleep 3
            fi

            active="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)"
            if [ "${active:-0}" -gt 0 ]; then
              printf '{"assignmentId":"%s","robot":"%s","workflow":"%s","mode":"%s","faultClass":"%s","dispatched":false,"reason":"already-active","outcomeVerification":"required-next-cycle"}\n' \
                "$assignment_id" "$robot" "$wf" "$mode" "$fault" >> /tmp/editor-news-execution.jsonl
              continue
            fi

            args=(workflow run "$wf" --repo "${GITHUB_REPOSITORY}" --ref main)
            while IFS=$'\t' read -r key value; do
              [ -n "$key" ] || continue
              args+=(-f "$key=$value")
            done < <(jq -r '.dispatchInputs // {} | to_entries[] | [.key,(.value|tostring)] | @tsv' <<<"$assignment")

            if [ "$status" = "reviewed-editorial-trial" ]; then
              if ! python scripts/editorial_revision_trial.py claim --root . \
                --permit /tmp/eic-editorial-trial-permit.json --assignment-json "$assignment" \
                --state /tmp/eic-editorial-trial-claim.json; then
                printf '{"assignmentId":"%s","robot":"%s","workflow":"%s","dispatched":false,"reason":"editorial-trial-claim-denied"}\n' \
                  "$assignment_id" "$robot" "$wf" >> /tmp/editor-news-execution.jsonl
                continue
              fi
            fi

            if gh "${args[@]}"; then
              printf '{"assignmentId":"%s","robot":"%s","workflow":"%s","mode":"%s","faultClass":"%s","dispatched":true,"reason":"assigned-by-editor-in-chief","outcomeVerification":"required-next-cycle"}\n' \
                "$assignment_id" "$robot" "$wf" "$mode" "$fault" >> /tmp/editor-news-execution.jsonl
            else
              printf '{"assignmentId":"%s","robot":"%s","workflow":"%s","mode":"%s","faultClass":"%s","dispatched":false,"reason":"dispatch-failed"}\n' \
                "$assignment_id" "$robot" "$wf" "$mode" "$fault" >> /tmp/editor-news-execution.jsonl
            fi
          done < /tmp/editor-news-queue.b64

          echo "EDITOR_IN_CHIEF_ROBOT_EXECUTION"
          cat /tmp/editor-news-execution.jsonl || true

      - name: Publish Editor-in-Chief assignment telemetry
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/editor-news-assignments.json

          python - <<'PY'
          import json
          from pathlib import Path

          a=json.load(open('/tmp/editor-news-assignments.json',encoding='utf-8'))
          execution=[]
          p=Path('/tmp/editor-news-execution.jsonl')
          if p.is_file():
              execution=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          a['execution']=execution
          a['dispatchedCount']=sum(1 for x in execution if x.get('dispatched'))
          a['alreadyActiveCount']=sum(1 for x in execution if x.get('reason')=='already-active')
          a['dispatchFailureCount']=sum(1 for x in execution if x.get('reason')=='dispatch-failed')
          a['blockedExecutionCount']=sum(1 for x in execution if x.get('reason')=='blocked')
          a['stuckExecutionCount']=sum(1 for x in execution if x.get('reason')=='stuck')
          Path('/tmp/editor-news-assignments-final.json').write_text(
              json.dumps(a,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8',
          )
          PY

          rm -rf /tmp/editor-assignments-publish
          mkdir -p /tmp/editor-assignments-publish/data
          cp /tmp/editor-news-assignments-final.json /tmp/editor-assignments-publish/data/newsroom-assignments.json
          cd /tmp/editor-assignments-publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b editor-assignments
          git add data/newsroom-assignments.json
          git commit -q -m "Update Editor-in-Chief newsroom assignments"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin editor-assignments

      - name: Final control-plane verdict
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"reason":"dispatch-failed"' /tmp/editor-news-execution.jsonl 2>/dev/null; then
            echo "Editor-in-Chief could not dispatch one or more assigned Robots." >&2
            exit 1
          fi
          stuck="$(python -c 'import json; print(int(json.load(open("/tmp/editor-news-assignments.json",encoding="utf-8")).get("stuckCount") or 0))')"
          if [ "$stuck" -gt 0 ]; then
            echo "EDITOR_ASSIGNMENT_STUCK count=$stuck; identical retry blocked and Editor-in-Chief replanning required." >&2
            exit 1
          fi
          echo "EDITOR_IN_CHIEF_NEWSROOM_ASSIGNMENT_PASS"

