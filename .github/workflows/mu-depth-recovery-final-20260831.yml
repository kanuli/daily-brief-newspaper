name: Final MU Desk Recovery 2026-08-31
on:
  push:
    branches: [main]
    paths: [.github/workflows/mu-depth-recovery-final-20260831.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/desk-latest.json'); d=json.loads(p.read_text(encoding='utf-8'))
          base={'desk':'manchester-united','status':'LATEST','deskSlugs':['manchester-united'],'sectionLabel':'曼聯','mediaLabel':'曼聯','image':None}
          def s(id,title,dek,summary,body,context,why,watch,source,url,sources,section='曼聯｜最新'):
              return {**base,'id':id,'title':title,'dek':dek,'summary':summary,'body':body,'context':context,'why':why,'watchNext':watch,'sourceName':source,'sourceUrl':url,'timeLabel':'8月30至31日核實','sources':sources,'section':section}
          mu=[
          s('mu-ipswich-5-2-20260831','曼聯5：2大勝葉士域治　般奴費南迪斯帽子戲法領軍取得新季首勝','卡域克球隊主場反彈，般奴費南迪斯攻入三球，拉舒福特亦相隔逾600日再次為曼聯正選。','曼聯在英超主場以5：2擊敗葉士域治，取得新季首場勝仗；隊長般奴費南迪斯完成帽子戲法。','曼聯在奧脫福以5：2擊敗葉士域治。客軍先開紀錄後，般奴費南迪斯追平，曼聯其後藉對手烏龍及般奴再入兩球拉開比分，麥比奧亦取得入球。\n\n今場亦是拉舒福特自2024年後首次再為曼聯正選。曼聯在開季首戰不敵侯城後迅速反彈，取得卡域克今季首場聯賽勝利。','曼聯開季首輪0：2不敵侯城，今場是首個主場聯賽賽事。','大勝及般奴帽子戲法直接改變曼聯開季氣氛，亦為卡域克的陣容調整提供首個正面結果。','留意下一輪正選安排、傷兵復出時間及拉舒福特能否持續獲得上陣機會。','Reuters','https://www.reuters.com/sports/soccer/alonso-vibrant-chelsea-beat-brighton-fernandes-hits-hat-trick-man-utd-2026-08-30/',[{'name':'Reuters','url':'https://www.reuters.com/sports/soccer/alonso-vibrant-chelsea-beat-brighton-fernandes-hits-hat-trick-man-utd-2026-08-30/'},{'name':'Reuters','url':'https://www.reuters.com/sports/soccer/assist-king-fernandes-turns-provider-predator-man-united-romp-2026-08-30/'}],'曼聯｜英超'),
          s('mu-collyer-west-brom-complete-20260830','高利亞正式永久轉投西布朗　結束曼聯生涯並簽約四年','西布朗8月30日確認完成交易；高利亞上季曾外借該會，今次以永久形式重返山楂球場。','曼聯中場高利亞已完成永久轉會西布朗並簽下四年合約。','西布朗8月30日正式確認，22歲中場高利亞由曼聯永久加盟，並簽下四年合約。高利亞上季曾外借西布朗，其後轉往侯城。\n\n今次正式公告把早前仍處於協議階段的消息確認為已完成交易；球員表示希望透過更多一隊分鐘推進職業生涯。','曼聯今夏大幅重整中場，高利亞的上陣空間進一步收窄。','正式出售青訓中場既精簡陣容，也確認曼聯在關窗前持續處理邊緣球員去留。','留意高利亞在西布朗的首次上陣及曼聯轉會窗最後調整。','West Bromwich Albion／Manchester United','https://www.wba.co.uk/news/albion-complete-signing-toby-collyer',[{'name':'West Bromwich Albion','url':'https://www.wba.co.uk/news/albion-complete-signing-toby-collyer'},{'name':'Manchester United','url':'https://www.manutd.com/en/news/detail/toby-collyer-completes-permanent-transfer-to-west-brom'}],'曼聯｜轉會／青訓'),
          s('mu-louis-jackson-st-mirren-20260830','曼聯青訓中堅 Louis Jackson 永久加盟聖美倫　簽兩年另加一年選項','20歲守將離開曼聯尋求穩定一隊機會，加盟蘇超聖美倫後已進入比賽名單。','Louis Jackson 已由曼聯永久轉投聖美倫，簽下兩年合約並附帶一年延長選項。','聖美倫確認20歲中堅 Louis Jackson 由曼聯永久加盟，合約為期兩年，球會另有一年延長選項。Jackson 出身曼聯青訓，上季外借 Solihull Moors 累積成年隊經驗。\n\nJackson 表示現階段永久離隊是推進職業生涯的合適時機，希望在重視年輕球員發展的聖美倫爭取穩定上陣。','曼聯正於轉會窗尾段整理青訓及U21梯隊。','Jackson 的永久離隊是獨立青訓出口事件，亦影響曼聯U21防線配置。','留意 Jackson 的首次正式上陣及曼聯其他青訓球員去留。','St Mirren／BBC Sport','https://www.stmirren.com/all-news/5947-louis-jackson-joins-st-mirren',[{'name':'St Mirren','url':'https://www.stmirren.com/all-news/5947-louis-jackson-joins-st-mirren'},{'name':'BBC Sport','url':'https://www.bbc.com/sport/football/articles/clyl4v4l5v4o'}],'曼聯｜轉會／青訓'),
          s('mu-ogunneye-arsenal-20260830','Habeeb Ogunneye 離開曼聯轉投阿仙奴　20歲右閘加入槍手青訓體系','Ogunneye 結束長年曼聯青訓生涯，8月30日完成轉會北倫敦。','曼聯青訓右閘 Habeeb Ogunneye 已完成轉會阿仙奴，阿仙奴青訓官方確認其加盟。','阿仙奴青訓8月30日確認，20歲右閘 Habeeb Ogunneye 已完成由曼聯轉會加盟。Ogunneye 長期在曼聯青訓成長，曾多次進入一隊比賽名單，上季亦曾外借 Newport County。\n\nOgunneye 出生於倫敦 Hackney，加盟後表示回到家鄉具有特別意義，並看重阿仙奴讓年輕球員晉升的路徑。','曼聯在一隊重建同時亦調整青訓梯隊。','直接轉投英超競爭對手青訓體系具有發展與人才流動意義。','留意 Ogunneye 在阿仙奴U21的註冊及首次上陣。','Arsenal Academy／The Sun','https://www.arsenal.com/news/habeeb-ogunneye-joins-our-academy',[{'name':'Arsenal Academy','url':'https://www.arsenal.com/news/habeeb-ogunneye-joins-our-academy'},{'name':'The Sun','url':'https://www.thesun.co.uk/sport/40220819/man-utd-transfer-habeeb-ogunneye-jackson/'}],'曼聯｜轉會／青訓')]
          d.setdefault('desks',{})['manchester-united']=mu
          d['generatedAt']='2026-08-31T12:18:00+08:00'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert len(mu)==4 and len({x['id'] for x in mu})==4
          PY
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/desk-latest.json
          git commit -m 'Recover Manchester United current unique depth'
          git push origin HEAD:main
